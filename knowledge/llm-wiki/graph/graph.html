    "markdown": "---\ntitle: \"Portal composition and service relationships\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/architecture/ARC-portal-service-relationships.md\nsource: raw/workbench/knowledge/candidates/architecture/ARC-portal-service-relationships.md\nsource_hash: 08e3b5a80b6eef6d\nlast_updated: 2026-11-11\ncandidate_id: ARC-portal-service-relationships\ncandidate_version: 1\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: \nworkbench_origin: knowledge/candidates/architecture/ARC-portal-service-relationships.md\nworkbench_sha256: 08e3b5a80b6eef6d5c420b0b2be787753d2200b3587c617b83a206bc1e9d3db5\nworkbench_status: candidate-derived\n---\n\n# Portal composition and service relationships\n\n## Scope\n\nThe user supplied the [architecture clarification](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/user-message.txt) on 22 October 2026.\nIt explains the portal layers, ingress, backend, SDK, and RATAN authentication responsibilities.\nThe [source review](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/source-review.json) checks selected local declarations.\nThis record changes no application behavior and grants no publication approval.\nThe clarification identifies no effective deployment, complete consumer inventory, or authenticated architecture owner.\n\n## Components\n\n### Four MFE layers\n\n| Order | Layer | Repository | Responsibility |\n| --- | --- | --- | --- |\n| 1 | Base | `mfe-root-config` | Supply HTML and static entry resources. Initialize Single-SPA and register only MFE Base. |\n| 2 | Shell | `mfe-base` | Supply themes, login, logout, sessions, tiles, drawers, and remote container loading. |\n| 3 | Container | `mfe-ratan-container` | Supply application routing, shared components, utilities, and related services. |\n| 4 | Tile | `mfe-cashflow-blotter` example | Render feature views and application functionality. |\n\nThe [user clarification](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/user-message.txt#L7-L10) supplies this responsibility model.\nRoot layout declares only `@fm/base`.\nSee the [layout](../../../../repos/ui/mfe-root-config/src/microfrontend-layout.html#L1-L5) and [root bootstrap](../../../../repos/ui/mfe-root-config/src/root.ts#L10-L27).\nThe [source review](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/source-review.json) records file hashes and independent revisions.\n\n### Backend and infrastructure roles\n\n| Component | User-reported responsibility | Source qualification |\n| --- | --- | --- |\n| Nginx | First ingress endpoint; rules belong to the RATAN Ansible load-balancer scope. | Local templates exist. The wider Ansible repository and rendered deployment are unavailable. |\n| API Gateway | Second ingress endpoint; forwards requests to application services. | No gateway repository is available. Implementation analysis remains excluded. |\n| Single UI BFF | Sole backend for the described portal scope; authentication, sessions, administration, and analytics. | Source declares corresponding endpoints. The health-management label has no confirmed dedicated endpoint. |\n| Single UI SDK starter | Java library for application backend JWT validation. | Source supplies a conditional servlet filter. Universal consumer adoption remains unconfirmed. |\n| RATAN Auth Server | Internal service authentication and external API caller authorization. | Source supports several strategies. Not every reported provider appears in this copy. |\n\nThe [user clarification](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/user-message.txt#L16-L22) supplies these roles.\nThe [source review](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/source-review.json) separates inspected declarations from reported scope.\nThe SDK remains a library. Its repository does not establish a deployed service or public endpoint.\n\n## Interfaces\n\n### Loading, routing, and props\n\nSingle-SPA registers the shell; SystemJS loads named modules.\nThe shell selects `props.container` and forwards `module`, `tile`, `parameters`, `panelId`, and `tabId`.\nSee the [shell loader](../../../../repos/ui/mfe-base/src/pages/Home/common/Container.tsx#L10-L32).\n\nThe container uses `props.module` to select its route.\nA selected loader imports the tile and forwards props.\nSee the [container routing](../../../../repos/ui/mfe-ratan-container/src/Root/routing/common/useController.ts#L6-L13) and [tile loader](../../../../repos/ui/mfe-ratan-container/src/Root/import/CashFlowCN.tsx#L7-L20).\nThe tile uses `props.tile` for its feature route.\nSee the [tile routing](../../../../repos/ui/mfe-cashflow-blotter/src/Root/routing/common/useController.ts#L7-L15).\n\nThese are distinct routing and loading stages.\nShared-code imports also flow from containers and tiles back to shell and container libraries.\nThe [tile imports](../../../../repos/ui/mfe-cashflow-blotter/src/Root/import/ratancomponents/index.ts#L2-L75) show shared container reuse.\nThe user describes JavaScript entry bundles. Lazy loading permits additional chunks.\nThe [source review](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/source-review.json) retains that qualification.\n\n### HTTP and token interfaces\n\nThe user reports a common public domain with DNS forwarding to Nginx, followed by API Gateway.\nThe logical MFE-to-BFF contract remains distinct from this reported transport path.\nDNS, effective upstreams, gateway routes, and active deployment remain unverified.\nThe [Nginx template](../../../../repos/infra/nginx/ratan_servers.conf.j2#L150-L256) includes gateway routes and direct proxy exceptions.\n\nThe shared frontend interceptor uses `Single-UI-Authorization`.\nAuthentication, analytics, and SSE requests include exceptions; relogin uses `Single-UI-Refresh`.\nSee the [request interceptor](../../../../repos/ui/mfe-base/src/hooks/service/util/success.request.handler.ts#L17-L28).\nThe [SDK filter](../../../../repos/libraries/single-ui-sdk-starter/single-ui-sdk-starter/src/main/java/com/scb/fmoportal/auth/filter/AuthTokenFilter.java#L83-L108) validates supported requests and supplies attributes.\n\n## Dependencies\n\n### Portal and SDK boundaries\n\nThe user reports Single UI BFF as the sole backend in this portal scope.\nThis does not establish that RATAN has one backend across every application.\nSDK adoption across application backends remains reported architecture because those exact consumers are unavailable.\nThe [SDK configuration](../../../../repos/libraries/single-ui-sdk-starter/single-ui-sdk-starter/src/main/java/com/scb/fmoportal/auth/config/AuthConfiguration.java#L19-L31) conditionally registers validation.\n\n### RATAN authentication and authorization\n\nThe user reports authentication delegation to OUD, Entra SPN, and FMAA.\nThe user reports authorization delegation to EMS2 and EMS3.\nThe [source review](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/source-review.json) supports local OUD, FMAA, and EMS2 paths.\n\nThis Auth Server copy has no identified Entra SPN or EMS3 implementation.\nBFF separately contains [Entra token exchange](../../../../repos/services/single-ui-bff/src/main/java/com/scb/sso/singleuibff/service/v1/implementation/EntraAuthenticationServiceImpl.java#L41-L57) and [EMS3 calls](../../../../repos/services/single-ui-bff/src/main/java/com/scb/sso/singleuibff/service/v2/filter/ems3/Ems3EntitlementService.java#L85-L93).\nThese source paths remain relevant. The clarification does not replace them with an inferred Auth Server hop.\nThe reported Auth Server scope does not prove that every portal request invokes this service.\n\n## Decisions\n\nRetain the explanation as candidate architecture with source qualifications.\nKeep reported topology separate from source-extracted joins and runtime verification.\nKeep API Gateway visible as an unavailable boundary without inspecting its implementation.\nThis record authorizes no business implementation, release, or publication.\n\n## Connections\n\nFrontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) retains historical design context and links this clarification.\nAuthentication and sessions ([[wb-candidate-security-kt-authentication-and-sessions]]) retains portal authentication and policy context.\nSDK and entitlements ([[wb-candidate-security-kt-sdk-and-entitlements]]) retains token and authorization distinctions.\nThose policy records retain their separate versions, sources, and review state.\n\n## Evidence limits\n\n| Evidence | Consequence | Owner | Next action |\n| --- | --- | --- | --- |\n| User clarification has no deployment identifier. | Reported topology cannot establish active DNS or gateway forwarding. | unknown | Obtain effective configuration when deployment confirmation becomes necessary. |\n| Nginx templates include direct proxy routes. | The supplied copy cannot establish universal gateway traversal. | unknown | Compare rendered routes with the reported environment. |\n| Auth copy lacks identified Entra SPN and EMS3 integrations. | Reported provider delegation remains unconfirmed locally. | unknown | Inspect the applicable Auth revision when implementation confirmation becomes necessary. |\n| BFF has admin endpoints but no identified health-management controller. | That responsibility has no exact endpoint mapping. | unknown | Clarify the term when endpoint-level analysis requires it. |\n| Four repositories have no independent Git history. | Hashes identify inspected files without an upstream commit. | unknown | Obtain original repository revisions when available. |\n\nThe [source review](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/source-review.json) retains exact locators, hashes, revisions, and source limits.\nThis review executed no live requests, browser behavior, or business tests.\nNo required business behavior changed, so this record adds no acceptance criterion.\n",

    "markdown": "---\ntitle: \"Portal release and tenant operation boundaries\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/operations/KT-release-operations.md\nsource: raw/workbench/knowledge/candidates/operations/KT-release-operations.md\nsource_hash: e81bca3a19c30837\nlast_updated: 2026-11-11\ncandidate_id: KT-release-operations\ncandidate_version: 2\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: operations\nworkbench_origin: knowledge/candidates/operations/KT-release-operations.md\nworkbench_sha256: e81bca3a19c3083724b84ef78b5d3b0c47546d380624043019e1d493f471f1cb\nworkbench_status: candidate-derived\n---\n\n# Portal release and tenant operation boundaries\n\n## Scope\n\nThis topic connects release planning with tenant configuration promotion and production readiness.\nThe supplied materials contain procedures, an unfinished checklist, historical deployment guidance, and a release proposal.\nTheir current authority remains unconfirmed.\n\n## Summary\n\nPortal changes and tenant deployments have separate responsibilities.\nConfiguration promotion connects tenant metadata, routing, authentication, entitlements, and validation.\nTechnical deployment and business activation require distinct evidence.\nThe release proposal contains unresolved duration and confirmation rules.\n\n## Documented knowledge\n\n### Ownership and release scope\n\nThe proposal covers Portal routing, route enabling, tenant interfaces, and Portal-owned production changes.\nTenant teams retain responsibility for their UI, backend, services, databases, and infrastructure.\nPortal teams execute Portal releases and routing rollback.\nTenant teams validate their applications, perform UVT, and support tenant issues.\nThese are documented responsibility statements, without confirmed present approval.\n[Release proposal, sections 2 and 7, lines 25–40 and 119–131](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/page.md#L25>)\n\n### Readiness before scheduling\n\nThe proposal requests solution intent, user profiles, routing details, connectivity checks, UAT sign-off, and rollback planning.\nNew interfaces require 30 days of engagement under the proposal.\nThe unfinished checklist adds SDK validation, shared frontend requests, entitlement checks, disaster recovery, and performance inputs.\nIt also identifies operating agreements and penetration testing as onboarding inputs.\nThese statements describe requested readiness, without proving completed checks.\n[Release proposal, sections 4–5, lines 58–98](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/page.md#L58>)\n[Checklist, lines 1–29](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Admin Module Release Flow/Admin Module Release Checklist Template/page.md#L1>)\n\n### Configuration promotion\n\nThe documented flow starts with Module Map, Drawer Category, and Tile Configuration changes in Development.\nTeams export those records as CSV files and retain them in a tenant-owned repository.\nAn ADO pipeline then uploads configuration to the Portal Admin service.\nThe documented upload interface is `/api/auth/v1/fmo/admin/config/upload`.\nThe flow states that the service validates an FMAA JWT before processing CSV files.\nThis describes the procedure; this ingestion inspected no upload execution.\n[Admin release flow, lines 3–24](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Admin Module Release Flow/page.md#L3>)\n\nThe first bulk insert into UAT and Production uses a separate BFF release under this guide.\nLater uploads depend on tenant connectivity to the Admin service.\nThe checklist also flags planned FMAA decommissioning.\nThat warning creates an unresolved dependency for the documented promotion workflow.\n[Admin release flow, lines 14–17 and 53–57](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Admin Module Release Flow/page.md#L14>)\n[Checklist, line 16](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Admin Module Release Flow/Admin Module Release Checklist Template/page.md#L16>)\n\n### Tenant capabilities described in requests\n\nRelease requests explain why tenant tiles need Portal integration.\nThe following descriptions identify intended business functions from those requests.\nThey do not establish approved detailed rules, release completion, or present availability.\n\n| Requested capability | Documented purpose | Evidence |\n| --- | --- | --- |\n| FSS Cash Projection | Supply a cash-projection rule-engine tile. | [Cash Projection request, lines 9–10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSS DS Cash Projection Change Request/page.md#L9>) |\n| FSS Funds Gating | Limit investor redemptions to a percentage of daily net asset value. | [FSS capability descriptions, line 10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSS Gating, SSI, CA Domestic and Gold Custody Change Request/page.md#L10>) |\n| FSS SSI | Generate settlement instructions from stored agent accounts, with email and download options. | [FSS capability descriptions, line 10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSS Gating, SSI, CA Domestic and Gold Custody Change Request/page.md#L10>) |\n| FSS Domestic Disbursement | Reconcile depository files and create MT566 messages after credit for downstream processing. | [FSS capability descriptions, line 10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSS Gating, SSI, CA Domestic and Gold Custody Change Request/page.md#L10>) |\n| FSS Gold Custody | Capture purchases and sales, settle services, and produce daily position updates. | [FSS capability descriptions, line 10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSS Gating, SSI, CA Domestic and Gold Custody Change Request/page.md#L10>) |\n| FSS Digital Asset Collateral | Support collateral use of custodied digital assets and counterparty-risk reduction. | [FSS capability descriptions, line 10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSS Gating, SSI, CA Domestic and Gold Custody Change Request/page.md#L10>) |\n| DDR Reporting | Show reports received from upstream systems and forwarded downstream. | [DDR request, lines 4–5](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSSDS Data Distribution and Reporting (DDR)/page.md#L4>) |\n| CDUPS Confirmation | Manage outbound confirmation documents and inbound confirmations in separate blotters. | [CDUPS request, lines 9–10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/Markets Operation One Change Request - CDUPS/page.md#L9>) |\n| VPA Fix Link | Correct broken links so subsequent trade processing can continue. | [VPA request, lines 9–10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/VPA Fix-link and Monitor Change Request/page.md#L9>) |\n| VPA Trade Monitor | Monitor trade status and retrieve source and transformed files. | [VPA request, lines 9–10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/VPA Fix-link and Monitor Change Request/page.md#L9>) |\n\n### Release window proposal\n\nThe proposal schedules first, third, and available fifth Saturdays, starting at 09:00 SGT.\nIt freezes scope after Monday EOD in the first week of the release window.\nIt cancels windows without requests and requires approved exceptions for late additions.\nFreeze periods require rescheduling or dispensation under the proposal.\nThese rules remain proposed context pending authority and ambiguity resolution.\n[Release proposal, sections 3–6, lines 44–115](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/page.md#L44>)\n\nThe summary specifies 24 hours, while the detailed table specifies 10 hours and a 19:00 SGT finish.\nThe urgent-release section requires all confirmations but also permits proceeding when nobody raises concerns.\nSilence and explicit confirmation are different conditions.\nThis topic does not choose between these alternatives.\n[Release proposal, lines 17–19, 50–52, and 144–151](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/page.md#L17>)\n\n### Technical and business activation\n\nThe release calendar distinguishes Portal release dates from tenant release dates.\nIt also lists separate Entra technical and business go-live entries.\nThe OpenFin briefing similarly separates technical onboarding from business user onboarding.\nA calendar entry establishes planning context, without proving deployment, approval, or successful adoption.\n[Release calendar, lines 5–16](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/page.md#L5>)\n[OpenFin briefing, release phases, lines 157–163](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/Ratan OpenFin Briefing/page.md#L157>)\n\nThe DDR request states that business UAT sign-off follows technical go-live.\nIt lists separate technical and business target dates.\nThe VPA request also separates Portal and application go-live dates.\nThe request template explicitly allows Portal deployment before the application deployment.\nThese records describe sequencing; their dates do not prove completed deployments or business acceptance.\n[DDR request, lines 9–17](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSSDS Data Distribution and Reporting (DDR)/page.md#L9>)\n[VPA request, lines 20–22](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/VPA Fix-link and Monitor Change Request/page.md#L20>)\n[Request template, lines 21–23](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/[Template] Markets Operations One Change Request/page.md#L21>)\n\nRequests also expose incomplete readiness evidence.\nThe CDUPS request leaves UAT sign-off, user profiles, user counts, and UVT details unprovided.\nThe DDR request records pending connectivity and separates technical sign-off from business validation.\nSeveral VPA evidence references are struck through.\nMissing or withdrawn references cannot establish the corresponding release gate.\n[CDUPS request, lines 14–21](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/Markets Operation One Change Request - CDUPS/page.md#L14>)\n[DDR request, lines 9–13](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/FSSDS Data Distribution and Reporting (DDR)/page.md#L9>)\n[VPA request, lines 12–22](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/VPA Fix-link and Monitor Change Request/page.md#L12>)\n\nThe blank request template includes DNS resolution and expected total, new, and concurrent users.\nIt asks separately for routing changes, connectivity evidence, sign-off, and UVT contacts.\nThese are expected request fields, without evidence that a specific request satisfies them.\n[Request template, lines 9–23](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operations One Release Calendar/[Template] Markets Operations One Change Request/page.md#L9>)\n\n### Deployment evolution\n\nThe older frontend deployment guide describes static artifacts and a proposed blue-green model.\nIts Pilot and Production environments share a backend.\nThe guide separates feature checks, artifact publication, and manual production deployment after approval.\nThe Nginx draft proposes versioned configuration, syntax checks, restart checks, and rollback.\nNeither document establishes the currently deployed pipeline.\n[Frontend deployment, lines 3–11 and 41–73](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Micro-Frontend Deployment/page.md#L3>)\n[Nginx deployment draft, lines 1–34](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Drafts/Nginx Automated Deployment Solution/page.md#L1>)\n\nThe production checklist recommends Portal connections through tenant Nginx or load balancers.\nTenant teams then control internal server and port changes behind that boundary.\nIt separately requests browser reachability, Portal-to-tenant connectivity, operating agreements, security testing, and tile release.\nThese are distinct checks; successful configuration upload alone does not establish business readiness.\n[Production checklist, sections at lines 16, 22, 30, 40, and 71](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Production Release and Tenant on-boarding Checklist/page.md#L16>)\n\n## Connections\n\nAdmin and onboarding ([[wb-candidate-operations-kt-admin-and-onboarding]]) explains the configuration and entitlement inputs.\nFrontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) explains how registered modules become Portal workspaces.\nApplication interoperability ([[wb-candidate-interoperability-kt-application-interoperability]]) separates desktop technical onboarding from business adoption.\n\nRegistry IDs `single-ui-importmap-admin`, `single-ui-active-importmap`, and `single-ui-category-tile-admin` identify related candidate interfaces.\nCapability `single-ui-application-catalog` groups that declared context.\nThese connections establish navigation, without proving current routing, operational ownership, or passing execution.\n\n## Evidence limits\n\nLocal hashes identify the supplied bytes.\nOriginal page revisions, current authority, and human approval remain unconfirmed.\nSeveral diagrams, emails, and example projects referenced by these guides are absent from this supplied copy.\nNo pipeline, deployment, upload, rollback, or production access check ran during ingestion.\n\n## Open questions\n\n| Issue and evidence | Consequence | Owner | Next action |\n| --- | --- | --- | --- |\n| Release duration differs between summary and table. See release proposal, lines 17–19 and 50–52. | Release occupancy and standby planning remain uncertain. | unknown | Confirm one duration with the release policy owner. |\n| Urgent-release confirmation and silence rules coexist. See release proposal, lines 144–151. | A release could proceed without explicit stakeholder agreement. | unknown | Define required confirmations and the decision authority. |\n| Checklist remains under construction; FMAA decommissioning is planned. See checklist, lines 1 and 16. | Promotion prerequisites and authentication continuity remain uncertain. | unknown | Confirm the governing checklist and replacement authentication plan. |\n| Calendar separates technical and business dates without retained completion evidence. See calendar, lines 7–16. | Planned dates could be mistaken for delivered capability. | unknown | Link separate deployment, validation, and business activation records. |\n| Tenant requests contain pending or struck-through readiness evidence. See CDUPS, lines 14–21, DDR, lines 9–13, and VPA, lines 12–22. | A target date cannot establish release readiness or acceptance. | unknown | Retain applicable configuration, connectivity, sign-off, and UVT evidence for each gate. |\n| Deployment guides describe different historical and proposed mechanisms. See deployment and Nginx draft. | Teams could apply an unsuitable deployment procedure. | unknown | Identify the active pipeline and its environment-specific controls. |\n",

    "markdown": "---\ntitle: \"Portal service responsibilities\"\ntype: entity\ntags: [candidate-derived, architecture]\nsources: [wb-candidate-architecture-arc-portal-service-relationships, wb-candidate-architecture-kt-frontend-composition, wb-candidate-security-kt-sdk-and-entitlements, wb-candidate-background-kt-portal-purpose]\nworkbench_status: candidate-derived\n---\n\n# Portal service responsibilities\n\nThis entity page records responsibilities reported by the architecture candidates. It does not establish active topology, complete consumer inventory, deployment, or publication approval.\n\n## Frontend layers\n\n| Layer | Reported responsibility |\n| --- | --- |\n| Root Config | Entry resources and shell lifecycle initialization. |\n| Base shell | Themes, authentication, sessions, tiles, drawers, and container loading. |\n| Application container | Application routing, shared components, utilities, and related services. |\n| Feature tile | Feature views and application functionality. |\n\nThe four-layer distinction and ownership boundaries come from the architecture candidates. [[wb-candidate-architecture-arc-portal-service-relationships]] [[wb-candidate-architecture-kt-frontend-composition]]\n\n## Backend and infrastructure roles\n\nThe candidates describe Nginx and an API Gateway as ingress boundaries, the Single UI BFF as a Portal backend for authentication, sessions, administration, and analytics, the Single UI SDK starter as a JWT-validation library, and the RATAN Auth Server as an internal or external authorization boundary. [[wb-candidate-architecture-arc-portal-service-relationships]]\n\nThese reported roles do not prove that every request follows the same hop sequence or that the SDK is a deployed service. Authentication and token validation remain separate from application data permission enforcement. [[wb-candidate-security-kt-sdk-and-entitlements]]\n",

function hexToRgba(color, alpha) {
  if (!color) return `rgba(255, 255, 255, ${alpha})`;
  const normalized = color.replace("#", "");
  const value = normalized.length === 3
    ? normalized.split("").map(ch => ch + ch).join("")
    : normalized;
  const intValue = Number.parseInt(value, 16);
  const r = (intValue >> 16) & 255;
  const g = (intValue >> 8) & 255;
  const b = intValue & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function escapeHtml(text) {

    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function stripFrontmatter(markdown) {
  return (markdown || "").replace(/^---\n[\s\S]*?\n---\n?/, "");
}

function renderInlineMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

function renderMarkdown(markdown) {
  const lines = stripFrontmatter(markdown).split(/\r?\n/);
  const html = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];
  let quoteLines = [];
  let inCodeBlock = false;
  let codeLines = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
    paragraph = [];
  }

  function flushList() {
    if (!listType || !listItems.length) return;
    const items = listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("");
    html.push(`<${listType}>${items}</${listType}>`);
    listType = null;
    listItems = [];
  }

  function flushQuote() {
    if (!quoteLines.length) return;
    html.push(`<blockquote>${quoteLines.map(line => renderInlineMarkdown(line)).join("<br>")}</blockquote>`);
    quoteLines = [];
  }

  function flushCode() {
    if (!codeLines.length) {
      html.push("<pre><code></code></pre>");
      return;
    }
    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
    codeLines = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.replace(/\t/g, "    ");
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      flushParagraph();
      flushList();
      flushQuote();
      if (inCodeBlock) {
        flushCode();
        inCodeBlock = false;
      } else {
        inCodeBlock = true;
      }
      continue;
    }

    if (inCodeBlock) {
      codeLines.push(rawLine);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushQuote();
      continue;
    }

    const headingMatch = trimmed.match(/^(#(1, 6))\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      flushQuote();
      const level = headingMatch[1].length;
      html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
      continue;
    }

    if (/^(-(3,)|\*(3,))$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      html.push("<hr>");
      continue;
    }

    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      flushParagraph();
      flushList();
      quoteLines.push(quoteMatch[1]);
      continue;
    }
    flushQuote();

    const unorderedMatch = trimmed.match(/^[-*]\s+(.+)$/);
    if (unorderedMatch) {
      flushParagraph();
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(unorderedMatch[1]);
      continue;
    }

    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(orderedMatch[1]);
      continue;
    }

    flushList();
    paragraph.push(trimmed);
  }

  if (inCodeBlock) flushCode();
  flushParagraph();
  flushList();
  flushQuote();
  return html.join("");
}

function rebuildAdjacency(filteredEdges) {
  adjacency.clear();
  for (const node of originalNodes) {
    adjacency.set(node.id, new Set());
  }
  for (const edge of filteredEdges) {
    if (!adjacency.has(edge.from)) adjacency.set(edge.from, new Set());
    if (!adjacency.has(edge.to)) adjacency.set(edge.to, new Set());
    adjacency.get(edge.from).add(edge.to);
    adjacency.get(edge.to).add(edge.from);
  }
}

function currentEdgeState() {
  const minConf = parseInt(controls.confSlider.value, 10) / 100;
  controls.confValue.textContent = minConf.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf,
  };
}

function passesEdgeFilters(edge, edgeState) {
  const typeOk = (edge.type === "EXTRACTED" && edgeState.showExtracted)
    || (edge.type === "INFERRED" && edgeState.showInferred)
    || (edge.type === "AMBIGUOUS" && edgeState.showAmbiguous);
  const confOk = (edge.confidence ?? 1.0) >= edgeState.minConf;
  return typeOk && confOk;
}

function searchNodes(q) {
  applyFilters(q, activeNodeId);
}

function clearSelection() {
  activeNodeId = null;
  closeDrawer();
  applyFilters(searchInput.value, null);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}

function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const communityText = Number.isInteger(node.group) && node.group >= 0 ? ` · community ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${communityText}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-preview").textContent = node.preview || "";
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");

  const relatedList = document.getElementById("drawer-related-list");
  relatedList.innerHTML = "";
  const relatedNodes = originalNodes
    .filter(item => relatedIds.has(item.id) && item.id !== node.id)
    .sort((a, b) => a.label.localeCompare(b.label));

  if (relatedNodes.length === 0) {
    const empty = document.createElement("span");
    empty.textContent = "No directly connected nodes";
    relatedList.appendChild(empty);
    return;
  }

  for (const related of relatedNodes) {
    const chip = document.createElement("button");
    chip.className = "related-chip";
    chip.textContent = related.label;
    chip.onclick = () => focusNode(related.id);
    relatedList.appendChild(chip);
  }
}

function applyFilters(query = searchInput.value, selectedNodeId = activeNodeId) {
  const lower = (query || "").trim().toLowerCase();
  const edgeState = currentEdgeState();
  const filteredEdges = originalEdges.filter(edge => passesEdgeFilters(edge, edgeState));
  rebuildAdjacency(filteredEdges);

  const relatedIds = selectedNodeId
    ? new Set([selectedNodeId, ...(adjacency.get(selectedNodeId) || [])])
    : null;
  const filteredNodeIds = new Set();
  for (const edge of filteredEdges) {
    filteredNodeIds.add(edge.from);
    filteredNodeIds.add(edge.to);
  }

  let visibleNodeCount = 0;
  const nodeUpdates = originalNodes.map(node => {
    const matchesSearch = !lower || node.label.toLowerCase().includes(lower);
    const isActive = selectedNodeId === node.id;
    const isConnected = filteredNodeIds.has(node.id);
    const isRelated = !relatedIds || relatedIds.has(node.id);
    const hidden = !selectedNodeId && !lower && !isConnected;
    const emphasized = matchesSearch && isRelated && (isConnected || !!lower || isActive);

    if (!hidden) {
      visibleNodeCount += 1;
    }

    return {
      id: node.id,
      hidden,
      color: {
        background: emphasized ? node.color : hexToRgba(node.color, hidden ? 0.05 : 0.14),
        border: emphasized ? hexToRgba(node.color, 0.96) : hexToRgba(node.color, hidden ? 0.08 : 0.22),
        highlight: { background: node.color, border: hexToRgba(node.color, 1) },
        hover: { background: node.color, border: hexToRgba(node.color, 1) },
      },
      font: {
        color: emphasized ? "#f2f3f8" : hidden ? "rgba(242,243,248,0.08)" : "rgba(242,243,248,0.2)",
      },
      borderWidth: isActive ? 5 : 2,
      size: isActive ? 18 : 12,
    };
  });

  const edgeUpdates = originalEdges.map(edge => {
    const enabled = passesEdgeFilters(edge, edgeState);
    if (!enabled) {
      return { id: edge.id, hidden: true };
    }

    const matchesSearch = !lower
      || nodeMap.get(edge.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(edge.to)?.label.toLowerCase().includes(lower);
    const isRelated = !relatedIds || relatedIds.has(edge.from) || relatedIds.has(edge.to);
    const touchesActive = !!selectedNodeId && (edge.from === selectedNodeId || edge.to === selectedNodeId);
    const emphasized = matchesSearch && isRelated;

    return {
      id: edge.id,
      hidden: false,
      width: touchesActive ? 2.8 : emphasized ? 1.2 : 0.6,
      color: emphasized ? edge.color : hexToRgba(edge.color, 0.08),
    };
  });

  nodes.update(nodeUpdates);
  edges.update(edgeUpdates);

  if (selectedNodeId) {
    const activeNode = nodeMap.get(selectedNodeId);
    if (activeNode) {
      openDrawer(activeNode, relatedIds || new Set([selectedNodeId]));
    }
  }

  const focusSuffix = selectedNodeId && nodeMap.get(selectedNodeId)
    ? ` · focused: ${nodeMap.get(selectedNodeId).label}`
    : "";
  stats.textContent = `${visibleNodeCount} nodes · ${filteredEdges.length} edges${focusSuffix}`;
}

const container = document.getElementById("graph");

// Adaptive physics based on graph size
const nodeCount = originalNodes.length;
const gravConst = nodeCount > 80 ? -8000 : nodeCount > 30 ? -5000 : -2000;
const springLen = nodeCount > 80 ? 250 : nodeCount > 30 ? 200 : 150;

const network = new vis.Network(container, { nodes, edges }, {
  nodes: {
    shape: "dot",
    font: { color: "#ddd", size: 12, strokeWidth: 3, strokeColor: "#111" },
    borderWidth: 1.5,
    scaling: {
      min: 8,
      max: 40,
      label: { enabled: true, min: 10, max: 20, drawThreshold: 6, maxVisible: 24 },
    },
  },
  edges: {
    width: 0.8,
    smooth: { type: "continuous" },
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    color: { inherit: false },
    hoverWidth: 2,
  },
  physics: {
    stabilization: { iterations: 250, updateInterval: 25, fit: true },
    barnesHut: { gravitationalConstant: gravConst, springLength: springLen, springConstant: 0.02, damping: 0.15 },
    minVelocity: 0.75,
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
});

// Ensure the graph fits the viewport after physics stabilization
network.once("stabilizationIterationsDone", function () {
  network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
});

function focusNode(nodeId) {
  activeNodeId = nodeId;
  applyFilters(searchInput.value, nodeId);
  const node = nodeMap.get(nodeId) || nodes.get(nodeId);
  const relatedIds = new Set([nodeId, ...(adjacency.get(nodeId) || [])]);
  openDrawer(node, relatedIds);
  network.focus(nodeId, {
    scale: 1.1,
    animation: { duration: 300, easingFunction: "easeInOutQuad" },
  });
}

network.on("click", params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else {
    clearSelection();
  }
});

applyFilters();
</script>
</body>
</html>
