    "id": "sources/wb-candidate-observability-kt-observability-and-performance",
    "label": "Portal observability, performance, and cache behavior",
    "type": "source",
    "color": "#E91E63",
    "path": "wiki/sources/wb-candidate-observability-kt-observability-and-performance.md",
    "markdown": "---\ntitle: \"Portal observability, performance, and cache behavior\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/observability/KT-observability-and-performance.md\nsource: raw/workbench/knowledge/candidates/observability/KT-observability-and-performance.md\nsource_hash: c23c2cac937ba81b\nlast_updated: 2026-11-11\ncandidate_id: KT-observability-and-performance\ncandidate_version: 2\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: observability\nworkbench_origin: knowledge/candidates/observability/KT-observability-and-performance.md\nworkbench_sha256: c23c2cac937ba81bb8187f5514d99a51f34cd632ea1dd129e078e7137ab1850f\nworkbench_status: candidate-derived\n---\n\n# Portal observability, performance, and cache behavior\n\n## Scope\n\nThis topic connects user interaction analytics, frontend measurements, service throughput, and cache strategy.\nIt preserves historical observations separately from current operational requirements and capacity.\n\n## Summary\n\nAnalytics explain how users interact with Portal features.\nPerformance plans define measurements and workloads.\nCache strategy trades update detection against repeated asset requests.\nThe supplied reports do not establish current production capacity or approved service limits.\n\n## Documented knowledge\n\n### Interaction purpose and event vocabulary\n\nThe analytics introduction aims to understand interaction, improve adoption, and reduce time to value.\nThe design captures tiles, modals, workspace tabs, buttons, switches, and dropdowns.\nTiles and modals expose open and close events.\nTabs, buttons, and switches expose click events.\nDropdowns expose select events.\n[Analytics background, lines 1–5](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Analytics/page.md#L1>)\n[Analytics design, scope and events, lines 7–29](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Analytics/Design/page.md#L7>)\n\nThe documented event identity combines container, tile, and component name.\nOptional values and custom attributes describe interactions such as searches.\nThese fields connect an interaction to its UI context.\nThey do not define an approved vocabulary for every tenant event.\n[Analytics design, identifiers and specific attributes, lines 31–47](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Analytics/Design/page.md#L31>)\n\nThe example `useAnalytics` hook submits events to `/analytics/v1/fmo/print?extend=false`.\nThe surrounding prose gives `/api/analytics/v1/fmo/print?extend=false` as the requested API.\nThe example attaches session-derived authorization information for user identification.\nThe source also describes deriving client addresses from request headers and the remote address.\nThis topic records the design without copying credentials, tokens, or individual user data.\n[Analytics design, hook and request description, lines 117–129 and 222–241](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Analytics/Design/page.md#L117>)\n\n`AnalyticsData` declares 20 custom attribute fields.\n`AnalyticsType` declares 10, and the explanatory prose also refers to 10.\nThe supported producer, transport, and storage limit remains unresolved.\n[Analytics design, model declarations, lines 55–114](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Analytics/Design/page.md#L55>)\n\n### Usage dashboards\n\nThe dashboard guide reports nine dashboards for Portal usage.\nThey cover authentication, authentication errors, tiles, workspace movement, workspace additions, selected buttons, login choices, and themes.\nThe error dashboard exposes `traceId` for investigation.\nThe guide describes downloadable raw data for further analysis.\nIts Production dashboard URL remains a placeholder.\nThese statements do not prove present dashboard availability or data completeness.\n[Dashboard guide, lines 11–105](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Analytics/Analytic Dashboard in Kibana/page.md#L11>)\n\n### Frontend measurement intent\n\nThe monitoring page proposes weekly review of development performance.\nIt discusses login, post-login, and blotter rendering with cache and compression changes.\nThe May 2023 performance document is explicitly a draft.\nIts sign-off table has no attached approval or sign-off date.\nThe document therefore supplies historical test intent and reported measurements.\n[Monitoring introduction and scenarios, lines 1–41](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Performance Monitoring/page.md#L1>)\n[May 2023 performance document, history and sign-off, lines 5–36](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Performance Monitoring/FMO Post Trade Portal Frontend Performance Testing May 2023/page.md#L5>)\n\nThe draft lists five-second response time, 100 users, CPU below 50%, and JavaScript heap below 80%.\nThese are draft targets, without established current approval.\nIts scenarios cover login, home, trade, cashflow, exception, and rules pages.\nIts tools include browser performance monitoring and Lighthouse.\nThe plan assumes supporting APIs remain available and sufficiently responsive.\n[May 2023 document, NFR, scenarios, and tools, lines 68–89 and 188–226](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Performance Monitoring/FMO Post Trade Portal Frontend Performance Testing May 2023/page.md#L68>)\n\nThe draft reports login FCP 0.8 seconds and LCP 1.3 seconds.\nIt reports home FCP 0.9 seconds and LCP 1.3 seconds.\nThe underlying screenshots and measurement captures are absent from this supplied copy.\nThese reported values cannot establish present performance or capacity.\n[May 2023 document, result tables, lines 230–256](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Performance Monitoring/FMO Post Trade Portal Frontend Performance Testing May 2023/page.md#L230>)\n\n### Service throughput and capacity boundaries\n\nThe UAT throughput page describes 500 users, a 250-second ramp-up, and five iterations.\nIt reports 17,500 successful requests and a maximum response time of 2,023 milliseconds.\nThat maximum concerns `/api/auth/v2/sso/validate` in the reported test.\nThe source links a JMeter plan and result archive that are absent from this supplied copy.\nThe summary alone does not establish current production capacity or verified business behavior.\n[UAT throughput, workload and result summary, lines 11–42](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Throughput Testing in UAT/page.md#L11>)\n\nThe newer deployment page reports user estimates and additional performance figures.\nIt also describes expected future onboarding and architecture changes.\nThe associated test-result and metric materials are not supplied here.\nThose figures require their workload, time period, environment, and execution evidence before sizing decisions.\n[Portal new deployment, requirements and performance state, lines 3–47](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L3>)\n\n### Cache strategy and update limits\n\nThe cache guide proposes revalidation of layer entry files and longer caching of subsequent static files.\nIts table assigns 120 days to chunks, images, CSS, fonts, JSON, and icons.\nA changed entry should reference new subsequent files under the described approach.\nUsers still need logout or page refresh to obtain updated UI code.\nThe guide explicitly excludes a first-load improvement.\nThese are documented design rules; current response headers and build naming remain unverified.\n[Cache strategy, introduction, limitations, and expiry table, lines 1–43](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Performance Monitoring/MFE Cache Strategy/page.md#L1>)\n\n## Connections\n\nFrontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) explains the container and tile identities used in analytics.\nAuthentication and sessions ([[wb-candidate-security-kt-authentication-and-sessions]]) supplies context for login and session interaction events.\nArchitecture evolution ([[wb-candidate-evolution-kt-architecture-evolution]]) separates future sizing proposals from established implementation context.\n\nRegistry capability `single-ui-analytics` and contract `single-ui-analytics-proxy` provide related candidate interface context.\nCapability `single-ui-workspace-composition` provides the declared UI composition connection.\nThese identifiers do not prove deployed collection, dashboard coverage, or business behavior.\n\n## Evidence limits\n\nThe named non-functional requirements page contains no substantive text.\nIt supplies no accepted service targets or measurable acceptance criteria.\n[Empty NFR page, line 1](../../../candidates/evidence/knowledge/migration-20261020/cleanup.json>)\n\nLocal hashes identify supplied document bytes, without establishing original authority or current applicability.\nThe sources mix design examples, draft targets, reported results, and future planning.\nMissing diagrams, screenshots, JMeter plans, and execution archives limit verification.\nNo browser measurement, telemetry query, load test, or server-header check ran during ingestion.\nNo individual identity, credential, or token value is reproduced here.\n\n## Open questions\n\n| Issue and evidence | Consequence | Owner | Next action |\n| --- | --- | --- | --- |\n| Analytics models declare 20 and 10 custom attributes. See analytics design, lines 55–114. | Producers could send attributes that downstream systems omit. | unknown | Reconcile producer, transport, storage, and dashboard schemas. |\n| Historical results lack their referenced execution artifacts. See throughput, lines 25–44, and May 2023 results. | Current capacity and response time cannot be established. | unknown | Retain dated workloads, assertions, environments, results, and approved limits. |\n| Production dashboard address remains unresolved. See dashboard guide, lines 11–13. | Production observation coverage remains unknown. | unknown | Confirm dashboard access, event completeness, and operational ownership. |\n| Examples collect identity context and search values without retention rules. See analytics design, lines 43–47 and 88–114. | Approved collection and retention boundaries remain unclear. | unknown | Confirm permitted fields, access, redaction, and retention. |\n| Cache implementation section contains no configuration. See cache guide, line 45. | The documented strategy cannot prove deployed cache behavior. | unknown | Inspect current headers, entry revalidation, and chunk naming against the guide. |\n\nEvidence: The named NFR page is empty.\nConsequence: Historical test targets cannot be treated as accepted current service limits.\nOwner: unknown.\nNext action: obtain applicable NFR intent and reviewed measurable limits.\n",

    "markdown": "---\ntitle: \"SDK and entitlements\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/security/KT-sdk-and-entitlements.md\nsource: raw/workbench/knowledge/candidates/security/KT-sdk-and-entitlements.md\nsource_hash: 60ec27600b3c79ec\nlast_updated: 2026-11-11\ncandidate_id: KT-sdk-and-entitlements\ncandidate_version: 8\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: security\nworkbench_origin: knowledge/candidates/security/KT-sdk-and-entitlements.md\nworkbench_sha256: 60ec27600b3c79ec02b3dd5397e18037aed9d9857c7a30e6c6cc304822b93115\nworkbench_status: candidate-derived\n---\n\n# SDK and entitlements\n\n## Scope\n\nThis topic connects SDK integration instructions with entitlement retrieval and application permission responsibilities.\nThe materials cover several SDK generations and migration plans.\nThey do not establish the SDK versions or security controls deployed by individual services.\n\n## Summary\n\nThe [code baseline](../../../../tasks/portal-background-session-20261019/evidence/authentication/ARCH-authentication-runtime-baseline.md) records implemented behavior at exact repository revisions.\nThis topic retains document statements separately from that source-backed investigation.\n\nThe SDK guides describe a request filter that validates portal authentication tokens.\nThey expose user context and separate methods for entitlement retrieval.\nThe materials distinguish authentication tokens from entitlement tokens.\nApplication-level data permissions remain separate from portal tile visibility.\n\nFor all portal environments, the user selected denial when an authenticated SC user lacks any registered application entity entitlement.\nThe [entry answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/ui-q-002-source.json) and [scope answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/ui-q-002-scope-source.json) establish user-stated intent only.\nPolicy-owner authority and deployed enforcement remain unverified.\n\n## Documented knowledge\n\n### User-confirmed EMS2 to CES name migration\n\nThe user confirms that EMS2 `X_RATANONE` was renamed to CES `RATAN_ENTITLEMENT_RULE` during migration.\nThe [exact clarification](../../../../tasks/ces-entitlement-migration-20261102/evidence/user-input-20261030-field-equivalence.txt) is the high-priority reference, dated 30 October 2026.\nThis statement resolves the name correspondence for that migration scope.\nIt does not establish equivalent entity, application, subject, or role numeric identifiers.\nIt also does not establish role equivalence, deployment status, or publication approval.\nThe [field mapping](../../../../tasks/ces-entitlement-migration-20261102/03-output-mapping.md) separates these names from each system's identifier structures.\nOwner: unknown. Next action: retain that distinction when mapping consumers and permission definitions.\n\n### SDK 3.0.0 CES migration intent\n\nThe user selects `3.0.0` as the SDK migration version.\nThe SDK must preserve the old contract where possible and assess complete compatibility.\nThe SDK caller supplies the FMAA token. The user also requests tests.\nThe [exact clarification](../../../../evidence/knowledge/sources/user-clarifications/single-ui-sdk-ces-migration-20261101/user-clarification-implementation.md#exact-user-input) controls this scope from 1 November 2026.\n\nThis target preserves the meaning of existing role, subject, and action permission checks where supported CES evidence permits.\nThe compatibility objective does not authorize invented role attribution, extra grants, or a silently changed permission contract.\nUnmapped or unsupported meaning remains a compatibility gap for explicit review.\nThe [migration task](../../../../tasks/single-ui-sdk-ces-migration-20261101/10-change-review.md) holds the separate implementation and conformance evidence.\n\n#### SDK-CES-INTENT-AC-001\n\n```gherkin\nFeature: Preserve the SDK permission contract during CES migration\n  @SDK-CES-INTENT-AC-001\n  Scenario: Preserve equivalent role-scoped permissions\n    Given CES supplies the same role-scoped permissions required by the old SDK contract\n    When SDK version \"3.0.0\" returns the caller's permission map\n    Then the map contains 0 missing role-scoped permissions\n    And the map contains 0 unsupported additional role-scoped permissions\n    And each subject and action retains its required legacy meaning\n```\n\nThe missing and unsupported additional permission counts must each equal zero for the declared comparison scope.\nThis criterion does not assert that every CES response contains sufficient role information.\n\n#### SDK-CES-INTENT-AC-002\n\n```gherkin\nFeature: Use the SDK caller's FMAA token\n  @SDK-CES-INTENT-AC-002\n  Scenario: Authenticate a CES request with the supplied token\n    Given the SDK caller supplies one valid FMAA token for its CES request\n    When SDK version \"3.0.0\" requests that caller's configured CES entitlement scope\n    Then the request uses that supplied token as its bearer credential\n    And the SDK makes 0 independent FMAA token-acquisition requests\n```\n\nThe bearer credential must equal the caller-supplied token. Independent token-acquisition requests must total zero.\nThe input requests failure-handling suggestions. It does not select a failure policy or approve a proposed recommendation.\nOwner: unknown. Next action: review the proposed caller contract without treating implementation choices as approved policy.\n\n### Current user-stated portal-entry rule\n\nAn authenticated SC user with no entitlement for any registered application entity must be denied portal entry.\nThe user selected local, test, UAT, and production environments.\nThe selection defines no HTTP status, denial wording, or additional entity-versus-role semantics.\nThe [owner answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/ui-q-002-owner-source.json) identifies `portal team` for this policy only.\nUser identity and applicable implementation version remain unknown. Portal-team authority and approval remain unconfirmed.\n\nEmpty-entity approval and enforcement remain a separate [open question](../../../../tasks/ui-test-coverage-20261022/05-entry-clarification.md#empty-entity-configuration).\n\nThe [draft principles, line 14](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Principles (Draft)/page.md#L14>) state the same denial direction.\nThe [older tile-security proposal, line 7](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Technical Design and Document/Tile Security Control - EMS2/page.md#L7>) permits entry for SC accounts.\nThat conflicting proposal remains historical evidence, not the selected user intent.\nThis clarification does not select other tile-security rules or grant publication approval.\n\n#### UI-ENTRY-AC-001\n\nThis business criterion records user-stated intent only.\nIt is not a new executable case or an assertion of approved policy.\n\n```gherkin\nFeature: User-stated portal entry restriction\n  @UI-ENTRY-AC-001\n  Scenario: Deny entry without a registered application entity entitlement\n    Given an authenticated SC user\n    And the user has no entitlement for any application entity registered in the portal\n    When the user attempts portal entry\n    Then the portal denies entry to the user\n    And the portal grants 0 entries for that attempt\n```\n\n```yaml\nacceptance_criteria:\n  - id: UI-ENTRY-AC-001\n    given: Given an authenticated SC user has no entitlement for any registered application entity\n    when: When the user attempts portal entry\n    then: Then the portal grants 0 entries for that attempt\n    measure:\n      metric: portal entries granted for the attempt\n      operator: equals\n      value: 0\n      unit: entries\n```\n\nMeasure the entry decision for one attempt.\nThe observation binding remains unverified; no UI control, HTTP status, denial wording, or timing limit is specified.\nThe [canonical no-entity case](../../../../tasks/ui-test-coverage-20261022/06-test-cases.md#know-007) remains version 2 without byte changes.\nThe [clarification stage](../../../../tasks/ui-test-coverage-20261022/05-entry-clarification.md#canonical-case-applicability) separates its historical execution from this criterion.\n\n\n### Current user-stated empty-entity rule\n\nWhen a tile has no configured EMS2 entity, hide the tile and deny direct tile launch.\nKeep this restriction until an EMS2 entity is configured.\nThe [answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/empty-entity-source.json) records the user's selection.\nThe [recovered session](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/recovered-session-source.json) retains the exact response and message timestamp.\nThis rule leaves application data permissions separate.\nThe [owner and scope answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/empty-entity-owner-scope-source.json) identifies `portal team` across local, test, UAT, and production.\n\nOwner approval and deployed enforcement remain unconfirmed.\n\nThe [historical proposal, lines 13–19](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Technical Design and Document/Tile Security Control - EMS2/page.md#L13-L19>) permits an empty role setting.\nThat example does not define an empty EMS2 entity setting.\nNo denial message, HTTP status, or timing limit was selected.\n\n#### UI-EMPTY-ENTITY-AC-001\n\nThis business criterion records user-stated intent for local, test, UAT, and production environments.\nIt establishes no executable test result or policy approval.\n\n```gherkin\nFeature: User-stated tile restriction for missing entity configuration\n  @UI-EMPTY-ENTITY-AC-001\n  Scenario: Hide a tile without an EMS2 entity\n    Given a user satisfies the portal-entry rule\n    And the tile has 0 configured EMS2 entities\n    When the portal presents available tiles to the user\n    Then the portal displays 0 instances of that tile\n\n  @UI-EMPTY-ENTITY-AC-001\n  Scenario: Deny direct launch without an EMS2 entity\n    Given a user satisfies the portal-entry rule\n    And the tile has 0 configured EMS2 entities\n    When the user attempts to launch that tile directly\n    Then the portal grants 0 launches for that attempt\n```\n\nThe tile count and launch count must each equal zero.\nUI and service observation bindings remain unverified.\nThe [clarification stage](../../../../tasks/ui-test-coverage-20261022/05-entry-clarification.md#empty-entity-configuration) records ownership, scope, approval limits, and historical case limits.\n\n### Current user-stated empty-subject rule\n\nThe user selected tile visibility and launch through the entity check when the subject setting is empty.\nThe user must satisfy the portal-entry rule and hold entitlement for the tile's single configured EMS2 entity.\nThe [exact answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/empty-subject-source.json) is the first-priority reference for this intended behavior.\nThe [owner and scope answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/empty-subject-owner-scope-source.json) assigns the rule to `portal team` across local, test, UAT, and production.\nThese answers define no application data permission or multiple-entity matching rule.\n\nOwner review, publication approval, and deployed enforcement remain unconfirmed.\nThe [historical SSDR discussion](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/On Boarding Records/SSDR On Board Discussion/page.md#L17-L20>) describes skipping validation for an empty subject.\nThe explicit user clarification governs the selected scope.\n\n#### UI-EMPTY-SUBJECT-AC-001\n\nApply this criterion in local, test, UAT, and production environments.\nTile visibility and portal launch authorization remain separate from application data permissions.\n\n```gherkin\nFeature: Tile access through one entity when its subject setting is empty\n  @UI-EMPTY-SUBJECT-AC-001\n  Scenario: Show the tile through its configured entity\n    Given the user satisfies the portal-entry rule\n    And the tile has 1 configured EMS2 entity\n    And the user has entitlement for that configured entity\n    And the tile has 0 configured subjects\n    When the portal presents available tiles to the user\n    Then the portal displays 1 instance of that tile\n\n  @UI-EMPTY-SUBJECT-AC-001\n  Scenario: Authorize launch through the configured entity\n    Given the user satisfies the portal-entry rule\n    And the tile has 1 configured EMS2 entity\n    And the user has entitlement for that configured entity\n    And the tile has 0 configured subjects\n    When the user attempts to launch that tile\n    Then the portal grants 1 launch authorization for that attempt\n```\n\nThe visible tile count and launch authorization count must each equal one.\nUI and service observation bindings remain unverified. No execution is claimed for this criterion.\nThe [task record](../../../../tasks/ui-test-coverage-20261022/05-entry-clarification.md#canonical-case-applicability) preserves historical case limits.\n\n### Integration purpose and responsibility boundary\n\nThe SDK injects an HTTP request filter into a downstream Spring application.\nThe guides describe automatic validation of JWTs generated by the Single UI authentication service.\nSuccessful validation exposes user information through the request attribute `userInfo`.\n[Java 17 SDK guide, lines 3–21, 25–86, 135–154](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 17/page.md>)\n\nThe tile-security proposal distinguishes portal entry from permission to view individual tiles.\nIt assigns data access and editing permissions to each tile application.\nA visible tile therefore does not establish permission to read or modify its business data.\nThis is a proposed responsibility boundary; current enforcement requires separate evidence.\n[Tile security proposal, lines 1–23](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Technical Design and Document/Tile Security Control - EMS2/page.md>)\n\nEMS2 setup defines entities, roles, subjects, and actions.\nThe procedure creates those objects and assigns actions to role-and-subject combinations.\nThose objects provide entitlement context for application-specific checks.\nThe procedure alone does not prove that a backend performs those checks.\n[EMS2 setup procedure, lines 1–12](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Creating EMS2 Entity Role Subject Action/page.md>)\n\n### Version and configuration history\n\nVersion 1.0.0 documents artifact `com.scb.ratan:single-ui-sdk-starter` and configuration prefix `single-ui-sdk.auth`.\nIt includes optional `user-login-max-duration` and request context field `userEntitlements`.\nVersion 1.1.1 renames the artifact to `com.scb.fmoportal:fmoportal-auth-sdk`.\nIt removes that duration property and renames the field to `entitlements`.\n[SDK version 1.0.0, lines 3–8, 14–51, 69–85](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.0.0/page.md>)\n[SDK version 1.1.1, lines 5–17, 39–57, 74–89](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.1/page.md>)\n\nVersion 1.1.2 documents `max_age` validation and adds `oud` to request context.\nVersion 1.1.4 documents logout session rejection and configurable public certificates.\nIts Java guides expose `userId`, `entitlements`, `oud`, and `sessionId` through `userInfo`.\nThese version statements require matching against each consumer's actual dependency.\n[SDK version 1.1.2, lines 5–15, 27–45](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.2/page.md>)\n[Java 17 SDK guide, lines 3–21, 25–86, 135–154](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 17/page.md>)\n\n| Documented variant | Declared platform | Declared artifact version |\n| --- | --- | --- |\n| Java 8 guide | JDK 8; Spring Boot 2.6.6 or higher | `1.1.4-java8` |\n| Java 17 guide | JDK 17; Spring Boot 3.1.2 or higher | `1.1.4-java17` |\n| Boot 4 migration note | Spring Boot 4.0.6 | `2.0.0-SNAPSHOT` |\n\nThe Boot 4 note conditions an official `2.0.0` release on regression testing.\nIt describes separated JWT configuration, public-key configuration, and import changes.\nIt does not establish a completed release or consumer compatibility.\n[Java 8 SDK guide, lines 3–21, 25–59](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 8/page.md>)\n[Java 17 SDK guide, lines 3–21, 25–86, 135–154](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 17/page.md>)\n[Boot 4 migration note, lines 1–28](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 17/Migration to Boot 4.0.6/page.md>)\n\n### Protected requests and exceptions\n\nThe documented URL algorithm checks exclusions first.\nWith an empty inclusion list, it validates all remaining paths.\nOtherwise, it validates matching inclusion paths.\nConfiguration therefore determines which requests receive SDK authentication checks.\n[SDK version 1.1.1, lines 5–17, 39–57, 74–89](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.1/page.md>)\n\nThe examples also configure `skip-jwt-headers`.\nEarlier guides state that matching headers cause the SDK to skip JWT checks.\nThe supplied instructions do not identify a trusted replacement authentication control.\n[SDK version 1.0.0, lines 3–8, 14–51, 69–85](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.0.0/page.md>)\n[SDK version 1.1.1, lines 5–17, 39–57, 74–89](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.1/page.md>)\n\n### Entitlement retrieval and lifecycle\n\nVersion 1.1.4 provides two entitlement retrieval paths.\nA service can query EMS2 through `AuthorizationService.getEntitlements`.\nAlternatively, it can validate and extract a separate entitlement token through `JwtTokenUtil.getEntitlementsToken`.\nThe guide explicitly forbids using an entitlement token for authentication or login.\n[SDK version 1.1.4, lines 7–46](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/page.md>)\n\nDirect EMS2 consumers must maintain certificate and endpoint configuration.\nThe Java 17 guide documents account lookup and entitlement-list endpoints.\nIt permits an application entity list to constrain retrieval.\nIts sample separates initial entitlement storage from later application requests.\n[SDK version 1.1.4, lines 7–46](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/page.md>)\n[Java 17 SDK guide, lines 3–21, 25–86, 135–154](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 17/page.md>)\n\nThe SDK overview recommends entitlement caching and mentions NGINX stickiness for multiple endpoints.\nIt announces removal of EMS2 details from authentication JWTs in DEV on August 30, 2024.\nThat announcement cannot establish the present DEV state or any production state.\n[SDK overview, lines 1–15](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/page.md>)\n\n## Connections\n\nAuthentication and sessions ([[wb-candidate-security-kt-authentication-and-sessions]]) explains portal token issuance and session concepts.\nAdmin and onboarding ([[wb-candidate-operations-kt-admin-and-onboarding]]) explains EMS2 setup and tile configuration.\n\nRepository `single-ui-auth-sdk` identifies the registered SDK source copy.\nContracts `single-ui-sdk-jwt-validation`, `single-ui-sdk-request-context`, and `single-ui-sdk-entitlement-lookup` provide declared implementation context.\nThose identities do not establish deployed consumers, compatible keys, or application permission enforcement.\n\n## Evidence limits\n\nThe version guides include examples and historical changes without confirmed original revisions or approval authority.\nNo downstream service execution or SDK compatibility build was inspected for this topic.\nThe applicable artifact and runtime behavior remain unresolved.\nOwner: unknown.\nNext action: map each consumer to its dependency, configuration, and retained verification evidence.\n\nThe tile-security proposal delegates data permissions to applications, but the SDK guides primarily describe validation and entitlement retrieval.\nThey do not establish automatic subject-and-action enforcement for every API.\nAssuming enforcement can leave protected business actions unspecified.\nOwner: unknown.\nNext action: inspect each application's permission checks and denied-request assertions.\n[Tile security proposal, lines 1–23](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Technical Design and Document/Tile Security Control - EMS2/page.md>)\n[Java 17 SDK guide, lines 3–21, 25–86, 135–154](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 17/page.md>)\n\n## Open questions\n\nWhat evidence confirms portal-team authority and approval across the user-stated environments?\nThe [retained answers](../../../../tasks/ui-test-coverage-20261022/05-entry-clarification.md#ui-q-002) establish user-stated intent and owner identity only.\nConsequence: Policy acceptance and publication remain blocked.\nOwner: `portal team`, user-reported for entry policy only.\nNext action: Obtain applicable authority and approval evidence.\n\nWhat evidence confirms portal-team approval and deployed enforcement of the empty-entity tile rule?\nThe [owner and scope answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/empty-entity-owner-scope-source.json) identifies portal team across all portal environments.\nConsequence: Policy publication requires applicable approval. Behavior acceptance requires deployed enforcement evidence.\nOwner: `portal team`, user-reported for this rule.\nNext action: Obtain the applicable approval and deployment evidence without repeating the answered ownership or scope question.\n\nWhich control authenticates requests when exclusions or skip headers bypass JWT validation?\nThe examples identify bypass settings without their trust boundary.\nThis prevents a complete account of protected-request behavior.\nOwner: unknown.\nNext action: document the trusted caller, replacement control, and bypass rejection tests.\n[SDK version 1.0.0, lines 3–8, 14–51, 69–85](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.0.0/page.md>)\n[SDK version 1.1.1, lines 5–17, 39–57, 74–89](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.1/page.md>)\n\nHow do applications invalidate cached entitlements and reject logged-out sessions across instances?\nThe overview recommends caching; version 1.1.4 describes session rejection without distributed lifecycle guarantees.\nStale permissions and inconsistent logout remain unresolved possibilities.\nOwner: unknown.\nNext action: define cache expiry, revocation propagation, and observable cross-instance acceptance criteria.\n[SDK overview, lines 1–15](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/page.md>)\n[Java 17 SDK guide, lines 3–21, 25–86, 135–154](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/Single UI SDK V1.1.4/Java 17/page.md>)\n\nWhich environments currently omit entitlements from authentication tokens?\nThe overview announces a specific DEV migration in 2024.\nIt provides no retained proof of current production token shape.\nOwner: unknown.\nNext action: inspect redacted token contracts and environment-specific migration records.\n[SDK overview, lines 1–15](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Single UI SDK/page.md>)\n\nThe renewal requirement ([[wb-candidate-requirements-req-active-session-renewal]]) records the user's requested pilot behavior.\nIts scenarios and deployment verification remain separate from these historical documents.\n",

    "markdown": "---\ntitle: \"CES migration permission preservation\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/security/KT-ces-migration-parity.md\nsource: raw/workbench/knowledge/candidates/security/KT-ces-migration-parity.md\nsource_hash: 9176c6da48ffd2f9\nlast_updated: 2026-11-11\ncandidate_id: KT-ces-migration-parity\ncandidate_version: 6\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: security\nworkbench_origin: knowledge/candidates/security/KT-ces-migration-parity.md\nworkbench_sha256: 9176c6da48ffd2f9fa7b131f54a982564fd853034cd117b6a68421373c2fc6e0\nworkbench_status: candidate-derived\n---\n\n# CES migration permission preservation\n\n## Scope\n\nThis topic defines intended permission preservation from EMS2 production to CES UAT.\nIt covers mapped entitlement definitions and permission content for all scoped accounts.\nThe [user clarification](../../../../evidence/knowledge/sources/user-clarifications/ces-migration-coverage-20261103/user-input.md#exact-user-input) controls this scope from 3 November 2026.\nThe [frontend clarification](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-clarification-20261106.md#exact-user-input) adds frontend compatibility and independent tile routing intent.\nIt applies from 6 November 2026 to `mfe-base`, the shared Ratan container, and their upper applications.\nThe [BFF field request](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-bff-entity-fields-20261106.md#exact-user-input) defines additive CES entity metadata from 6 November 2026.\nThe [application identity clarification](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-clarification-application-identity-20261106.md#exact-user-input) separates the legacy team label from CES application identity.\nThe [provider-union clarification](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-gap-clarification-20261109.json) applies from 9 November 2026.\nIt permits existing `hasPermission(code)` calls to accept mapped EMS2 or CES grants, with provider-source logs.\nThe owning [migration task](../../../../tasks/ces-entitlement-migration-20261102/01-intake.md#current-task-state) retains source observations, implementation, and execution evidence separately.\n\n## Summary\n\nThe migration must preserve permission meaning after the EMS2 and CES concepts are mapped.\nAssess entitlement completeness separately from account permission completeness.\nTwo supplied account examples do not limit the required account population.\nFMO Portal Admin has a separate, lower-priority non-production comparison under the user's clarification.\nPreserve upper-application APIs where possible while selecting tile admission through its configured provider.\nAllow mapped EMS2 or CES grants through existing `hasPermission(code)` calls.\nLog the provider used without requiring an additional caller scope parameter.\nDo not require one batch migration of every tile.\nTreat role multiplicity as an explicit compatibility concern, separate from mapped feature/action permission meaning.\nExpose CES entitlement names through `roleList` and the corresponding application identifier through `applicationId`.\nThese fields do not select a scalar role for existing callers.\nKeep CES role-owned writes pending until an ownership rule is agreed.\n\n## Documented knowledge\n\n### Mapping between authorization concepts\n\n| EMS2 concept | CES concept | Required comparison boundary |\n| --- | --- | --- |\n| Role | Entitlement | Compare the mapped definition and its assigned accounts. |\n| Entity | Application | Preserve application scope when comparing permission names. |\n| Subject | Feature | Compare each subject through its explicit feature mapping. |\n| Action | Action | Compare the permitted operation within the mapped feature. |\n\nSource: [exact mapping clarification](../../../../evidence/knowledge/sources/user-clarifications/ces-migration-coverage-20261103/user-input.md#exact-user-input).\nNames shared by different applications do not establish equivalent permissions.\nNumeric source identifiers can differ without changing mapped permission meaning.\nThe existing entity-name intent ([[wb-candidate-security-kt-sdk-and-entitlements]]) retains its separate source and scope.\n\n### Entitlement preservation\n\nThe intended migration has no missing mapped entitlements or permission gaps.\nCompare entitlement definitions before treating catalog totals as evidence of completeness.\nCompare each mapped application, entitlement, feature, and action relationship.\nDifferent entitlements can produce the same combined effective permissions.\nThat combined result does not establish equal entitlement definitions or assignments.\n\n### Account permission preservation\n\nThe comparison must include all accounts discovered within the selected entity scope.\nExpand cells or response collections that contain several account IDs.\nCount each distinct account once in the overall account denominator.\nRetain application and entitlement scope when comparing assignments and effective permissions.\nCompare applicable data restrictions through authoritative definitions and resolved values.\nA matching data profile name alone does not establish equivalent data access.\n\n### Coverage and active differences\n\nRecord fully matched migrated content in the coverage totals.\nRemove that content from the active difference list.\nKeep missing content, additional content, unresolved mappings, and unavailable comparisons visible.\nAn unavailable account comparison does not establish equal permissions or missing permissions.\nKeep the expected population visible when an account comparison is unavailable.\n\n### FMO scope exception\n\nThe user's clarification places FMO Portal Admin outside the production migration comparison.\nKeep its non-production comparison separate and lower in priority.\nDo not add FMO's non-production content to production coverage denominators.\nRetain the [dated clarification](../../../../evidence/knowledge/sources/user-clarifications/ces-migration-coverage-20261103/user-input.md#exact-user-input) when applying this exception.\nFuture production scope requires a sourced update.\n\n### Frontend compatibility and per-tile migration\n\nThe [frontend decision](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-clarification-20261106.md#exact-user-input) prioritizes compatibility with existing upper-application APIs.\nApply this objective to `mfe-base` and shared container APIs.\nPreserve established caller contracts where possible. Adapt provider-specific identities and permission data internally.\nThe user identifies non-unique roles as the known compatibility gap.\nThis statement does not establish that every other API is compatible.\nKeep each unresolved mapping visible before claiming complete compatibility.\n\nDo not treat a combined effective permission set as one assigned role.\nPreserve the distinction between assigned roles and effective feature/action permissions.\nThe contract for callers that expect one role requires a sourced business mapping.\nDo not select an arbitrary role or infer a named role from effective action membership.\n\n### Interim rule for CES role-owned writes\n\nThe [ownership decision](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-implementation-20261106/user-role-owned-writes-20261106.md#exact-user-answer) applies from 6 November 2026.\nIt covers CES saved-view and filter writes that require one owner role.\nKeep these CES write paths unavailable until an ownership rule is agreed.\nDo not select a primary CES role or submit comma-joined role names as a scalar owner.\nPreserve existing EMS2 role-owned write behavior.\nThis interim rule does not define CES query visibility, role-query rules, or multiple-role exclusion policy.\n\n#### FE-ROLE-WRITE-AC-001\n\nDefer CES role-owned writes while their ownership rule remains unresolved.\n\n```gherkin\nFeature: Defer CES role-owned writes pending an ownership rule\n  Scenario Outline: Keep a CES role-owned write pending\n    Given a <item> uses CES authorization\n    And writing the item requires one owner role\n    And no agreed CES ownership rule exists\n    When the user attempts to save the item\n    Then the number of role-owned write requests sent equals 0\n    And the number of CES roles selected as the scalar owner equals 0\n    And the number of comma-joined role owners submitted equals 0\n\n    Examples:\n      | item       |\n      | saved view |\n      | filter     |\n\n  Scenario: Preserve an existing EMS2 role-owned write\n    Given a saved view or filter uses EMS2 authorization\n    And its established EMS2 rules allow a role-owned write\n    When the user saves the item\n    Then its owner selection follows the existing EMS2 rules\n    And the number of EMS2 write decisions changed solely by the CES pending rule equals 0\n```\n\nMeasure: zero CES role-owned requests or fabricated scalar owners before agreement, with zero rule-induced EMS2 decision changes.\nThis criterion defines interim write behavior. It does not supply the missing CES ownership rule.\n\n### Independent tile provider selection\n\nEach tile must select its entitlement provider independently.\nAn EMS2 tile must retain its existing admission logic.\nA CES tile must use CES admission logic, configured application identity, and CES permission structure.\nTreat the CES application as the new entity identity within that selected scope.\nDo not force unrelated tiles to change provider when one tile moves to CES.\nPreserve application scope within both provider paths.\n\nThe [source interpretation](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-clarification-20261106.md#interpretation-for-this-stage) distinguishes plain `EMS2` from the final `EMS2 (CES)` phrase.\nThe latter denotes the CES path. The migration contract uses `EMS3` as its CES wire value.\nThe exact user quotation remains unchanged in the source.\nThis interpretation does not merge legacy EMS2 and CES tile admission choices.\n\nThe [latest provider clarification](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-gap-clarification-20261109.json) permits either provider to satisfy an existing `hasPermission(code)` call.\nKeep that shared functional check separate from tile admission.\nUse reviewed application, feature, and action mappings when reading either provider.\nLog which provider supplied an accepted grant.\nDo not require upper applications to pass a new scope argument.\nThis rule does not select a scalar role or resolve saved-item ownership.\n\n### Intended frontend acceptance criteria\n\nThese criteria make the user objective measurable within reviewed mappings.\nThey define target behavior. They do not establish complete API compatibility or passing execution.\nRole-dependent business mappings remain unresolved below.\n\n#### FE-COMPAT-AC-001\n\nPreserve existing upper-application permission API behavior for mapped feature/action decisions.\n\n```gherkin\nFeature: Preserve upper-application permission contracts\n  Scenario: Preserve a mapped decision through the existing caller API\n    Given an upper application uses an existing base or shared container permission API\n    And a reviewed application, feature, and action mapping defines an allowed or denied decision\n    And the tile selects EMS2 or CES\n    When the upper application requests that mapped permission through its existing API\n    Then the API returns the mapped allowed or denied decision\n    And the caller can use its existing call contract within that reviewed mapping\n    And the number of contradictory decisions equals 0\n```\n\nMeasure: zero contradictory decisions across the declared mapped permission cases.\nRecord compatibility exceptions before accepting affected caller behavior.\nAn unknown role mapping cannot satisfy this criterion through a fabricated scalar role.\n\n#### FE-COMPAT-AC-002\n\nAdmit each tile through its selected provider and application scope.\n\n```gherkin\nFeature: Select the admission provider per tile\n  Scenario: Preserve independent legacy and CES tile admission\n    Given one tile selects EMS2 and another tile selects CES\n    And each tile has its reviewed application and permission configuration\n    When the system evaluates whether to admit both tiles\n    Then the EMS2 tile uses its existing EMS2 admission rules\n    And the CES tile uses its configured CES application and permission structure\n    And the number of admissions using only an unrelated application's grant equals 0\n```\n\nMeasure: two tile admission paths follow their selected provider, with zero unrelated-application admissions.\nThe value two defines this comparison case. It does not limit the supported tile population.\nThis criterion does not restrict the shared provider-union permission check below.\n\n#### FE-COMPAT-AC-003\n\nChange one tile admission provider independently while keeping role multiplicity separate from permission equivalence.\n\n```gherkin\nFeature: Migrate tiles independently\n  Scenario: Change one tile without forcing the remaining tiles to migrate\n    Given a declared set of tiles uses its reviewed provider selections\n    And one selected tile changes from EMS2 to CES\n    And CES assignments can contain multiple roles\n    When the system applies that selected tile's provider change\n    Then the number of provider selections changed on other tiles equals 0\n    And the number of upper-application permission call signatures changed solely by that switch equals 0\n    And multiple role assignments are not represented as one proven assigned role\n```\n\nMeasure: zero forced provider changes on other tiles and zero required permission call signature changes.\nAcceptance of role-dependent callers needs the unresolved business mapping below.\n\n#### FE-COMPAT-AC-004\n\nAccept a mapped grant from either provider through the existing API and log its source.\n\n```gherkin\nFeature: Preserve hasPermission during provider migration\n  Scenario Outline: Read either provider without changing the caller\n    Given a reviewed application, feature, and action mapping exists for the requested code\n    And EMS2 has <ems2_grant> matching grant\n    And CES has <ces_grant> matching grant\n    When the upper application calls hasPermission with only that code\n    Then the returned boolean equals <expected>\n    And the number of required additional caller arguments equals 0\n    And an accepted decision has at least 1 log identifying a provider that supplied its matching grant\n\n    Examples:\n      | ems2_grant | ces_grant | expected |\n      | 1          | 0         | true     |\n      | 0          | 1         | true     |\n      | 1          | 1         | true     |\n      | 0          | 0         | false    |\n```\n\nMeasure: four boolean results match the grant union, with zero additional arguments and provider logs for accepted decisions.\nThese four examples define the union cases. They do not limit accounts, applications, or permission codes.\nThe denial example requires no accepted-grant log because neither provider supplies a matching grant.\n\n### CES entity role and application fields\n\nThe [BFF field decision](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-bff-entity-fields-20261106.md#exact-user-input) requires two additive fields on EMS3 entities.\n`roleList` must contain the corresponding CES `entitlements.entitlement_name` values.\n`applicationId` must contain the corresponding CES application's `itam_id` value.\nThe requested example identifies that application as `51358`.\nKeep the role list bound to its corresponding application.\nDo not use another application's entitlement names to populate that entity.\n\nThe [identity clarification](../../../../tasks/ces-entitlement-migration-20261102/evidence/frontend-entitlement-impact-20261105/user-clarification-application-identity-20261106.md#exact-user-input) retains `applicationName` as the legacy team name.\nFor the clarified mapping, preserve these three field meanings:\n\n| Field | Required value | Meaning |\n| --- | --- | --- |\n| `name` | `RATAN_ENTITLEMENT_RULE` | CES application/entity name corresponding to EMS2 `X_RATANONE`. |\n| `applicationName` | `RATAN` | Legacy team/display application name. |\n| `applicationId` | `\"51358\"` | Corresponding CES `itam_id`. |\n\nCES `user_data.app_name` supplies the CES authorization name. It does not supply the legacy team label.\nDo not replace the team label with the CES application name or application ID.\nThe clarified values apply to this RATAN mapping. They do not establish labels for other CES applications.\n\nRetain existing entity fields and EMS2 authorization behavior within the compatibility objective.\nThese additive fields expose assignment names and application identity. They do not resolve scalar role semantics.\nDo not infer feature/action ownership from a role name alone.\nThe [role contract question](#open-questions) remains open for callers that require one role.\n\n#### BFF-ENTITY-AC-001\n\nExpose CES entitlement names as an application-scoped role list.\n\n```gherkin\nFeature: Expose CES assignment names\n  Scenario: Preserve multiple entitlement names in the corresponding EMS3 entity\n    Given a CES application's entitlements.entitlement_name contains \"role-a\" and \"role-b\"\n    And another application contains \"role-c\"\n    When the BFF returns the first application's EMS3 entity\n    Then its roleList contains \"role-a\" and \"role-b\"\n    And its roleList contains 0 names taken solely from another application\n```\n\nMeasure: two supplied entitlement names remain present, with zero names imported from another application.\nThe two names define this case. They do not limit the number of assigned entitlements.\n\n#### BFF-ENTITY-AC-002\n\nKeep the CES application identifier separate from its authorization name and legacy team label.\n\n```gherkin\nFeature: Expose CES application identity\n  Scenario: Preserve the requested application identifier\n    Given the corresponding CES application has itam_id \"51358\"\n    And its CES name \"RATAN_ENTITLEMENT_RULE\" corresponds to EMS2 entity \"X_RATANONE\"\n    And its legacy team applicationName is \"RATAN\"\n    When the BFF returns that application's EMS3 entity\n    Then applicationId equals \"51358\"\n    And name equals \"RATAN_ENTITLEMENT_RULE\"\n    And applicationName equals \"RATAN\"\n    And the number of entity identifiers substituted for that applicationId equals 0\n```\n\nMeasure: all three returned fields equal their declared values, with zero legacy identifier substitutions.\nThe example value identifies this case. It does not restrict other CES applications.\n\n#### BFF-ENTITY-AC-003\n\nKeep the additive metadata separate from legacy authorization and scalar role policy.\n\n```gherkin\nFeature: Keep additive CES metadata compatible\n  Scenario: Preserve the EMS2 path while adding CES entity metadata\n    Given a mixed-provider response contains an EMS2 entity and an EMS3 entity\n    And the EMS2 entity has a declared legacy authorization decision\n    When the BFF adds roleList and applicationId for the EMS3 entity\n    Then the number of legacy EMS2 decisions changed solely by these additions equals 0\n    And the number of existing entity fields removed by these additions equals 0\n    And multiple CES entitlement names do not establish one selected scalar role\n```\n\nMeasure: zero legacy decision changes and zero removed existing entity fields caused by these additions.\nA separate sourced business mapping must define any later scalar role projection.\n\n## Connections\n\n- SDK and entitlements ([[wb-candidate-security-kt-sdk-and-entitlements]]) defines the existing entity-name migration and SDK compatibility intent.\n- [Migration intake](../../../../tasks/ces-entitlement-migration-20261102/01-intake.md) records the current requirement and unresolved evidence.\n- [Frontend analysis](../../../../tasks/ces-entitlement-migration-20261102/05-impact-analysis-frontend-entitlements.md) retains implementation comparisons and compatibility evidence separately.\n- [Canonical coverage cases](../../../../tasks/ces-entitlement-migration-20261102/06-test-cases.md) define observable comparisons separately from execution results.\n\n## Evidence limits\n\nThe source establishes user-stated intent and comparison scope.\nThe user's statement about no entitlement gaps is an expectation, not retained execution proof.\nThis candidate does not establish completed migration, current account assignments, or deployed permission equality.\nThe FMO exception does not verify its current launch or provisioning state.\nThe frontend clarification supplies intended behavior, not complete compatibility or an approved scalar role mapping.\nThe BFF field decision defines target metadata. It does not establish implemented, tested, or deployed response behavior.\nThe identity clarification defines this RATAN mapping. It does not establish a complete cross-application team-label catalog.\nThe ownership decision defers CES role-owned writes. It does not define CES ownership, query, or exclusion semantics.\nThe provider-union clarification changes permission-check intent. It does not prove implementation or deployed log collection.\nIts expectation about returned legacy entities remains an implementation question, separate from this intended rule.\nNo human review, knowledge publication, migration acceptance, or deployment approval is recorded.\n\n## Open questions\n\n| Question | Consequence | Owner | Next action |\n| --- | --- | --- | --- |\n| Which source defines legacy data field and value restrictions? | Complete data-scope equality remains unassessed without that source. | unknown | Bind each legacy profile to authoritative restriction definitions. |\n| Which CES-only management grants fall outside migration scope? | Additional grants need an explicit classification before equal-content acceptance. | unknown | Record the reviewed business scope and its source. |\n| How must multiple CES roles map to existing caller role contracts? | CES role-owned writes remain pending; other role semantics lack an accepted mapping. | unknown | Define each role-dependent contract before enabling the affected CES behavior. |\n| Which reviewed mappings cover each upper-application API? | Full compatibility cannot follow from the user objective alone. | unknown | Define the application, feature, action, and caller contract mapping before acceptance. |\n",

    "id": "sources/wb-candidate-interoperability-kt-application-interoperability",
    "label": "Portal application interoperability and OpenFin context",
    "type": "source",
    "color": "#E91E63",
    "path": "wiki/sources/wb-candidate-interoperability-kt-application-interoperability.md",
    "markdown": "---\ntitle: \"Portal application interoperability and OpenFin context\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/interoperability/KT-application-interoperability.md\nsource: raw/workbench/knowledge/candidates/interoperability/KT-application-interoperability.md\nsource_hash: 6f342b010f7d9a4f\nlast_updated: 2026-11-11\ncandidate_id: KT-application-interoperability\ncandidate_version: 2\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: interoperability\nworkbench_origin: knowledge/candidates/interoperability/KT-application-interoperability.md\nworkbench_sha256: 6f342b010f7d9a4fa59ccc43456aba67d5ef33aed20f971d9836b4fbc4150d72\nworkbench_status: candidate-derived\n---\n\n# Portal application interoperability and OpenFin context\n\n## Scope\n\nThis topic connects Portal intent navigation, desktop architecture, shared context, authentication handoff, and coordinated delivery.\nThe supplied materials include a Portal cooperation guide, an explicit proof of concept, and a later briefing.\nThey do not establish the delivered status of every described capability.\n\n## Summary\n\nThe documented objective is sharing context and requesting actions across financial applications.\nOpenFin supplies the desktop environment in these materials.\nFDC3 supplies the documented context and intent abstraction.\nThe proof of concept describes Portal opening, tile opening, theme changes, and message broadcast.\nLater planning separates technical onboarding from business user adoption.\n\n## Documented knowledge\n\n### Purpose and architecture terms\n\nThe overview seeks to avoid repeated data entry and connect actions across applications.\nA desktop agent exposes an API to applications in its context.\nThe documentation describes a platform provider as the coordination hub.\nPlatform windows frame the interface, while platform views contain application content.\nThe briefing states that the Ratan provider customizes intent routing.\nThese statements describe the supplied architecture, without verifying current deployed components.\n[Overview, objective and FDC3 parts, lines 1–21](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/1. Overview/page.md#L1>)\n[Getting Started, desktop agent and platform components, lines 1–28](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/2. Getting Started/page.md#L1>)\n[Briefing, platform provider, lines 111–125](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/Ratan OpenFin Briefing/page.md#L111>)\n\nThe briefing limits its stated business scope to application rendering and interoperability.\nThird-party integrations and native adapters are outside that stated plan.\nIt distinguishes the Runtime from the Runtime Version Manager.\nThe manifest configures an application or platform bootstrap and its requested runtime.\nThe briefing records `stable-v41` as its runtime strategy.\nThis is a historical declaration, without verification of current support, installation, or approval.\n[Briefing, scope, runtime, and manifest, lines 32–86](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/Ratan OpenFin Briefing/page.md#L32>)\n\n### Portal-mediated tile navigation\n\nThe interoperability guide describes intent navigation from a source tile to a target tile.\nThe source supplies context that becomes the target's initial data.\nThe screen then transitions to the target tile.\nThese are documented interaction semantics, without inspected implementation or execution evidence.\n[Interoperability guide, intent navigation, lines 1–9](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Interoperability Guide/page.md#L1>)\n\nThe guide assigns business demand and caller implementation to the requesting tenant team.\nPortal receives standardized intents and provides routing, access control, context passing, and dispatch.\nThe provider team implements the receiving handler, consumes context, and performs the business action.\nIt can optionally return a result or status.\nThese responsibility declarations do not establish operational ownership or passing access-control enforcement.\n[Interoperability guide, cooperation model, lines 27–38](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Interoperability Guide/page.md#L27>)\n\nA completed caller alone cannot enable the full feature under this guide.\nThe provider also needs intent registration, a handler, agreed context, authorization readiness, testing, and production deployment.\nThe guide therefore treats interoperability as a joint delivery dependency.\nIts development code blocks are empty, and its diagrams are absent from this supplied copy.\nThe guide supplies cooperation intent, without a runnable integration contract.\n[Interoperability guide, development and readiness, lines 13–25 and 40–60](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Interoperability Guide/page.md#L13>)\n\n### Contexts, intents, and actions\n\nThe overview defines context data as information shared between applications.\nIt defines intents as requests for another application to perform functionality.\nThe proof of concept uses these concepts to open Portal, open a tile, change theme, and broadcast messages.\nOpening a new Portal view differs from opening a workspace inside an existing view.\nThe supplied demonstration procedure describes both paths.\n[Overview, FDC3 parts and use cases, lines 15–31](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/1. Overview/page.md#L15>)\n[Interoperability POC, functional use cases, lines 25–71](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/3. Application Interoperability/page.md#L25>)\n\nThe example contract uses application channel `fmchannel`.\nIts listener names include `fmchannel.provider`, `fmchannel.reactapp`, and `fmchannel.fmoportal`.\nThe documented `openTile` request carries container, module, and tile identifiers, or a target URL.\nThe documented `changeTheme` request carries a theme value.\nThese names describe example integration messages, without establishing an approved production schema.\n[FDC3 contract, channel and listener table, lines 1–5](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/4. FMO Portal FDC3 Contract/page.md#L1>)\n\nThe example shares one handler between context and intent listeners.\nThat handler branches on `getToken`, `openTile`, and `changeTheme`.\nIts view-creation example declares `fdc3InteropApi` value `1.2` and an `OpenTile` intent.\nThe different intent names and context entries require reconciliation before treating this example as an integration specification.\n[FDC3 contract, listener and launch examples, lines 7–55](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/4. FMO Portal FDC3 Contract/page.md#L7>)\n\n### Authentication handoff boundary\n\nThe POC describes provider authentication followed by application launches using a provider token in URL parameters.\nIt presents that handoff as a way to avoid another login prompt.\nThe document explicitly simplifies the provider UI for the POC.\nIt says a real provider should run hidden after authentication.\nNo production authentication design, security approval, or token-handling verification was inspected during ingestion.\n[Interoperability POC, provider authentication, lines 1–23](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/3. Application Interoperability/page.md#L1>)\n\n### Compatibility observations\n\nThe technical issue page reports that two FDC3 libraries did not exchange broadcast messages in its POC.\nIt reports intent errors with one library and successful intent handling with the other.\nIts workaround uses `fdc3-2.1` for broadcast and `openfin-fdc3` for intents.\nThese are reported POC observations, without current reproduction or a supported compatibility guarantee.\nThe referenced screenshots and source archives are absent from this supplied copy.\n[Technical issue, observations and workaround, lines 1–29](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/5. Technical Issue/page.md#L1>)\n[Getting Started, source archives, lines 30–36](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/2. Getting Started/page.md#L30>)\n\n### Adoption and release phases\n\nThe briefing describes separate business cases for viewing trade details and remaining amounts across applications.\nIts phase table separates production identity verification, blotter onboarding, and business user onboarding.\nThose are distinct milestones.\nThe month-based timelines provide no year in that table.\nThe briefing records approval and prioritization claims, without supplied approval attachments or completed execution records.\nThis topic therefore preserves them as reported claims and plans.\n[Briefing, approval claims, business cases, and phases, lines 135–163](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/OpenFin/Ratan OpenFin Briefing/page.md#L135>)\n\n## Connections\n\nFrontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) supplies the Portal container, module, tile, and workspace context.\nAuthentication and sessions ([[wb-candidate-security-kt-authentication-and-sessions]]) supplies related session concepts.\nRelease operations ([[wb-candidate-operations-kt-release-operations]]) distinguishes technical deployment from business activation.\n\nRegistry service `single-ui-web` and capability `single-ui-workspace-composition` provide related Portal context.\nThese connections do not prove that those assets implement the example FDC3 messages.\nThe supplied registry does not establish an approved OpenFin contract.\n\n## Evidence limits\n\nLocal hashes identify supplied document bytes.\nOriginal revisions, approval evidence, deployed versions, and current applicability remain unresolved.\nMissing archives and screenshots prevent reproduction of the POC from this copy alone.\nNo desktop agent, provider, application, or compatibility test ran during ingestion.\nNo credential, token value, personal identifier, or private contact detail is reproduced here.\n\n## Open questions\n\n| Issue and evidence | Consequence | Owner | Next action |\n| --- | --- | --- | --- |\n| Caller/provider cooperation is described without populated development examples. See interoperability guide, lines 13–25 and 40–60. | Joint readiness cannot be inferred from caller completion. | unknown | Agree provider capacity, context contracts, authorization checks, and release evidence. |\n| Sources mix POC examples, approval claims, and planned phases. See interoperability, line 9, and briefing, lines 135–163. | Intended capability could be mistaken for delivered behavior. | unknown | Record delivered features and retained execution evidence by environment. |\n| Contract table and launch example use different intent and context names. See FDC3 contract, lines 1–5 and 43–49. | Integrations could request an unhandled action. | unknown | Agree one versioned schema and verify producer and listener compatibility. |\n| POC launches include provider tokens in URLs. See interoperability, lines 18–23. | Production token exposure and trust boundaries remain unresolved. | unknown | Review production authentication handoff and approved token transport. |\n| POC reports library isolation and intent failures. See technical issue, lines 8–29. | Cross-application behavior could depend on an undocumented workaround. | unknown | Reproduce compatibility using the selected supported runtime and libraries. |\n| Phase deadlines omit the year and completion evidence. See briefing, lines 157–163. | Planning context cannot establish current rollout status. | unknown | Confirm dated technical milestones and separate business acceptance records. |\n",
