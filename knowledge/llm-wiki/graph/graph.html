    "markdown": "---\ntitle: \"Portal purpose and capability map\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/background/KT-portal-purpose.md\nsource: raw/workbench/knowledge/candidates/background/KT-portal-purpose.md\nsource_hash: 29b0432d30bd7ae2\nlast_updated: 2026-11-11\ncandidate_id: KT-portal-purpose\ncandidate_version: 2\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: background\nworkbench_origin: knowledge/candidates/background/KT-portal-purpose.md\nworkbench_sha256: 29b0432d30bd7ae28dc636bfce8834e7297c9af6cd59e0632bbc9eb57e3ab620\nworkbench_status: candidate-derived\n---\n\n# Portal purpose and capability map\n\n## Scope\n\nThis topic connects the portal's stated purpose, common platform functions, and tenant application responsibilities.\nIt covers the supplied UI platform materials.\nIt does not establish complete Financial Markets business-domain coverage.\nThe exported page revisions, authors, and approval states remain unconfirmed.\n\n## Summary\n\nThe guild aims to provide consistent design, shared components, and utilities across application teams.\nThe portal supplies a common entry and workspace for post-trade applications.\nApplication teams retain their domain functions while the platform supplies shared integration capabilities.\nThese statements synthesize the [guild mission](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/page.md#L8>) and [portal introduction](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Portal Design/page.md#L5>).\n\n## Documented knowledge\n\n### Business purpose\n\nThe portal introduction names affirmation, confirmation, settlements, and reporting as supported post-trade activities.\nIt lists blotters, a rules engine, and other tools as examples.\nThe page explicitly remains under edit.\nThese examples describe its stated scope, not a complete application inventory. [Portal design](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Portal Design/page.md#L1>).\n\nThe guild separates common UI work from application teams' business delivery.\nIt proposes shared themes, components, utilities, and collaboration through one design language.\nThe portal is one implementation of that UI approach. [Guild vision and mission](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/page.md#L3>).\n\n### Working vocabulary\n\n| Term | Meaning in these materials |\n| --- | --- |\n| Tenant application | A domain application integrated into the shared portal. |\n| Tile | An application view that a user opens in a workspace. |\n| Workspace | A user area that holds opened tiles. |\n| Container | An application-owned module or the shared base that supplies common context. |\n| Import map | A mapping used to locate modules for dynamic loading. |\n\nThe [tile lifecycle description](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Capabilities/page.md#L63>) and [module ownership design](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Micro-frontend/page.md#L130>) support these terms.\nThe sources use container for both common and application-specific roles.\nKeep the role explicit when describing an interface.\n\n### Capability boundaries\n\n| Concern | Capability described in the supplied material |\n| --- | --- |\n| Entry and identity | Common application entry, SSO, MFA, and session renewal. |\n| Composition | Shared themes, dynamic module loading, tiles, and workspaces. |\n| Access | EMS2 roles and configured tile eligibility. |\n| Administration | Configuration management and tenant onboarding. |\n| Integration | Tenant UI and API routing through the portal's Nginx boundary. |\n| Observation | Analytics for user activity and performance. |\n| Interoperability | Cross-application interaction, with FDC3 explicitly marked as in progress. |\n\nThis map summarizes the [capabilities page](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Capabilities/page.md#L3>).\nThat page mixes present-tense descriptions with an unfinished FDC3 item.\nThe wording does not establish deployed or tested coverage for each capability.\n\n### User and application flow\n\nThe capabilities page describes one entry, authentication, tile selection, and multiple workspaces.\nIt connects module loading with import maps and renewal with session control.\nThis sequence explains how the documented capabilities fit together.\nIt is a synthesis, not retained execution evidence. [Entry and lifecycle descriptions](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Capabilities/page.md#L3>).\n\n### Scope and roadmap\n\nThe draft principles focus on SSO, tile authorization, interoperability, action tracing, and a forthcoming notification center.\nTheir login and tile eligibility statements remain draft intent. [Draft principles](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Principles (Draft)/page.md#L1>).\n\nThe deployment proposal names onboarding changes, workflow AI, telemetry, and infrastructure migration for 2026 and early 2027.\nIt also lists notification, dashboards, and OpenFin as refining requirements.\nIts target service list describes a proposed decomposition. [Deployment proposal](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L3>).\nThese targets must remain distinct from the capability inventory and current implementation.\n\n## Connections\n\n- Frontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) explains modules, ownership, loading, and shared dependencies.\n- Authentication and sessions ([[wb-candidate-security-kt-authentication-and-sessions]]) and SDK and entitlements ([[wb-candidate-security-kt-sdk-and-entitlements]]) explain identity and downstream access boundaries.\n- Administration and onboarding ([[wb-candidate-operations-kt-admin-and-onboarding]]) and Release operations ([[wb-candidate-operations-kt-release-operations]]) explain integration and operating procedures.\n- Application interoperability ([[wb-candidate-interoperability-kt-application-interoperability]]) and Observability and performance ([[wb-candidate-observability-kt-observability-and-performance]]) explain cross-application context and observations.\n- Architecture evolution ([[wb-candidate-evolution-kt-architecture-evolution]]) separates historical evaluation from proposed changes.\n\n## Evidence limits\n\nEvidence: The [source manifest](../../../../evidence/knowledge/manifest.yaml) identifies local bytes without original page revisions or confirmed source authority.\nConsequence: The citations support a reproducible reading but do not establish approved or current project intent.\nOwner: unknown.\nNext action: Confirm source ownership, applicability, and original revisions before publication.\n\nEvidence: The [portal introduction](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Portal Design/page.md#L1>) remains under edit, and [principles](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Principles (Draft)/page.md#L1>) remain draft.\nConsequence: This topic cannot establish accepted scope or enforceable business rules.\nOwner: unknown.\nNext action: Confirm scope, naming, and accepted principles with the accountable platform owner.\n\nEvidence: The [capabilities page](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Capabilities/page.md#L7>) depends on screenshots absent from the supplied export.\nConsequence: This topic preserves textual meaning but cannot reconstruct the illustrated behavior.\nOwner: unknown.\nNext action: Recover relevant screenshots and compare their meaning with the text.\n\nEvidence: The [deployment proposal](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L3>) describes future changes without an approval record in these materials.\nConsequence: Target services and planned features cannot serve as current implementation facts.\nOwner: unknown.\nNext action: Link approved requirements and exact implementation evidence when investigating each proposal.\n\n## Open questions\n\nOwner: unknown for all questions.\n\n- Which owner can confirm the current portal name, scope, and capability inventory?\n- Which draft principles became accepted rules, and when?\n- Which 2026 and 2027 proposals have approved scope or deployed implementations?\n\nNext action: Resolve these questions before using this topic as approved project intent.\n",

    "markdown": "---\ntitle: \"Admin and onboarding\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/operations/KT-admin-and-onboarding.md\nsource: raw/workbench/knowledge/candidates/operations/KT-admin-and-onboarding.md\nsource_hash: 9d397b95e056c25c\nlast_updated: 2026-11-11\ncandidate_id: KT-admin-and-onboarding\ncandidate_version: 3\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: operations\nworkbench_origin: knowledge/candidates/operations/KT-admin-and-onboarding.md\nworkbench_sha256: 9d397b95e056c25caf04471930ddb0b84a29c21789e76287576cea33b1ce6869\nworkbench_status: candidate-derived\n---\n\n# Admin and onboarding\n\n## Scope\n\nThis topic connects tenant onboarding with module mappings, drawer categories, tile configuration, and EMS2 setup.\nIt distinguishes an earlier admin proposal from the later procedural manual.\nIt records documented responsibilities without assigning current owners or claiming executed onboarding.\n\n## Summary\n\nAn onboarded application needs frontend assets, backend routing, entitlements, and portal catalog records.\nThe admin proposal seeks self-service configuration in place of source changes for every tile update.\nThe manual describes separate maker and checker users, activation, deactivation, and per-record audit history.\nThe documents do not establish current production authorization or release controls.\n\n## Documented knowledge\n\n### Purpose and component vocabulary\n\nThe admin overview describes a previous process that changed `mfe-base` source and raised a production change request.\nIt proposes tenant-maintained configuration to reduce that repeated release work.\nIt records reuse of `single-ui-bff` for the admin backend.\nThe proposal does not establish an approved exemption from production change controls.\n[Admin overview, lines 1–37](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/page.md>)\n\nThe user manual identifies three admin functions: Module Mapping, Drawer Category, and Tile Configuration.\nA module mapping connects an import-map module name with its asset path.\nA drawer category groups application tiles.\nA tile record connects display details, container and route information, and entitlement configuration.\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nThe schema draft separates application categories, application tiles, and tile authorization records.\nIts tile authorization records link a tile to EMS2 entities.\nThese draft relationships explain the design vocabulary, rather than the deployed database schema.\n[Admin schema draft, lines 3–60, 99–101](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Table Schema and Screen Draft/page.md>)\n\n### Team responsibilities and onboarding sequence\n\nThe development principle assigns portal-backend availability to the microfrontend team.\nIt assigns each application's backend availability to its application team.\nApplication teams choose deployment approaches and provide static-file and API URLs for NGINX configuration.\nThe document also separates feature-branch contribution from shared-repository review and approval responsibilities.\n[Development principle, lines 2–10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Development Principle/page.md>)\n\nThe frontend procedure starts from separate container and tile templates.\nIt updates names, webpack, interfaces, entry points, tests, and the local import map.\nIt then links application registration through the admin manual.\nEach application supplies its build pipeline and informs the portal team about static-file and API URLs.\n[Frontend onboarding, lines 1–15](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Frontend Onboarding Process/page.md>)\n\nThe backend procedure requests application URLs for proxy configuration and CORS handling.\nIt requires application role or entitlement setup in EMS2.\nIt directs services to SDK-based JWT validation and entitlement integration.\nOnboarding therefore spans routing, authentication, authorization data, and UI registration.\n[Backend onboarding, lines 1–7](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Backend Onboarding Process/page.md>)\n\nThe EMS2 procedure creates an entity, actions, roles, and subjects.\nIt then assigns actions to role-and-subject combinations.\nThe admin manual identifies `FMO PORTAL ADMIN` entitlements for import-map, category, and tile functions.\nThese procedures describe prerequisites; they do not establish completed grants for any current operator.\n[EMS2 setup procedure, lines 1–12](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Creating EMS2 Entity Role Subject Action/page.md>)\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\n### Review and activation workflow\n\nThe manual requires different maker and checker users.\nCreation and modification produce an `un-verified` record.\nAnother user checks and verifies that record before activation.\nThe manual states that each admin function maintains its own audit history.\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nFor module mappings, users enter the module name without `@fm/` or spaces.\nThe manual says the active import-map API adds `@fm/` automatically.\nThe stored path supplies the import-map value.\nThese input conventions connect administration with frontend module loading.\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nTile configuration captures labels, descriptions, theme images, container identity, routes, role subjects, and role entities.\nModule and tile paths must match their corresponding routing paths.\nThe manual requests those paths without a leading slash or spaces.\nIt describes API conversion of comma-separated role entities into an array.\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nThe manual permits deactivation of a verified record and returns it to `un-verified` status.\nIt provides record-specific history viewing.\nThe supplied text does not fully specify rollback, activation propagation, or concurrent edits.\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\n### Historical persistence relationships\n\nThe Flyway page configures a schema-history table and enables migration baselining from version zero.\nIts SQL defines import-map records with unique keys and categories with unique labels.\nTile records reference both category and import-map records through foreign keys.\nSeparate import-map, category, and tile audit tables preserve the design's change-history vocabulary.\nThese relationships describe retained SQL, rather than a confirmed deployed schema or executed migration.\n[Flyway configuration and schema, lines 16–24, 77–220](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Flywaydb/page.md>)\n\n### Draft routing intake and operational context\n\nThe NGINX draft collects an upstream name, host, port, route path, rewrite rule, protocol, and request limits.\nIts intake also includes environment, WebSocket settings, timeout values, load-balancing method, and custom headers.\nThese fields explain the routing information required during tenant onboarding.\nThey do not establish current endpoint values, active configuration, or a working deployment pipeline.\n[NGINX draft, lines 3–46](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Drafts/The Proxy Config of Nginx Operation Standard Step/page.md>)\n\nThe draft separates non-production maintenance from UAT and stage configuration work.\nIts manual-deployment discussion identifies configuration testing and rollback as improvement proposals.\nThose proposals require an applicable operating procedure before use.\n[NGINX environment discussion, lines 48–61](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Drafts/The Proxy Config of Nginx Operation Standard Step/page.md>)\n\nThe retained firewall register supplies operational connectivity context for tenant onboarding.\nIts addresses and contact details remain in the original material.\nCurrent network approvals and reachability were not verified.\n[Firewall operational register, lines 1–8](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Firewall Configurations/page.md>)\n\n### Current empty-subject clarification\n\nThe [explicit user answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/empty-subject-source.json) permits tile visibility and launch through one configured EMS2 entity.\nThe user must satisfy portal-entry requirements and hold entitlement for that entity.\nThe tile's subject setting must be empty.\nThe [owner and scope answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/empty-subject-owner-scope-source.json) identifies `portal team` across local, test, UAT, and production.\nThe SDK criterion ([[wb-candidate-security-kt-sdk-and-entitlements]]) defines the measurable results.\n\nThis explicit user clarification is the first-priority intended-behavior reference within its scope.\nIt selects no multiple-entity matching rule or SSDR delegation option.\nApplication data permissions, publication approval, and deployed enforcement remain separate.\n\n### SSDR entitlement discussion\n\nThe SSDR discussion describes report and download users with differing EMS2 entity assignments.\nIt proposes multiple tile entities and optional subject checks for selected tenants.\nAn empty subject would skip that validation under the described proposal.\nIt also considers adding missing EMS2 assignments or delegating authorization to SSDR.\n[SSDR onboarding discussion, lines 3–20, 27–37, 67–69](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/On Boarding Records/SSDR On Board Discussion/page.md>)\n\nThe temporary guest-access approach is struck through.\nThe discussion states that the portal does not implement entitlement control outside existing systems such as EMS2.\nThese recorded alternatives do not establish an approved bypass, selected solution, or deployed permission rule.\n[SSDR alternatives and boundary, lines 42–69](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/On Boarding Records/SSDR On Board Discussion/page.md>)\n\n## Connections\n\nFrontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) explains containers, tiles, routing, and import maps.\nSDK and entitlements ([[wb-candidate-security-kt-sdk-and-entitlements]]) explains backend validation and application permissions.\nAuthentication and sessions ([[wb-candidate-security-kt-authentication-and-sessions]]) separates user login from tenant configuration.\nRelease operations ([[wb-candidate-operations-kt-release-operations]]) connects configuration work with documented release procedures.\n\nCapability `single-ui-application-catalog` groups declared catalog interfaces.\nContracts `single-ui-importmap-admin`, `single-ui-active-importmap`, and `single-ui-category-tile-admin` provide existing interface context.\nThese declarations do not establish operator permissions, approved workflow, or passing maker-checker enforcement.\n\n## Evidence limits\n\nThe overview and schema are proposals; the manual provides procedural instructions.\nTheir source revisions and current applicability remain unconfirmed.\nCombining them cannot establish that all proposed controls became production behavior.\nOwner: unknown.\nNext action: identify the current manual and schema through an applicable release record.\n[Admin overview, lines 1–37](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/page.md>)\n[Admin schema draft, lines 3–60, 99–101](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Table Schema and Screen Draft/page.md>)\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nThe EMS2 setup page refers to absent entitlement spreadsheets, change attachments, and later setup actions.\nThe manual also depends on screenshots absent from this copy.\nDetailed grants and visual procedures cannot be reconstructed from those references alone.\nOwner: unknown.\nNext action: retrieve the missing materials or retain a reviewed textual procedure.\n[Admin EMS2 setup, lines 7–31](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/EMS2/page.md>)\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nThe Flyway SQL, NGINX draft, and firewall register have no inspected deployment or connectivity execution.\nTheir retained definitions cannot establish the current schema, active routes, or network permissions.\nOwner: unknown.\nNext action: connect applicable migrations, operating procedures, and environment-specific checks before executing onboarding changes.\n[Flyway configuration and schema, lines 16–24, 77–220](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Flywaydb/page.md>)\n[NGINX environment discussion, lines 48–61](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Drafts/The Proxy Config of Nginx Operation Standard Step/page.md>)\n[Firewall operational register, lines 1–8](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Firewall Configurations/page.md>)\n\n## Open questions\n\nHow do tenant boundaries apply to maker and checker permissions?\nThe proposal discusses tenant-specific roles; the manual lists shared admin subjects and a different-user check.\nThe supplied text does not establish record-level tenant isolation.\nOwner: unknown.\nNext action: map role checks to record ownership and retain denied-cross-tenant assertions.\n[Admin overview, lines 1–37](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/page.md>)\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nWhich production controls govern self-service configuration changes?\nThe overview proposes avoiding repeated change requests, while the manual describes record review and audit history.\nThese statements do not establish an approved production governance policy.\nOwner: unknown.\nNext action: record the applicable release, approval, rollback, and emergency-change rules.\n[Admin overview, lines 1–37](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/page.md>)\n[Admin user manual, lines 3–35, 49–127, 169–217](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/User Manual/page.md>)\n\nWhich SSDR entitlement option and multiple-entity matching rule apply to the current tenant configuration?\nThe discussion records alternatives and a struck-through guest-access proposal without retained approval or execution.\nThe [empty-subject clarification](#current-empty-subject-clarification) resolves the single-entity scope only.\nOwner: unknown.\nNext action: Resolve multiple-entity matching and SSDR delegation before accepting those separate scopes.\n[SSDR onboarding discussion, lines 13–69](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/On Boarding Records/SSDR On Board Discussion/page.md>)\n",

    "markdown": "---\ntitle: \"Architecture evolution and proposal boundaries\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/evolution/KT-architecture-evolution.md\nsource: raw/workbench/knowledge/candidates/evolution/KT-architecture-evolution.md\nsource_hash: e89f82a3803eb61b\nlast_updated: 2026-11-11\ncandidate_id: KT-architecture-evolution\ncandidate_version: 2\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: evolution\nworkbench_origin: knowledge/candidates/evolution/KT-architecture-evolution.md\nworkbench_sha256: e89f82a3803eb61b562c419e82df1ed29f44c1510d6499aa731821ae08114552\nworkbench_status: candidate-derived\n---\n\n# Architecture evolution and proposal boundaries\n\n## Scope\n\nThis topic preserves the relationships between historical evaluations, technical experiments, and future platform proposals.\nIt separates documented recommendations from adoption evidence.\nThe materials do not establish one continuous, approved architecture roadmap.\n\n## Summary\n\nComponent-library comparisons address design consistency and application needs.\nBuild-tool research addresses development tooling within the microfrontend architecture.\nNotification experiments explore common event delivery across tiles.\nThe deployment proposal describes broader platform changes for 2026 and early 2027.\nTheir decision status and implementation relationships remain unresolved.\n\n## Documented knowledge\n\n### Component-library evaluation\n\nThe library comparison records GitHub statistics dated 5 July 2023.\nIt compares MUI, Ant Design, and AG Grid across components, styling, licensing, and related criteria.\nThe Ant Design note emphasizes forms, feedback components, and layout differences. [Library comparison](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/UI Library Comparations/page.md#L1>); [Ant Design assessment](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/UI Library Comparations/Usage of Ant Design/page.md#L1>).\nThese records explain evaluation concerns at their stated historical context.\nThey do not establish present library capabilities or an accepted purchasing decision.\n\nThe conceptual-design draft contains unresolved rationale and selection placeholders.\nIts review and decision tables do not establish completed approval.\nIts approval link points to a ClickHouse design without explaining relevance. [Draft assessment](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/UI Library Comparations/Draft/Conceptual Design DRAFT/page.md#L7>); [Draft review and decision sections](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/UI Library Comparations/Draft/Conceptual Design DRAFT/page.md#L169>).\nKeep this draft separate from a completed architecture decision.\n\n### Composition as a migration constraint\n\nThe UI stack explanation distinguishes SystemJS module resolution from single-spa lifecycle management.\nThe development guideline records shared MUI themes and a specific React version. [Stack responsibilities](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/UI Tech Stack/page.md#L35>); [Guideline baseline](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Development Guideline/page.md#L1>).\nThese materials explain why a tooling migration must consider more than individual application builds.\nInference: Changed output formats or shared dependencies can affect the portal loading boundary.\nThe applicable implementation versions require inspection before validating that inference for a proposed migration.\n\n### Build-tool research\n\nThe research recommends Rspack for incremental migration from Webpack and Vite for new or simpler applications.\nIt treats SystemJS compatibility as an architectural constraint.\nIts proposed pilot checks loading, HMR, and asset paths before gradual rollout. [Research conclusions](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/UI Tech Stack/React Build Tooling Research Report/page.md#L13>); [Pilot proposal](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/UI Tech Stack/React Build Tooling Research Report/page.md#L261>).\n\nThe report also proposes a longer-term move away from SystemJS.\nThat suggestion changes the platform boundary beyond a bundler substitution. [Long-term proposal](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/UI Tech Stack/React Build Tooling Research Report/page.md#L369>).\nThe supplied report lacks a publication date and retained project benchmark provenance.\nIts recommendations remain research statements, not verified technical conclusions or accepted migration instructions.\n\n### Notification experiments\n\nThe notification draft describes many tiles opening separate subscription connections.\nIt proposes one SSE connection per user to reduce browser resources. [Problem and objective](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/page.md#L58>).\nThis is proposed behavior; the source does not establish an accepted connection limit or deployed service.\n\nThe materials describe three distinct experiments.\nOne uses GraphQL over SSE with a Node.js backend.\nAnother uses GraphQL over WebSocket with Spring Boot.\nA third uses SSE with a Spring Boot backend. [GraphQL SSE POC](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/POC GraphQL over SSE/page.md#L11>); [WebSocket POC](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/POC GraphQL over WebSocket/page.md#L11>); [Spring SSE POC](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/POC SSE using Spring Boot/page.md#L11>).\nTheir branch and demonstration references establish experiment locations, not successful retained execution.\n\nThe store draft considers tile reactions through React effects or registered callbacks.\nIt declares `isRead` as a string but assigns boolean `false` in its event handler. [Store draft](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/Notification Store and React.useEffect/page.md#L1>); [Event handler](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/Notification Store and React.useEffect/page.md#L63>).\nThe field contract remains unresolved and must not become a generated implementation requirement without review.\n\n### Notification entity and retention draft\n\nThe table draft separates notification topics, user subscriptions, notification messages, and each user's read or display state.\nTopics connect container, module, tile, endpoint, and subscription payload.\nUser-topic records add enabled and muted preferences.\nNotification records carry message payloads; user-notification records hold read and display flags.\n[Notification table draft, lines 1–11, 18–32](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/Table Schema/page.md#L1>).\n\nThe same draft suggests one-hour, six-hour, or 24-hour retention for messages and per-user notification data.\nThese are unresolved alternatives, not an approved retention policy.\nThe draft does not establish cleanup behavior or how retention interacts with unread notifications.\n[Retention alternatives, lines 20 and 30](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/Table Schema/page.md#L20>).\n\n### Platform proposals for 2026 and early 2027\n\nThe deployment proposal describes tenant changes, workflow AI, telemetry, and infrastructure migration.\nIt lists notification, persona dashboards, and OpenFin as refining requirements.\nIts target deployment names separate authentication, tile-management, telemetry, and AI services. [Proposed changes](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L3>); [Target services](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L58>).\n\nThe current-architecture section has no explanatory content.\nThe target logical-architecture section has no explanatory content either.\nThe proposed service names therefore do not define their interfaces or migration path. [Architecture sections](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L1>); [Target logical architecture](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L49>).\n\n### Unchecked future-work list\n\nA separate unchecked list proposes central-monitoring foundation work and an upgrade to Spring Boot 4.0.6.\nIt also proposes moving properties into services and removing account-and-password login.\nThe list supplies proposed work, without completion records, migration order, or accepted scope.\nIts wording cannot establish current platform versions or enabled login methods.\n[Unchecked work list, lines 1–4](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Markets Operations One Release/Markets Operation One TODO List/page.md#L1>).\n\n## Connections\n\n- Portal purpose ([[wb-candidate-background-kt-portal-purpose]]) supplies the capability context for these proposals.\n- Frontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) supplies the documented loading and ownership boundaries.\n- Application interoperability ([[wb-candidate-interoperability-kt-application-interoperability]]) covers OpenFin and cross-application context.\n- Observability and performance ([[wb-candidate-observability-kt-observability-and-performance]]) distinguishes monitoring and reported measurements from proposal estimates.\n- Release operations ([[wb-candidate-operations-kt-release-operations]]) provides operating constraints for an eventual migration.\n\n## Evidence limits\n\nEvidence: The [source manifest](../../../../evidence/knowledge/manifest.yaml) identifies local bytes without original page revisions or confirmed source authority.\nConsequence: The citations support a reproducible reading but do not establish approved or current project intent.\nOwner: unknown.\nNext action: Confirm source ownership, applicability, and original revisions before publication.\n\nEvidence: The [library comparison](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/UI Library Comparations/page.md#L3>) dates some statistics to 2023, while the [conceptual draft](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/UI Library Comparations/Draft/Conceptual Design DRAFT/page.md#L7>) retains placeholders.\nConsequence: Historical comparison and incomplete rationale cannot establish an accepted current technology standard.\nOwner: unknown.\nNext action: Locate the completed component and licensing decisions, including their effective versions.\n\nEvidence: The [build-tool report](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/UI Tech Stack/React Build Tooling Research Report/page.md#L52>) provides benchmark tables without retained inputs or execution records.\nConsequence: Its performance rankings cannot predict results for these repositories.\nOwner: unknown.\nNext action: Identify the report's provenance and evaluate a bounded project pilot before adopting its recommendation.\n\nEvidence: The [notification draft](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/page.md#L92>) references experiments and absent demonstration materials.\nConsequence: The chosen protocol, supported schema, and production adoption remain unproved.\nOwner: unknown.\nNext action: Locate the accepted notification decision, supported code revision, and relevant execution evidence.\n\nEvidence: The [deployment proposal](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Portal New Deployment/page.md#L49>) leaves architectural detail incomplete.\nConsequence: AI cannot infer service contracts, migration order, or approved delivery scope from its target list.\nOwner: unknown.\nNext action: Obtain accepted requirements and a complete design before deriving implementation tasks.\n\nEvidence: The [notification table draft](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Notification (DRAFT)/Table Schema/page.md#L20>) gives three retention alternatives.\nConsequence: An implementation cannot derive an accepted cleanup interval or unread-message rule from this draft.\nOwner: unknown.\nNext action: Agree notification ownership, retention, cleanup, and unread-message behavior before deriving acceptance criteria.\n\n## Open questions\n\nOwner: unknown for all questions.\n\n- Which component-library and licensing choices have accepted decisions and effective dates?\n- Who authored the build-tool research, and which versions and benchmark runs support it?\n- Which notification experiment, if any, became a supported portal service?\n- Which 2026 and 2027 target services have approved requirements and deployed implementations?\n\n- Which notification retention and unread-message rules have accepted decisions?\n- Which unchecked work items have accepted scope, owners, and completion evidence?\n\nNext action: Resolve decision status and applicability before combining these materials into a current architecture baseline.\n",

    "markdown": "---\ntitle: \"Active session renewal\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/requirements/REQ-active-session-renewal.md\nsource: raw/workbench/knowledge/candidates/requirements/REQ-active-session-renewal.md\nsource_hash: 773d38682e922289\nlast_updated: 2026-11-11\ncandidate_id: REQ-active-session-renewal\ncandidate_version: 7\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: \nworkbench_origin: knowledge/candidates/requirements/REQ-active-session-renewal.md\nworkbench_sha256: 773d38682e922289f8241512f7ed3819313d0da17d51671c143ca292842711e3\nworkbench_status: candidate-derived\n---\n\n# Active session renewal\n\n**Status: candidate requirement for intended target behavior. Human publication review remains pending.**\n\n## Intended scope\n\nThese criteria define the requested ideal session behavior.\nMouse, keyboard, and scroll activity must support continued renewal without an elapsed-time-only authentication maximum.\nManual recovery must keep the expiry prompt open until renewal succeeds and permit retry after rejection.\nThe recorded user replies supply intent. Their exact source identities are listed above.\n\nImplementation, execution, rollout, backlog, and conformance belong in the independent [intent-to-reality gap record](../../../../tasks/portal-background-session-20261019/09-intent-reality-gaps.md).\nThose records do not change these seven criteria or approve a substitute behavior.\nSupporting cancellation and request-sharing boundaries have no separate approved criterion in this requirement.\nTheir operational disposition belongs in the gap record.\n\n## Description\n\nMouse, keyboard, and scroll activity must support continued portal-session renewal.\nElapsed time alone must not require fresh authentication while eligible activity and successful renewal continue.\nAfter inactivity expires the access token, retain renewal through the existing refresh token.\nContinued eligible activity must preserve renewal across the initial refresh-token expiry.\nThe user confirmed this requested target on 20 October 2026.\nThe requested policy comes from the user's recorded replies.\nIt does not establish that the supplied implementation already satisfies every scenario.\n\n## Rationale\n\nThe user requested continued renewal during eligible activity and refresh-token renewal after inactivity.\nThe requested behavior reduces repeated authentication during portal use.\nExpired or revoked credentials cannot authorize renewal.\nA valid access token can support replacement refresh credentials under the existing service contract.\nRecovery without any usable credential and provider failures remain separate boundaries.\nThe controlled intervals below define measurable scenarios. They introduce no production timeout setting.\n\n## Acceptance criteria\n\n```gherkin\nScenario: AC-1\n  Given a valid portal session with at least 30 seconds remaining before access expiry\n  When mouse movement occurs every 100 milliseconds for 15 seconds\n  Then at least one successful renewal occurs before the controlled interval ends\n```\n\n```gherkin\nScenario: AC-2\n  Given a valid portal session with at least 30 seconds remaining before access expiry\n  When keyboard input occurs every 100 milliseconds for 15 seconds\n  Then at least one successful renewal occurs before the controlled interval ends\n```\n\n```gherkin\nScenario: AC-3\n  Given a valid portal session with at least 30 seconds remaining before access expiry\n  When scroll activity occurs every 100 milliseconds for 15 seconds\n  Then at least one successful renewal occurs before the controlled interval ends\n```\n\n```gherkin\nScenario: AC-4\n  Given successful renewal responses and accepted user activity before each access deadline\n  And the initial refresh token expires within the controlled interval\n  When a controlled clock advances through four hours of continued activity\n  Then zero fresh SSO prompts occur solely because elapsed session time crosses an earlier maximum\n```\n\n```gherkin\nScenario: AC-5\n  Given an idle-expiry prompt and a usable refresh token\n  When the user selects renewal and its request remains pending\n  Then the prompt has zero successful closure transitions before renewal succeeds\n```\n\n```gherkin\nScenario: AC-6\n  Given an idle-expiry prompt and a usable refresh token\n  When the requested renewal succeeds\n  Then the prompt closes exactly once after completion\n```\n\n```gherkin\nScenario: AC-7\n  Given an idle-expiry prompt and an unsuccessful refresh-based renewal request\n  When the request rejects\n  Then the prompt has zero successful closure transitions and permits another renewal attempt\n```\n\nThe controlled intervals are test fixtures, not new business timeout limits.\nNo finite test proves indefinite execution.\nReview the renewal path for fixed elapsed-time cutoffs and use bounded execution to test representative cycles.\n\nOwner: unknown.\nNext action: review the candidate criteria with the session owner before publication.\nImplementation plans, execution results, and conformance differences belong to the independent task gap record.\n",

    "markdown": "---\ntitle: \"Frontend composition and application ownership\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/architecture/KT-frontend-composition.md\nsource: raw/workbench/knowledge/candidates/architecture/KT-frontend-composition.md\nsource_hash: c3a94ee436261ed9\nlast_updated: 2026-11-11\ncandidate_id: KT-frontend-composition\ncandidate_version: 3\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: architecture\nworkbench_origin: knowledge/candidates/architecture/KT-frontend-composition.md\nworkbench_sha256: c3a94ee436261ed95cf91fe02bcb4c15965a95cea03a548070a96f16529b2718\nworkbench_status: candidate-derived\n---\n\n# Frontend composition and application ownership\n\n## Scope\n\nThis topic explains the documented composition model and the responsibilities required to onboard an application.\nIt connects design explanations, development guidance, and setup procedures.\nThe linked architecture clarification adds bounded inspection of current local source.\nDeployed interface compatibility remains unconfirmed.\nThe source dates and applicable framework versions remain partly unresolved.\n\n## Summary\n\nThe design separates common platform modules from application-owned domain modules.\nImport maps connect module names to deployed files.\nThe shared base supplies common context while tenant teams supply containers and tiles.\nThe [ownership design](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Micro-frontend/page.md#L130>) and [onboarding procedure](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Frontend Onboarding Process/page.md#L1>) describe this division.\n\n## Documented knowledge\n\n### Current four-layer clarification\n\nThe user identifies four layers: Root Config, Base shell, application container, and feature tile.\nThe service relationship record ([[wb-candidate-architecture-arc-portal-service-relationships]]) retains the layer roles and inspected loading paths.\nSingle-SPA registers only the shell. SystemJS and React Router support successive container and tile loading.\nContainer and tile props select distinct route stages.\n\nThe [clarification](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/user-message.txt#L7-L12) supplies current reported architecture.\nThe [source review](../../../../evidence/knowledge/sources/user-clarifications/architecture-20261022/source-review.json) records matching local declarations and limits.\nJavaScript entry bundles can produce lazy chunks. Shared-code dependencies also point back toward common libraries.\nThis clarification does not establish runtime rendering, accepted dependency versions, or active deployment.\n\n### Why the design separates modules\n\nThe microfrontend explanation identifies coupled releases, broad testing scope, unclear ownership, and repeated components as design problems.\nIt proposes application-specific repositories and pipelines alongside shared modules.\nThe intended benefit is separate team delivery within one user workspace. [Design problems and ownership](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Micro-frontend/page.md#L119>).\nThese are design goals; the document does not demonstrate their achievement across every application.\n\n### Roles in composition\n\n| Element | Documented responsibility |\n| --- | --- |\n| Root configuration and import map | Locate modules and support shared loading configuration. |\n| SystemJS | Resolve module names to files and load modules into the page. |\n| Single-spa | Mount applications and manage application lifecycle. |\n| Base container | Provide common routing, global state, and theme context. |\n| Application container | Connect an application's domain modules with the shared portal. |\n| Application tiles | Supply user-facing domain views that open within workspaces. |\n| Nginx integration | Route application static files and API requests through configured locations. |\n\nThe [module design](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Micro-frontend/page.md#L147>), [stack explanation](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/UI Tech Stack/page.md#L35>), and [development principles](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Development Principle/page.md#L4>) support these roles.\nThe table explains the source model; it does not assert the current runtime implementation.\n\n### Ownership and availability\n\nThe principles assign shared backend availability to the microfrontend team.\nThey assign application-domain backend availability to each application team.\nEach application team can choose its deployment approach and must supply static-file and API URLs.\nThe same principles reserve review and approval of shared repositories to the microfrontend team. [Team responsibilities](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Development Principle/page.md#L4>).\n\nThe sources record role declarations. Current named owners and effective approvals remain unknown.\n\n### Documented onboarding sequence\n\n1. Obtain root configuration and application templates.\n2. Create separate application container and tile repositories.\n3. Update module names, build configuration, imports, interfaces, and container entry points.\n4. Update unit tests and the local import map.\n5. Configure the tile through the Admin Module procedure.\n6. Build and deploy the application files, then supply static-file and API URLs to the platform team.\n\nThis sequence condenses the [frontend onboarding procedure](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Frontend Onboarding Process/page.md#L1>).\nThe [getting-started guide](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Getting Started with Single-Spa Micro-Frontend/page.md#L11>) describes three local projects and attached source archives.\nThose archives and setup screenshots are absent from the supplied copy.\nThis ingestion executed no setup command or deployment.\n\n### Shared code and compatibility\n\nThe design uses exports and imports to share modules through registered names.\nThe framework comparison distinguishes shared dependencies from libraries retained within individual applications.\nIt cautions that shared dependencies require coordinated upgrades. [Sharing model](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Micro-frontend/page.md#L79>); [Dependency comparison](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Single SPA vs Module Federation vs iFrame/page.md#L11>).\nInference: A shared interface change can affect several tenant consumers.\nThis inference requires exact provider and consumer evidence before assessing a particular change.\n\n### Development guidance and performance boundaries\n\nThe guideline prescribes TypeScript, functional components, shared MUI themes, and separation of view, logic, styles, and interfaces.\nIt also names React 18.2.0 and prefers Context and Reducer over additional state libraries. [Development guideline](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Development Guideline/page.md#L1>).\nThese versioned instructions must retain their source context before reuse for new development.\n\nThe onboarding procedure suggests 500 KB files and six concurrent static-file requests as optional loading guidance.\nIt does not establish an accepted performance SLA. [Optional loading guidance](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Frontend Onboarding Process/page.md#L15>).\n\n### Standalone React integration pattern\n\nThe standalone guide describes a React template that reuses MFE-Base components through import-map registration.\nIts no-install statement concerns consuming those components; the example still installs the template's own dependencies.\nThe guide also states that the template includes Jest configuration.\n[Standalone template, lines 1–17](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/ReactJS Standalone Project/page.md#L1>).\n\nThis pattern describes shared-component reuse outside the documented container-and-tile startup example.\nIt does not establish that every standalone application can integrate without adaptation.\nThe linked `simple-app.zip` archive and screenshot are absent from this supplied copy.\nCurrent template, dependency, and loading compatibility require separate inspection.\n[Standalone archive and setup, lines 7–17](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/ReactJS Standalone Project/page.md#L7>).\n\n### External frontend dependencies\n\nThe supplementary principle prohibits direct external GUI dependencies unless platform governance reviews and approves an exception.\nIt describes internal packaging and tenant-owned backend encapsulation as implementation options.\nTenant teams retain security, licensing, vulnerability, support, resilience, and rollback responsibilities.\nThese are source-stated rules with unconfirmed authority and effective applicability.\n[Dependency principle, lines 3–10, 23–54](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Supplementary Principle_ External Frontend Dependency Control/page.md#L3>).\n\n## Connections\n\n- Portal purpose ([[wb-candidate-background-kt-portal-purpose]]) explains the user and platform goals behind composition.\n- Administration and onboarding ([[wb-candidate-operations-kt-admin-and-onboarding]]) supplies tile configuration and promotion context.\n- Authentication and sessions ([[wb-candidate-security-kt-authentication-and-sessions]]) and SDK and entitlements ([[wb-candidate-security-kt-sdk-and-entitlements]]) describe identity propagation across these boundaries.\n- Release operations ([[wb-candidate-operations-kt-release-operations]]) describes controlled delivery and rollback procedures.\n- Architecture evolution ([[wb-candidate-evolution-kt-architecture-evolution]]) distinguishes existing guidance from migration proposals.\n\n## Evidence limits\n\nEvidence: The [source manifest](../../../../evidence/knowledge/manifest.yaml) identifies local bytes without original page revisions or confirmed source authority.\nConsequence: The citations support a reproducible reading but do not establish approved or current project intent.\nOwner: unknown.\nNext action: Confirm source ownership, applicability, and original revisions before publication.\n\nEvidence: The [getting-started guide](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Getting Started with Single-Spa Micro-Frontend/page.md#L13>) depends on missing archives and screenshots.\nConsequence: The supplied text cannot reproduce its complete setup procedure.\nOwner: unknown.\nNext action: Recover the applicable templates and compare them with exact registered repository revisions.\n\nEvidence: The [guideline](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Development Principle - Development Guideline - Onboarding Process/Development Guideline/page.md#L2>) names an older React version without an effective-date or supersession record.\nConsequence: Its technical instructions cannot establish the current platform baseline.\nOwner: unknown.\nNext action: Confirm accepted versions, shared dependency policy, and applicable guideline revisions.\n\nEvidence: The [framework comparison](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/Single SPA vs Module Federation vs iFrame/page.md#L18>) contains scores and technical opinions without retained project measurements.\nConsequence: Its ranking cannot establish current compatibility, security, or performance.\nOwner: unknown.\nNext action: Treat it as historical rationale and collect project evidence for any new framework decision.\n\nEvidence: The [standalone guide](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/ReactJS Standalone Project/page.md#L7>) depends on an absent template archive.\nConsequence: Its reuse instructions cannot establish runnable setup or current shared-component compatibility.\nOwner: unknown.\nNext action: Recover the applicable template and inspect its import map, shared dependencies, and retained test assertions.\n\n## Open questions\n\nOwner: unknown for all questions.\n\n- Which exact repository revisions implement the current container, tile, and routing interfaces?\n- Which development guidelines and shared dependency versions are currently accepted?\n- Which owner controls compatibility changes across shared modules and tenant applications?\n- Which dependency exceptions have platform review, accountable tenant ownership, and effective dates?\n\n- Which standalone template and shared-component versions remain supported?\n\nNext action: Resolve the relevant boundary before using this topic to implement a new application or shared change.\n",

    "markdown": "---\ntitle: \"Authentication and sessions\"\ntype: source\ntags: []\nsources: []\nsource_file: raw/workbench/knowledge/candidates/security/KT-authentication-and-sessions.md\nsource: raw/workbench/knowledge/candidates/security/KT-authentication-and-sessions.md\nsource_hash: f24b8314e2d2acf1\nlast_updated: 2026-11-11\ncandidate_id: KT-authentication-and-sessions\ncandidate_version: 9\ncandidate_governance_state: candidate\ncandidate_status: draft\ncandidate_classification: security\nworkbench_origin: knowledge/candidates/security/KT-authentication-and-sessions.md\nworkbench_sha256: f24b8314e2d2acf1b0656d4324a20071f205c1240c9ebf4623c024e0efd8fdbb\nworkbench_status: candidate-derived\n---\n\n# Authentication and sessions\n\n## Scope\n\nThis topic connects user authentication, portal sessions, and the supplied Entra migration materials.\nIt describes intended behavior, source design statements, and historical proposals.\nIt does not establish deployed behavior or approved security policy.\n\n## Summary\n\nThe target portal authenticates users, obtains entitlements, and issues tokens for application requests.\nIts session materials distinguish idle timeout, absolute timeout, refresh tokens, and repeated login.\nEntra migration replaces the SSO provider while preserving separate entitlement and portal-session responsibilities.\nSeveral intended timing and activation rules require reconciliation.\n\nFor all portal environments, the user selected denial when an authenticated SC user lacks any registered application entity entitlement.\nThis is user-stated intent, not approved policy or verified enforcement.\nThe [retained answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/ui-q-002-source.json) and [scope answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/ui-q-002-scope-source.json) preserve the selections.\n\n## Documented knowledge\n\n### Intended session renewal\n\nThe active-session requirement ([[wb-candidate-requirements-req-active-session-renewal]]) defines the ideal target behavior.\nEligible mouse, keyboard, and scroll activity must support continued portal-session renewal.\nElapsed time alone must not require fresh authentication while eligible activity and successful renewal continue.\nThe target includes continued renewal across the initial refresh-token expiry.\n\nDuring manual recovery, the expiry prompt must remain open while renewal is pending.\nSuccessful renewal must close the prompt exactly once after completion.\nA rejected renewal must preserve the prompt and permit another renewal attempt under the canonical criterion conditions.\nThe requirement holds the canonical measurable scenarios. This topic creates no additional scenario or timeout setting.\n\nThe independent [intent-to-reality gap record](../../../../tasks/portal-background-session-20261019/09-intent-reality-gaps.md) holds actual implementation and observation comparisons.\nDefects, passing observations, backlog, and deployment state do not redefine this intended behavior.\nHuman publication review remains pending for this candidate topic and its linked requirement.\n\n### Current user-stated portal-entry rule\n\nAn authenticated SC user with no entitlement for any registered application entity must be denied portal entry.\nThe user selected this rule for local, test, UAT, and production environments.\nThe [owner answer](../../../../tasks/ui-test-coverage-20261022/evidence/clarification-20261022/ui-q-002-owner-source.json) identifies `portal team` for this policy only.\nUser identity remains unknown. Portal-team authority and approval remain unconfirmed.\nApproval for the intended applicability remains pending.\n\nThe answer defines no HTTP status, denial wording, or additional entity-versus-role semantics.\n\nThe [draft principles, line 14](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Post Trade Portal Principles (Draft)/page.md#L14>) state the same denial direction.\nThe [older tile-security proposal, line 7](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Technical Design and Document/Tile Security Control - EMS2/page.md#L7>) instead permits entry for SC accounts.\nRetain that conflicting proposal as historical evidence, not the selected user intent.\nNeither historical source establishes approved applicability.\n\nThe SDK topic criterion ([[wb-candidate-security-kt-sdk-and-entitlements]]) defines the measurable business result.\nThe [clarification stage](../../../../tasks/ui-test-coverage-20261022/05-entry-clarification.md#ui-q-002) records resolution limits and the unchanged canonical case.\n\n\nThe user also selected denial for tiles without a configured EMS2 entity.\nThe SDK topic ([[wb-candidate-security-kt-sdk-and-entitlements]]) defines that separate rule across local, test, UAT, and production.\n\nThe empty-subject rule ([[wb-candidate-security-kt-sdk-and-entitlements]]) permits tile visibility and launch through one configured EMS2 entity.\nThe explicit user answer is the first-priority reference for this intended behavior.\nThe portal team owns this rule across local, test, UAT, and production.\n\n### Authentication responsibilities\n\nThe Entra design describes a browser redirect followed by an authorization-code exchange through the BFF.\nThe BFF builds user information, retrieves EMS2 entitlements, and issues authentication and entitlement tokens.\nIts design retains OneMFA fallback and a separate username/password path.\n[Entra design, lines 7–31, 40–68](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal Entra Migration - Phase 1 - UI SSO/UI SSO Entra Design/page.md>)\n\nThe phase 1 scope separates authentication from authorization.\nIt includes UI SSO migration.\nIt excludes EMS2 replacement, portal session management, and tenant-onboarding authentication.\nMachine-to-machine authentication has a separate migration document with unresolved central dependencies.\n[Entra phase 1, lines 15–21, 48–57](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal Entra Migration - Phase 1 - UI SSO/page.md>)\n[Service-account migration, lines 1–10](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal & RATAN Entra Migration - Phase 2 - service account/page.md>)\n\n### Session concepts and intended lifecycle\n\nThe documents use an access token to authenticate application requests.\nAn idle timeout limits inactivity.\nAn absolute timeout limits the interval since authentication.\nA refresh token supports another authentication interval without repeating the initial SSO journey.\nThese are documented concepts, rather than a confirmed runtime contract.\n[Session version 0, lines 1–9, 19–24, 38–65](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 0/page.md>)\n[Session version 1, lines 102–193](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 1/page.md>)\n\nVersion 0 states limits below 60 minutes for absolute timeout and below 15 minutes for idle timeout.\nIts examples use a 15-minute access token and a 24-hour refresh token.\nIt proposes an inactivity warning, session extension, single-device login, and reused-token rejection.\nThose examples do not resolve the strict-limit wording or current implementation.\n[Session version 0, lines 1–9, 19–24, 38–65](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 0/page.md>)\n\nVersion 1 proposes `exp = iat + 15 minutes` for idle timeout.\nIt relates absolute timeout to `auth_time` and a 60-minute `max_age` interval.\nIts proposed flow obtains a refresh token before access-token expiry.\nA later relogin exchanges the refresh token for another access token.\nIt places single-device login and token-blacklist work on a backlog.\n[Session version 1, lines 102–193](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 1/page.md>)\n\nVersion 1 contains both 105-minute and 225-minute refresh-token durations in the same calculation.\nIts absolute-timeout discussion also proposes changing `auth_time` during continued activity.\nThese statements cannot define a single reliable timing rule without review.\n[Session version 1, lines 102–193](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 1/page.md>)\n\nVersion 1 also states that refresh tokens have no absolute timeout because they lack `auth_time` and `max_age`.\nThis is a proposed source statement alongside competing duration and `auth_time` rules, rather than accepted policy.\n[Session version 1, lines 133–164](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 1/page.md>)\n\n### Entra onboarding and user profile\n\nThe non-production guide requires a development AD account, Authenticator registration, and RATAN AD-group membership.\nIt asks teams to check successful login, user information, and expected tile visibility.\nIts FAQ associates missing entitlements with tile access and EMS2 configuration.\n[Non-production verification guide, lines 5–56, 58–126](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal Entra Migration - Phase 1 - UI SSO/Entra SSO Non Prod Verification/page.md>)\n\nThe production guide specifies the intended pilot-user authentication journey.\nIt describes Windows Hello or Authenticator authentication and an Entra session of one hour.\nThat provider-session statement does not settle the portal refresh-token lifetime.\n[Production pilot guide, lines 1–2, 12–46, 48–86, 95–101](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal Entra Migration - Phase 1 - UI SSO/Entra SSO Prod Guide/page.md>)\n\nThe production guide warns that AD profile values differ from OUD values.\nIt identifies changed surname formatting, country codes, and missing locale values.\nDownstream audit or application logic can therefore require profile-field review during migration.\n[Production pilot guide, lines 1–2, 12–46, 48–86, 95–101](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal Entra Migration - Phase 1 - UI SSO/Entra SSO Prod Guide/page.md>)\n\n### Historical machine-to-machine authentication\n\nThe historical FMAA reference describes client-credential authentication for machine-to-machine callers.\nIt separates service-account onboarding from bank-ID onboarding.\nIt describes OUD-managed accounts authenticated through FMAA.\nIt states 17-year validity for service accounts and seven-day validity for bank IDs.\nThose historical values do not establish approved portal-session limits or current token policy.\n[Historical FMAA reference, lines 11–13, 24–30, 36–50](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Admin Module Release Flow/Admin Module Release Checklist Template/Reference of FMAA API/page.md>)\n\n## Connections\n\nSDK and entitlements ([[wb-candidate-security-kt-sdk-and-entitlements]]) explains downstream token validation and entitlement responsibilities.\nAdmin and onboarding ([[wb-candidate-operations-kt-admin-and-onboarding]]) connects tenant setup with role and tile configuration.\nFrontend composition ([[wb-candidate-architecture-kt-frontend-composition]]) explains the UI context for login and user state.\n\nRegistry capability `single-ui-authentication` connects declared repository and service identities.\nContract `single-ui-sso-token-family` supplies existing interface context for `single-ui-bff` and `mfe-base`.\nThese declarations do not prove that a migration design runs in any environment.\n\n## Evidence limits\n\nThe supplied documents have local byte revisions, but no confirmed original page revisions or approval authority.\nThis limits their use as current security policy.\nOwner: unknown.\nNext action: establish the applicable versions with the responsible security and application owners.\n\nHistorical session designs contain unresolved timing proposals.\nThey cannot establish one intended timing policy without an authoritative decision.\nOwner: unknown session owner. Next action: reconcile the intended timing rules before policy publication.\nImplementation and execution comparisons remain in the independent task gap record.\n\nThe design uses `ENABLE_ENTRA_SSO=true/false`; the production guide uses `yes/no`.\nThe production guide describes both temporary activation and persistent activation after first use.\nThese differences can produce incorrect pilot or fallback instructions.\nOwner: unknown.\nNext action: resolve the intended activation grammar and persistence rule with the responsible owner.\n[Entra design, lines 7–31, 40–68](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal Entra Migration - Phase 1 - UI SSO/UI SSO Entra Design/page.md>)\n[Production pilot guide, lines 1–2, 12–46, 48–86, 95–101](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Entra Migration/Post Trade Portal Entra Migration - Phase 1 - UI SSO/Entra SSO Prod Guide/page.md>)\n\n## Open questions\n\nWhat evidence confirms portal-team authority and approval across the user-stated environments?\nThe [retained answers](../../../../tasks/ui-test-coverage-20261022/05-entry-clarification.md#ui-q-002) establish user-stated intent and owner identity only.\nConsequence: policy publication requires applicable review and authority evidence.\nOwner: `portal team`, user-reported for entry policy only.\nNext action: obtain applicable authority and approval evidence.\n\nWhich intended timeout and refresh-duration rules apply to each supported environment?\nThe two session designs contain incompatible timing proposals.\nConsequence: those proposals cannot define one authoritative target timing policy.\nOwner: unknown session owner. Next action: review the intended timing table and token-reuse rule.\n[Session version 0](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 0/page.md>)\n[Session version 1](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/MFE Session Control and Implement Refresh Token/MFE Session Control and Implement Refresh Token Version 1/page.md>)\n\nWhich intended migration scope and authentication responsibilities have authoritative approval?\nThe supplied plans and guides require an applicable design decision.\nConsequence: historical schedules cannot select the target provider and fallback policy.\nOwner: unknown migration owner. Next action: confirm the intended provider contract and supported fallback boundaries.\n\nWhich documented FMAA flows and validity settings remain intended requirements?\nThe historical reference supplies exceptional validity examples.\nConsequence: copying those values into a target rule requires authoritative policy evidence.\nOwner: unknown authentication owner. Next action: confirm the intended provider contract and validity limits for each supported flow.\n[Historical FMAA reference](<../../../evidence/knowledge/sources/confluence/FM TPT UI Guild/Microfrontend/FMO Post Trade Portal Home/Admin Module/Admin Module Release Flow/Admin Module Release Checklist Template/Reference of FMAA API/page.md>)\n\nThe renewal requirement ([[wb-candidate-requirements-req-active-session-renewal]]) holds the canonical target criteria.\nThe independent [gap record](../../../../tasks/portal-background-session-20261019/09-intent-reality-gaps.md) holds actual behavior and evidence limitations.\n",
