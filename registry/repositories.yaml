schema_version: 1
repositories:
- id: single-ui-bff
  name: Single UI BFF
  primary_type: backend
  responsibility: Provide authentication, session, application catalog, import-map,
    and analytics endpoints.
  description: Initial local Git baseline of the supplied copy. Original history and
    source owner are unknown.
  source_ids:
  - single-ui-bff-git
  provides_contract_ids:
  - single-ui-sso-token-family
  - single-ui-importmap-admin
  - single-ui-active-importmap
  - single-ui-category-tile-admin
  - single-ui-analytics-proxy
- id: mfe-base
  name: MFE Base
  primary_type: frontend
  responsibilities:
  - Implement the Single UI application shell.
  - Export shared module interfaces and HTTP clients.
  - Render application containers and administration screens.
  description: Initial local Git baseline of the supplied copy. Original history and
    source owner are unknown.
  source_ids:
  - mfe-base-git
  provides_contract_ids:
  - single-ui-base-module
  - single-ui-shared-http
  consumes_contract_ids:
  - single-ui-container-props
  - single-ui-shared-http
  - single-ui-sso-token-family
  - single-ui-importmap-admin
  - single-ui-category-tile-admin
  - single-ui-analytics-proxy
- id: mfe-root-config
  name: MFE Root Config
  primary_type: frontend
  responsibility: Register the @fm/base application and declare frontend proxy routes.
  description: Initial local Git baseline of the supplied copy. Original history and
    source owner are unknown.
  source_ids:
  - mfe-root-config-git
  consumes_contract_ids:
  - single-ui-base-module
