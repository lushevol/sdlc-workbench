schema_version: 1
tools:
- id: service-dependencies
  kind: dependency_graph
  provider: graph.snapshot
  environment: local
  config:
    path: relationships/service-dependencies/generated
  allowed_operations:
  - coverage
  - relationships
  - services
  - search
  - neighborhood
- id: ratan-test-engine
  kind: testing
  provider: testing.robot
  environment: local-offline
  config:
    path: repos/testing/ratan-test-engine
    python: .venv/bin/python
    suites:
      offline-smoke: Tests/workbench/offline.robot
  allowed_operations:
  - list
  - run
- id: ratan-test-engine-checks
  kind: testing
  provider: testing.command
  environment: local-offline
  config:
    path: repos/testing/ratan-test-engine
    suites:
      doctor: [.venv/bin/python, scripts/workbench.py, doctor]
      doctor-full: [.venv/bin/python, scripts/workbench.py, doctor, --profile, full]
      inventory: [.venv/bin/python, scripts/workbench.py, inventory]
      parse: [.venv/bin/python, scripts/workbench.py, parse, Tests/workbench/offline.robot]
      parse-all: [.venv/bin/python, scripts/workbench.py, parse]
      unit: [.venv/bin/python, -m, unittest, discover, -s, Tests/workbench, -v]
  allowed_operations:
  - list
  - run
- id: ratan-test-engine-repository
  kind: repository
  provider: repository.git
  environment: local
  config:
    path: repos/testing/ratan-test-engine
  allowed_operations:
  - status
  - diff
- id: browser-investigation-checks
  kind: testing
  provider: testing.command
  environment: local-tooling-smoke
  config:
    path: adapters/browser
    suites:
      doctor: [node, browser.mjs, doctor]
      chromium-smoke: [node, browser.mjs, smoke, --browser, chromium]
      edge-smoke: [node, browser.mjs, smoke, --browser, msedge]
  allowed_operations:
  - list
  - run
- id: external-ado
  kind: connector
  provider: connector.mcp
  environment: external
  config:
    command: [node, core/connectors/workbench/bridge.js]
    connector: ado
    allowed_tools: ["wit_list_projects","wit_get_work_item","wit_get_work_items_batch_by_ids","wit_list_work_item_comments","wit_get_query_results_by_id","repo_list_repos_by_project","repo_get_file_content","repo_list_directory","repo_get_pull_request_by_id","repo_get_pull_request_changes","search_code","search_workitem","report_work_items","report_builds","report_build_timeline","report_build_artifacts","report_build_logs","report_build_properties","report_attachment","report_coverage","report_deployments","report_branches","report_compare","report_commits","report_commit_changes","report_file"]
  allowed_operations: [list, call]
- id: external-confluence
  kind: connector
  provider: connector.mcp
  environment: external
  config:
    command: [node, core/connectors/workbench/bridge.js]
    connector: confluence
    allowed_tools: ["confluence_search","confluence_read_page","confluence_get_page","confluence_find_page","confluence_get_page_children","confluence_list_spaces","confluence_get_space","confluence_get_labels"]
  allowed_operations: [list, call]
- id: external-scwiki
  kind: connector
  provider: connector.mcp
  environment: external
  config:
    command: [node, core/connectors/workbench/bridge.js]
    connector: scwiki
    allowed_tools: ["scwiki_search","scwiki_get_page","scwiki_find_page","scwiki_get_page_children","scwiki_list_spaces","scwiki_get_labels","scwiki_get_page_history","scwiki_list_attachments"]
  allowed_operations: [list, call]
- id: external-sonar
  kind: connector
  provider: connector.mcp
  environment: external
  config:
    command: [node, core/connectors/workbench/bridge.js]
    connector: sonar
    allowed_tools: ["sonar_search_projects","sonar_get_branches","sonar_get_quality_gate_status","sonar_get_issues","sonar_get_hotspots","sonar_get_measures","report_sonar_measures","report_sonar_gate","report_sonar_issues","report_sonar_hotspots","report_sonar_analyses"]
  allowed_operations: [list, call]
- id: external-nexus
  kind: connector
  provider: connector.mcp
  environment: external
  config:
    command: [node, core/connectors/workbench/bridge.js]
    connector: nexus
    allowed_tools: []
  allowed_operations: [list]
- id: external-messaging
  kind: connector
  provider: connector.mcp
  environment: external
  config:
    command: [node, core/connectors/workbench/bridge.js]
    connector: messaging
    allowed_tools: []
  allowed_operations: [list]
- id: external-web
  kind: connector
  provider: connector.mcp
  environment: external
  config:
    command: [node, core/connectors/workbench/bridge.js]
    connector: web
    allowed_tools: ["web_fetch","web_search","web_crawl"]
  allowed_operations: [list, call]

- id: release-report
  kind: release_report
  provider: release.report
  environment: external
  config:
    ado_resource: external-ado
    sonar_resource: external-sonar
    collection_timeout_seconds: 300
    request_timeout_seconds: 30
    ado_concurrency: 6
    sonar_concurrency: 2
  allowed_operations: [collect]
