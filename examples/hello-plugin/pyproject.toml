[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-example-hello"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["ai-sdlc-workbench>=0.1.0"]

[project.entry-points."ai_sdlc_workbench.providers"]
"example.hello" = "hello_provider:HelloProvider"

[tool.setuptools]
py-modules = ["hello_provider"]
