  <text x="458" y="855.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2864A8" text-anchor="start">Context joins the chain through distinct IDs</text>
  <text x="458" y="888.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Capability ↔ services ↔ repositories ↔ contracts. Source-backed dependency links retain coverage limits.</text>
  <polyline points="800,819 800,791 610,791 610,780" fill="none" stroke="#2864A8" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow2864A8)" />
  <rect fill="#173B50" stroke="none" stroke-width="1" x="60" y="962" width="1480" height="108" rx="14" />
  <text x="84" y="997.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Behavior evidence review checks contracts, source freshness, immutable saves, and baseline differences.</text>
  <text x="84" y="1039.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start">Runtime result: NOT_VERIFIED. Agents inspect meaning, assertions, observations, and remaining gaps.</text>
  <text x="60" y="1109.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#526779" text-anchor="start">Task evidence holds investigations and completed cases. Runtime actions remain in .workbench/. Domain knowledge remains in knowledge/.</text>
  <polyline points="60,1114 1540,1114" fill="none" stroke="#9AAAB7" stroke-width="1" stroke-linejoin="round" />
  <text x="60" y="1143.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#526779" text-anchor="start">S3 • S4 • S5 • S8  |  Catalog references do not prove deployed connectivity. Knowledge review does not prove execution.</text>
  <text x="1540" y="1143.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#526779" text-anchor="end">04 / 04</text>
