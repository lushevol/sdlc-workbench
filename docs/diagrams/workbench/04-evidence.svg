  <rect fill="#FFFFFF" stroke="none" stroke-width="1" x="0" y="0" width="1600" height="1180" rx="0" />
  <text x="60" y="49.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#526779" text-anchor="start">AI SDLC WORKBENCH     /     22 OCTOBER 2026</text>
  <text x="60" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#172A3A" text-anchor="start">From source authority to behavior evidence</text>
  <text x="60" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start">Knowledge review, source freshness, test outcomes, and business verification remain separate.</text>
  <text x="60" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#526779" text-anchor="start">KNOWLEDGE GOVERNANCE   /   AGENTS INTERPRET AND COORDINATE REVIEW</text>
