  <text x="328" y="485.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#16745C" text-anchor="start">Append-only audit and retained provenance</text>
  <text x="328" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Add a new YAML event for each governance change. Preserve earlier source bytes, hashes, and Git history.</text>
