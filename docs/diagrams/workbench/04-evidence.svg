  <text x="60" y="519.8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#526779" text-anchor="start">and superseded records.</text>
  <text x="60" y="608.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#526779" text-anchor="start">BEHAVIOR TRACEABILITY   /   EACH ARROW NEEDS ITS OWN EVIDENCE</text>
