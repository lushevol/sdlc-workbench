<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle control and feedback</title>
  <desc id="desc">Source-grounded Workbench diagram. See README.md for source references and implementation limits.</desc>
  <defs>
    <marker id="arrow16745C" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#16745C" />
    </marker>
    <marker id="arrow2864A8" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2864A8" />
    </marker>
    <marker id="arrow7153A1" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7153A1" />
    </marker>
    <marker id="arrow9A641B" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9A641B" />
    </marker>
    <marker id="arrow9AAAB7" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9AAAB7" />
    </marker>
  </defs>
  <rect fill="#FFFFFF" stroke="none" stroke-width="1" x="0" y="0" width="1600" height="1180" rx="0" />
  <text x="60" y="49.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#526779" text-anchor="start">AI SDLC WORKBENCH     /     22 OCTOBER 2026</text>
  <text x="60" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#172A3A" text-anchor="start">Lifecycle control and feedback</text>
  <text x="60" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start">Business behavior follows task intake. Agents assess readiness for each named next phase.</text>
  <text x="60" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#526779" text-anchor="start">A   RECEIVE → DISCOVER → UNDERSTAND → RELATE → ANALYZE</text>
  <rect fill="#E8F5EE" stroke="#16745C" stroke-width="1" x="60" y="245" width="210" height="135" rx="14" />
  <text x="78" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16745C" text-anchor="start">1  Receive</text>
  <text x="78" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Create task intake.</text>
  <text x="78" y="336.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Record scope.</text>
  <text x="78" y="359.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Index the inputs.</text>
  <rect fill="#E8F5EE" stroke="#16745C" stroke-width="1" x="300" y="245" width="210" height="135" rx="14" />
  <text x="318" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16745C" text-anchor="start">2  Discover</text>
  <text x="318" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Find assets and tools.</text>
  <text x="318" y="336.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Read schemas.</text>
  <text x="318" y="359.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Inspect grants.</text>
  <rect fill="#E8F5EE" stroke="#16745C" stroke-width="1" x="540" y="245" width="210" height="135" rx="14" />
  <text x="558" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16745C" text-anchor="start">3  Understand</text>
  <text x="558" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Read intent and code.</text>
  <text x="558" y="336.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Inspect assertions.</text>
  <text x="558" y="359.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Read retained reports.</text>
  <rect fill="#E8F5EE" stroke="#16745C" stroke-width="1" x="780" y="245" width="210" height="135" rx="14" />
  <text x="798" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16745C" text-anchor="start">4  Relate</text>
  <text x="798" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Link behavior to code.</text>
  <text x="798" y="336.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Link tests to services.</text>
  <text x="798" y="359.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Attach evidence.</text>
  <rect fill="#E8F5EE" stroke="#16745C" stroke-width="1" x="1020" y="245" width="210" height="135" rx="14" />
  <text x="1038" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16745C" text-anchor="start">5  Analyze</text>
  <text x="1038" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Assess impact.</text>
  <text x="1038" y="336.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Find behavior gaps.</text>
  <text x="1038" y="359.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Compare old and new.</text>
  <polyline points="270,312 300,312" fill="none" stroke="#16745C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow16745C)" />
  <polyline points="510,312 540,312" fill="none" stroke="#16745C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow16745C)" />
  <polyline points="750,312 780,312" fill="none" stroke="#16745C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow16745C)" />
  <polyline points="990,312 1020,312" fill="none" stroke="#16745C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow16745C)" />
  <polygon fill="#FFF4DE" stroke="#9A641B" stroke-width="1" points="1410.0,227 1540,312.0 1410.0,397 1280,312.0" />
  <text x="1410.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#9A641B" text-anchor="middle">Ready for the</text>
  <text x="1410.0" y="307.65" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#9A641B" text-anchor="middle">named next</text>
  <text x="1410.0" y="333.3" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#9A641B" text-anchor="middle">phase?</text>
  <polyline points="1230,312 1280,312" fill="none" stroke="#16745C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow16745C)" />
  <rect fill="#F1ECF8" stroke="#7153A1" stroke-width="1" x="540" y="435" width="690" height="110" rx="14" />
  <text x="558" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7153A1" text-anchor="start">Questions and evidence collection</text>
  <text x="558" y="504.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Resolve material uncertainty through authorized investigations.</text>
  <text x="558" y="526.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Update knowledge, provenance, and the task log after clarification.</text>
  <polyline points="1410,397 1515,397 1515,490 1230,490" fill="none" stroke="#7153A1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow7153A1)" />
  <text x="1360.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7153A1" text-anchor="middle">NEEDS_CLARIFICATION</text>
  <text x="1360.0" y="446.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7153A1" text-anchor="middle">READY_WITH_LIMITS</text>
  <polyline points="645,435 645,380" fill="none" stroke="#7153A1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow7153A1)" />
  <text x="1005.0" y="417.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#526779" text-anchor="middle">Both states permit evidence collection only.</text>
  <text x="60" y="593.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#526779" text-anchor="start">B   EXECUTE → VERIFY → REASSESS</text>
  <rect fill="#EAF2FD" stroke="#2864A8" stroke-width="1" x="1300" y="635" width="240" height="145" rx="14" />
  <text x="1318" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2864A8" text-anchor="start">6  Implement</text>
  <text x="1318" y="704.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Use the owning repository.</text>
  <text x="1318" y="726.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Update canonical cases.</text>
  <rect fill="#EAF2FD" stroke="#2864A8" stroke-width="1" x="990" y="635" width="240" height="145" rx="14" />
  <text x="1008" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2864A8" text-anchor="start">7  Review</text>
  <text x="1008" y="704.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Inspect the base/head diff.</text>
  <text x="1008" y="726.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Check affected</text>
  <text x="1008" y="749.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">consumers.</text>
  <rect fill="#EAF2FD" stroke="#2864A8" stroke-width="1" x="680" y="635" width="240" height="145" rx="14" />
  <text x="698" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2864A8" text-anchor="start">8  Execute cases</text>
  <text x="698" y="704.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Inspect assertions.</text>
  <text x="698" y="726.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Run authorized cases.</text>
  <text x="698" y="749.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Save each case now.</text>
  <rect fill="#EAF2FD" stroke="#2864A8" stroke-width="1" x="370" y="635" width="240" height="145" rx="14" />
  <text x="388" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2864A8" text-anchor="start">9  Compare evidence</text>
  <text x="388" y="704.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Compare intended, old,</text>
  <text x="388" y="726.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">and new outcomes.</text>
  <text x="388" y="749.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Record gaps and limits.</text>
  <rect fill="#EAF2FD" stroke="#2864A8" stroke-width="1" x="60" y="635" width="240" height="145" rx="14" />
  <text x="78" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2864A8" text-anchor="start">10  Scoped handoff</text>
  <text x="78" y="704.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Record findings and limits.</text>
  <text x="78" y="726.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Assess the next stage.</text>
  <polyline points="1300,707 1230,707" fill="none" stroke="#2864A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow2864A8)" />
  <polyline points="990,707 920,707" fill="none" stroke="#2864A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow2864A8)" />
  <polyline points="680,707 610,707" fill="none" stroke="#2864A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow2864A8)" />
  <polyline points="370,707 300,707" fill="none" stroke="#2864A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow2864A8)" />
  <polyline points="1540,312 1563,312 1563,604 1420,604 1420,635" fill="none" stroke="#2864A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow2864A8)" />
  <text x="1430.0" y="577.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2864A8" text-anchor="middle">READY + authorization</text>
  <polyline points="490,780 490,833 1420,833 1420,780" fill="none" stroke="#2864A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow2864A8)" />
  <text x="1247.5" y="853.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2864A8" text-anchor="middle">Implementation defect → revise the change</text>
  <polyline points="610,748 647,748 647,807 800,807 800,780" fill="none" stroke="#9A641B" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow9A641B)" />
  <text x="810.0" y="826.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9A641B" text-anchor="middle">Assertion or execution gap → recheck</text>
  <text x="180.0" y="620.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#526779" text-anchor="middle">Reconciled results + limits</text>
  <polyline points="490,635 490,490 540,490" fill="none" stroke="#7153A1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow7153A1)" />
  <text x="70" y="472.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7153A1" text-anchor="start">Intent gap or missing evidence</text>
  <text x="70" y="494.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7153A1" text-anchor="start">returns to investigation.</text>
  <text x="70" y="517.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7153A1" text-anchor="start">Save results before continuing.</text>
  <text x="60" y="896.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#526779" text-anchor="start">C   KEEP THREE DECISIONS SEPARATE</text>
  <rect fill="#FFF4DE" stroke="#9A641B" stroke-width="1" x="60" y="927" width="460" height="115" rx="14" />
  <text x="78" y="962.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#9A641B" text-anchor="start">Readiness</text>
  <text x="78" y="996.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Agent assessment for a named phase.</text>
  <text x="78" y="1018.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">READY requires evidence and a scope.</text>
  <rect fill="#F1ECF8" stroke="#7153A1" stroke-width="1" x="570" y="927" width="460" height="115" rx="14" />
  <text x="588" y="962.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#7153A1" text-anchor="start">Business and release decisions</text>
  <text x="588" y="996.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Authorized owners retain their decisions.</text>
  <text x="588" y="1018.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Release Clinic supplies evidence analysis.</text>
  <rect fill="#E8F5EE" stroke="#16745C" stroke-width="1" x="1080" y="927" width="460" height="115" rx="14" />
  <text x="1098" y="962.0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#16745C" text-anchor="start">Knowledge publication</text>
  <text x="1098" y="996.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Important requirements and decisions</text>
  <text x="1098" y="1018.95" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">require recorded human review.</text>
  <text x="60" y="1087.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#172A3A" text-anchor="start">Harness maintenance: inspect scope → edit → validate → review the diff → commit. Business intake is not required.</text>
  <polyline points="60,1114 1540,1114" fill="none" stroke="#9AAAB7" stroke-width="1" stroke-linejoin="round" />
  <text x="60" y="1143.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#526779" text-anchor="start">S2 • S3 • S5 • S6  |  This is an agent procedure. The core does not enforce readiness or resume workflows.</text>
  <text x="1540" y="1143.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#526779" text-anchor="end">02 / 04</text>
</svg>