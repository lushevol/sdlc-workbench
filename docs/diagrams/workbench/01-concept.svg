  <text x="60" y="49.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#526779" text-anchor="start">AI SDLC WORKBENCH     /     22 OCTOBER 2026</text>
  <text x="60" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#172A3A" text-anchor="start">Three loops. One evidence foundation.</text>
  <text x="60" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start">Intent defines the goal. Implementation changes the system. Observation tests the claim.</text>
