  <text x="800.0" y="462.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">Shared context and governed knowledge</text>
  <text x="800.0" y="486.3" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">Relationships and retained evidence</text>
  <text x="800.0" y="510.6" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">Shared skills and granted tool execution</text>
