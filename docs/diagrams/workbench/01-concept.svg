  <text x="60" y="941.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#172A3A" text-anchor="start">Agents reason and coordinate.</text>
  <text x="60" y="968.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#172A3A" text-anchor="start">Workbench connects assets</text>
