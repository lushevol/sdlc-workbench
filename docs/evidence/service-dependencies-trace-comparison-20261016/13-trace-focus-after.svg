om:1px solid var(--line);background:#f8fafc}.repository-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}.repository-card{border:1px solid var(--line);border-radius:8px;padding:12px;background:white}.repository-card h3{overflow-wrap:anywhere}.repository-card .counts{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:11px;margin:8px 0}.repository-card button{font-size:10px;padding:4px 7px;margin:2px}.repository-card .limits{font-size:10px;color:#8a5307}.trace-bar{padding:12px 18px;background:#edf4fc;border-bottom:1px solid #cbdcf3}.trace-bar select{max-width:100%;font-size:12px}.trace-bar p{font-size:11px;margin-top:7px}.trace-bar .breaks{color:#865510}.node .kind{font-size:9px;font-weight:700;letter-spacing:.4px}.edge .wire{opacity:.85}.edge text{font-size:9px}.lane-title{font-size:11px;fill:var(--muted);font-weight:700;letter-spacing:.5px}.node rect{fill:white;stroke:#cfd9e2;stroke-width:1.2}.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:2}.node text{fill:var(--ink);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}.node .subtext{fill:var(--muted);font-size:9px}.node{cursor:pointer}.edge{cursor:pointer}.edge .hit{stroke:transparent;stroke-width:16;fill:none}.edge .wire{fill:none;stroke-width:1.7;opacity:.7}.edge:hover .wire,.edge.selected .wire{stroke-width:3;opacity:1}.edge text{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round;fill:var(--ink)}.projection-note{padding:10px 18px;font-size:11px;color:var(--muted);background:#f8fafc;border-top:1px solid var(--line)}.empty{padding:55px 30px;text-align:center;color:var(--muted)}.empty h3{color:var(--ink);font-size:16px;margin-bottom:5px}.empty button{margin-top:15px;font-size:12px}.list-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th{text-align:left;padding:10px 12px;background:#f6f8fa;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}td{padding:11px 12px;border-bottom:1px solid #e9eef2;vertical-align:top}td button{border:0;padding:0;text-align:left;background:none;color:var(--accent);font-size:11px}td small{display:block;margin-top:2px}.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;font-size:11px;color:var(--muted)}.pagination button{padding:4px 10px;font-size:11px}.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:2px 6px;border-radius:4px;background:#f0f3f6;color:#425867;white-space:nowrap}.badge.resolved{color:#066052;background:#e5f3ee}.badge.unresolved,.badge.ambiguous{color:#8a5307;background:#fff1d9}.badge.candidate{color:#714096;background:#f1e9f8}.inspector{padding:20px 18px;max-height:100vh;overflow:auto;position:sticky;top:0}.inspector h2{font-size:16px;overflow-wrap:anywhere}.inspector h3{margin:18px 0 6px}.inspector p{font-size:12px;margin-top:7px}.inspector .explanation{padding:10px;background:#f7f9fb;border:1px solid var(--line);border-radius:7px;margin-top:13px}.inspector .row{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;overflow-wrap:anywhere}.inspector .row a{display:block}.inspector button{font-size:11px}.inspector .close{float:right;padding:1px 7px}.inspect-link{display:block;width:100%;text-align:left;padding:8px;margin-top:5px;white-space:normal}.legend{padding:16px 18px;border-top:1px solid var(--line);background:#fafbfc}.boundary-summary{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:7px;background:#f8fafc;font-size:11px}.boundary-summary button{font-size:11px;padding:4px 7px;margin:3px}.index-tabs{display:flex;gap:8px}.property{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 monospace;margin:4px 0}.legend h3{margin-bottom:10px}.legend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.legend h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing: