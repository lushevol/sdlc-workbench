<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1108" width="800" height="1108"><style>
:root{color-scheme:light;--bg:#f3f5f7;--surface:#fff;--ink:#172b3a;--muted:#526675;--line:#dce3e8;--accent:#165bc7;--api:#1764c0;--data:#007c70;--shared:#8051b5;--package:#697383;--structure:#9b6940;--configuration:#a64c68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button,input,select{border:1px solid #c5d0d9;border-radius:7px;padding:8px 10px;background:white;color:var(--ink)}button:hover{background:#edf3fb}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #75adff;outline-offset:2px}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.6px}h2{font-size:17px}h3{font-size:13px}small,.muted{color:var(--muted)}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.masthead{padding:20px 26px 16px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.masthead p{font-size:12px;margin-top:3px}.snapshot{text-align:right;font-size:11px;color:var(--muted)}.snapshot strong{display:block;color:var(--ink);font-size:12px}.priority{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px 24px;background:#edf1f5;border-bottom:1px solid var(--line)}.level{text-align:left;padding:12px 16px;border:1px solid #d3dce5;background:#f9fbfd;position:relative}.level strong{display:block;font-size:15px;margin:2px 0}.level small{font-size:11px}.level[aria-pressed=true]{border-color:var(--accent);background:#fff;box-shadow:inset 4px 0 var(--accent)}.level[aria-pressed=true] .eyebrow{color:var(--accent)}
.workspace{display:grid;grid-template-columns:238px minmax(460px,1fr) 310px;align-items:start;min-height:calc(100vh - 216px)}.filters{padding:20px 18px;position:sticky;top:0;max-height:100vh;overflow:auto}.filters h2{font-size:14px;margin-bottom:13px}.field{display:block;margin:15px 0}.field>span,legend{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;min-width:0;font-size:12px}fieldset{border:0;padding:0;margin:18px 0}.check{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px;cursor:pointer}.check input{accent-color:var(--accent);width:15px;height:15px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--swatch)}.check .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:10px}.filters .note{font-size:11px;color:var(--muted);margin-top:10px}.reset{width:100%;font-size:12px}.center{border-left:1px solid var(--line);border-right:1px solid var(--line);min-width:0;background:white;min-height:calc(100vh - 216px)}.view-header{padding:19px 22px 14px;border-bottom:1px solid var(--line)}.view-header>p{font-size:12px;color:var(--muted);margin-top:5px;max-width:740px}.stats{display:flex;gap:20px;margin-top:13px;font-size:11px;color:var(--muted)}.stats strong{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;padding-right:4px}.toolbar{display:flex;gap:7px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:11px}.toolbar button{padding:5px 10px;font-size:11px}.toolbar [aria-pressed=true]{background:#eaf1fc;border-color:#87a9d7;color:var(--accent)}.toolbar label{margin-left:auto}.toolbar select{padding:5px;font-size:11px}.graph-wrap{overflow:auto;max-height:68vh;min-height:370px;background:radial-gradient(#dfe6ee .65px,transparent .65px);background-size:18px 18px}.diagram{display:block;width:100%;min-width:660px}.lane-title{font-size:11px;fill:var(--muted);font-weight:700;letter-spacing:.5px}.node rect{fill:white;stroke:#cfd9e2;stroke-width:1.2}.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:2}.node text{fill:var(--ink);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}.node .subtext{fill:var(--muted);font-size:9px}.node{cursor:pointer}.edge{cursor:pointer}.edge .hit{stroke:transparent;stroke-width:16;fill:none}.edge .wire{fill:none;stroke-width:1.7;opacity:.7}.edge:hover .wire,.edge.selected .wire{stroke-width:3;opacity:1}.edge text{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round;fill:var(--ink)}.projection-note{padding:10px 18px;font-size:11px;color:var(--muted);background:#f8fafc;border-top:1px solid var(--line)}.empty{padding:55px 30px;text-align:center;color:var(--muted)}.empty h3{color:var(--ink);font-size:16px;margin-bottom:5px}.empty button{margin-top:15px;font-size:12px}.list-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th{text-align:left;padding:10px 12px;background:#f6f8fa;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}td{padding:11px 12px;border-bottom:1px solid #e9eef2;vertical-align:top}td button{border:0;padding:0;text-align:left;background:none;color:var(--accent);font-size:11px}td small{display:block;margin-top:2px}.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;font-size:11px;color:var(--muted)}.pagination button{padding:4px 10px;font-size:11px}.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:2px 6px;border-radius:4px;background:#f0f3f6;color:#425867;white-space:nowrap}.badge.resolved{color:#066052;background:#e5f3ee}.badge.unresolved,.badge.ambiguous{color:#8a5307;background:#fff1d9}.badge.candidate{color:#714096;background:#f1e9f8}.inspector{padding:20px 18px;max-height:100vh;overflow:auto;position:sticky;top:0}.inspector h2{font-size:16px;overflow-wrap:anywhere}.inspector h3{margin:18px 0 6px}.inspector p{font-size:12px;margin-top:7px}.inspector .explanation{padding:10px;background:#f7f9fb;border:1px solid var(--line);border-radius:7px;margin-top:13px}.inspector .row{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;overflow-wrap:anywhere}.inspector .row a{display:block}.inspector button{font-size:11px}.inspector .close{float:right;padding:1px 7px}.inspect-link{display:block;width:100%;text-align:left;padding:8px;margin-top:5px;white-space:normal}.legend{padding:16px 18px;border-top:1px solid var(--line);background:#fafbfc}.boundary-summary{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:7px;background:#f8fafc;font-size:11px}.boundary-summary button{font-size:11px;padding:4px 7px;margin:3px}.index-tabs{display:flex;gap:8px}.property{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 monospace;margin:4px 0}.legend h3{margin-bottom:10px}.legend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.legend h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:0 0 7px}.legend p{font-size:10px;display:flex;align-items:center;gap:7px;margin:4px 0}.legend .sample{display:inline-block;width:26px;border-top:2px solid var(--api);flex:none}.legend .sample.dashed{border-top-style:dashed;border-color:#936b31}.legend .sample.dotted{border-top-style:dotted;border-color:#8051b5}.legend .sample.declared{border-color:#697383}.legend details{font-size:11px;margin-top:11px}.legend details p{display:block;max-width:800px}.status-help{font-size:11px;line-height:1.6}.status-help dt{font-weight:700;margin-top:8px}.status-help dd{margin:0;color:var(--muted)}[hidden]{display:none!important}
@media(min-width:1600px){.workspace{grid-template-columns:255px minmax(460px,1fr) 340px}}@media(max-width:1180px){.workspace{grid-template-columns:210px minmax(450px,1fr)}.inspector{grid-column:2;position:static;max-height:none;border-top:1px solid var(--line);background:white}.center{border-right:0}}@media(max-width:720px){.masthead{padding:16px}.snapshot{display:none}.priority{padding:10px;gap:6px}.level{padding:9px}.level strong{font-size:12px}.level small{display:none}.workspace{display:block}.filters{position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.filters h2,.filters fieldset,.filters .note,.filters .reset{grid-column:1/-1}.filters fieldset{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.filters .check{margin:0}.filters .field{margin:6px 0}.center{border-left:0}.legend-grid{grid-template-columns:1fr 1fr}.stats{gap:12px}.inspector{position:static}.view-header{padding:16px}.graph-wrap{max-height:65vh}}

text{font-family:Arial,sans-serif}</style><rect width="100%" height="100%" fill="white"/><title id="diagram-title">Interfaces, data &amp; shared code</title><desc id="diagram-description">Cards group nodes by role. Directed lines show relationships. Select a card or line for source evidence. Use the relationship list for keyboard navigation.</desc><defs><marker id="arrow-api" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1764c0"/></marker><marker id="arrow-data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#007c70"/></marker><marker id="arrow-shared" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8051b5"/></marker><marker id="arrow-configuration" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a64c68"/></marker><marker id="arrow-package" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#697383"/></marker><marker id="arrow-structure" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9b6940"/></marker><marker id="arrow-other" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#667d8d"/></marker></defs><rect x="22" y="13" width="726" height="1079" rx="9" fill="#f5f8fb" fill-opacity=".8"/><text class="lane-title" x="36" y="38">INTERFACES / DATA / PROVIDERS · 12</text><g class="edge" data-edge="edge:0fed1a444a24074d49b8c039"><title>ApplicationTile → com.scb.sso.singleuibff.entity.ApplicationTile: Maps entity to table · Unresolved</title><path class="hit" d="M496,98 C534,98 534,266 496,266"/><path class="wire" d="M496,98 C534,98 534,266 496,266" stroke="#007c70" stroke-dasharray="6 5" marker-end="url(#arrow-data)"/><text x="534" y="182" text-anchor="middle">Maps entity to table</text></g><g class="edge" data-edge="edge:b5d0e