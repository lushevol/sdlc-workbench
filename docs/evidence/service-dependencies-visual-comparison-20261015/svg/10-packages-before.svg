-size:16px;overflow-wrap:anywhere}.inspector h3{margin:18px 0 6px}.inspector p{font-size:12px;margin-top:7px}.inspector .explanation{padding:10px;background:#f7f9fb;border:1px solid var(--line);border-radius:7px;margin-top:13px}.inspector .row{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;overflow-wrap:anywhere}.inspector .row a{display:block}.inspector button{font-size:11px}.inspector .close{float:right;padding:1px 7px}.inspect-link{display:block;width:100%;text-align:left;padding:8px;margin-top:5px;white-space:normal}.legend{padding:16px 18px;border-top:1px solid var(--line);background:#fafbfc}.legend h3{margin-bottom:10px}.legend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.legend h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:0 0 7px}.legend p{font-size:10px;display:flex;align-items:center;gap:7px;margin:4px 0}.legend .sample{display:inline-block;width:26px;border-top:2px solid var(--api);flex:none}.legend .sample.dashed{border-top-style:dashed;border-color:#936b31}.legend .sample.dotted{border-top-style:dotted;border-color:#8051b5}.legend .sample.declared{border-color:#697383}.legend details{font-size:11px;margin-top:11px}.legend details p{display:block;max-width:800px}.status-help{font-size:11px;line-height:1.6}.status-help dt{font-weight:700;margin-top:8px}.status-help dd{margin:0;color:var(--muted)}[hidden]{display:none!important}
