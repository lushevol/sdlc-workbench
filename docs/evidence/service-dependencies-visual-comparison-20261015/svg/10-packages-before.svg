:root{color-scheme:light;--bg:#f3f5f7;--surface:#fff;--ink:#172b3a;--muted:#526675;--line:#dce3e8;--accent:#165bc7;--api:#1764c0;--data:#007c70;--shared:#8051b5;--package:#697383;--structure:#9b6940}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button,input,select{border:1px solid #c5d0d9;border-radius:7px;padding:8px 10px;background:white;color:var(--ink)}button:hover{background:#edf3fb}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #75adff;outline-offset:2px}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.6px}h2{font-size:17px}h3{font-size:13px}small,.muted{color:var(--muted)}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.masthead{padding:20px 26px 16px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.masthead p{font-size:12px;margin-top:3px}.snapshot{text-align:right;font-size:11px;color:var(--muted)}.snapshot strong{display:block;color:var(--ink);font-size:12px}.priority{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px 24px;background:#edf1f5;border-bottom:1px solid var(--line)}.level{text-align:left;padding:12px 16px;border:1px solid #d3dce5;background:#f9fbfd;position:relative}.level strong{display:block;font-size:15px;margin:2px 0}.level small{font-size:11px}.level[aria-pressed=true]{border-color:var(--accent);background:#fff;box-shadow:inset 4px 0 var(--accent)}.level[aria-pressed=true] .eyebrow{color:var(--accent)}
.workspace{display:grid;grid-template-columns:238px minmax(460px,1fr) 310px;align-items:start;min-height:calc(100vh - 216px)}.filters{padding:20px 18px;position:sticky;top:0;max-height:100vh;overflow:auto}.filters h2{font-size:14px;margin-bottom:13px}.field{display:block;margin:15px 0}.field>span,legend{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;min-width:0;font-size:12px}fieldset{border:0;padding:0;margin:18px 0}.check{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px;cursor:pointer}.check input{accent-color:var(--accent);width:15px;height:15px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--swatch)}.check .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:10px}.filters .note{font-size:11px;color:var(--muted);margin-top:10px}.reset{width:100%;font-size:12px}.center{border-left:1px solid var(--line);border-right:1px solid var(--line);min-width:0;background:white;min-height:calc(100vh - 216px)}.view-header{padding:19px 22px 14px;border-bottom:1px solid var(--line)}.view-header>p{font-size:12px;color:var(--muted);margin-top:5px;max-width:740px}.stats{display:flex;gap:20px;margin-top:13px;font-size:11px;color:var(--muted)}.stats strong{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;padding-right:4px}.toolbar{display:flex;gap:7px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:11px}.toolbar button{padding:5px 10px;font-size:11px}.toolbar [aria-pressed=true]{background:#eaf1fc;border-color:#87a9d7;color:var(--accent)}.toolbar label{margin-left:auto}.toolbar select{padding:5px;font-size:11px}.graph-wrap{overflow:auto;max-height:68vh;min-height:370px;background:radial-gradient(#dfe6ee .65px,transparent .65px);background-size:18px 18px}.diagram{display:block;width:100%;min-width:660px}.lane-title{font-size:11px;fill:var(--muted);font-