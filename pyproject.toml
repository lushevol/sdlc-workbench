[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-workbench"
version = "0.1.0"
description = "Agent-independent SDLC context, relationships, and executable capabilities"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
ai-sdlc = "ai_sdlc_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_sdlc_workbench = ["schemas/*.json", "skills/*.md", "static/*.html"]
