[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-workbench"
version = "0.1.0"
description = "Agent-independent SDLC context, relationships, and executable capabilities"
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.2",
    "tree-sitter==0.25.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-typescript==0.23.2",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
release-clinic = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "atlassian-python-api>=3.41.0",
    "python-sonarqube-api>=2.0.4",
    "cryptography>=42.0.0",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
]

[project.scripts]
ai-sdlc = "ai_sdlc_workbench.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["ai_sdlc_workbench", "ai_sdlc_workbench.context", "ai_sdlc_workbench.governance", "ai_sdlc_workbench.ingestion", "ai_sdlc_workbench.providers", "ai_sdlc_workbench.relationships"]
package-dir = {ai_sdlc_workbench = "core"}

[tool.setuptools.package-data]
ai_sdlc_workbench = ["schemas/*.json", "skills/*.md"]
