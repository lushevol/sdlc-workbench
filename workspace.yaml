schema_version: 1
id: ai-sdlc-workbench
name: AI SDLC Workbench
timeout_seconds: 30
settings:
  auto_commit_staged_changes: true
  commit_message_style: plain
  commit_granularity: per_stage
  branch_prefix: feature/
  ponytail_mode: full
  report_verbosity: standard
plugins: []
resources: []
registries:
  repositories: registry/repositories.yaml
  services: registry/services.yaml
  capabilities: registry/capabilities.yaml
  contracts: registry/contracts.yaml
  sources: registry/sources.yaml
  tools: registry/tools.yaml
