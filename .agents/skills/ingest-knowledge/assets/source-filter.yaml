schema_version: 1
policy_id: intended-system-behavior
version: 1
default_decision: NEEDS_REVIEW
keep_topics:
  - Purpose, users, supported capabilities, business outcomes, and explicit system exclusions.
  - Domain terms, entities, identity meanings, relationships, states, and data lifecycle rules.
  - Actor and system workflows, triggers, preconditions, outcomes, and exceptional paths.
  - Business validation, eligibility, calculations, precedence, limits, and decision rules.
  - Authentication, permissions, sessions, tenant isolation, and denial behavior.
  - Requests, responses, events, defaults, errors, compatibility, and integration obligations.
  - Intended component responsibilities, trust boundaries, dependencies, and ownership of rules.
  - Retry, timeout, rollback, duplicate handling, recovery, and continuity requirements.
  - Measurable quality constraints and behavior-relevant design decisions with their rationale.
evidence_only:
  - Actual implementation, configuration dumps, populated fixtures, and code listings without sourced intent.
  - Deployment identities, rollout status, host inventories, and environment observations.
  - Test results, measured performance, incident observations, scan findings, and reported remediation.
exclude_patterns:
  - Generic framework or vendor comparisons without an applicable system decision or behavioral constraint.
  - Installation commands and tool tutorials without intended system responsibilities or interface semantics.
  - Release calendars, staffing rosters, contact lists, and progress trackers without a relevant system rule.
  - Unfilled templates, navigation-only pages, empty export blocks, and duplicate content without distinct provenance value.
principles:
  - These patterns guide semantic source review. They are not executable filename or keyword exclusion rules.
  - Read complete source context before selecting sections. Preserve definitions, conditions, exceptions, units, and field types.
  - Preserve historical and proposed intent with its actual status. Missing authority does not establish approval.
  - A source can contain relevant intent and unrelated material. Select exact physical line ranges where possible.
  - Keep original source identity, revision, SHA-256, and snapshot with every selection and generated source link.
  - Reassess new or changed pages, including previously excluded pages. Bind decisions to policy and context hashes.
  - Route unresolved meaning to HOLD. Preserve contradictory claims without selecting whichever the code implements.
  - Exclusion from the intent input never authorizes deletion of raw input, retained evidence, or canonical knowledge.
  - Keep filtered views rebuildable. Generate exact excerpts or links instead of copying complete source trees.
