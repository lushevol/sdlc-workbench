interface:
  display_name: "Release Confidence"
  short_description: "Judge PROD readiness, business impact, and system impact"
  default_prompt: "Use $release-confidence to assess this release candidate. Report business impact, system impact, evidence_confidence_score, confidence level, production recommendation, release_status (GO, CONDITIONAL, NO_GO, or BLOCKED), can_go, blockers, and prioritized confidence-increasing actions with owners and closure evidence. Keep human authorization separate."
