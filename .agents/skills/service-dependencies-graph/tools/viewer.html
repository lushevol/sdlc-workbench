.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px}.graph-pane{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);border-right:1px solid var(--line)}.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:7px 12px;background:#f8fafb;border-bottom:1px solid var(--line)}.filters input{width:min(290px,28vw);font-size:12px}.filters select{font-size:11px;padding:6px 7px}.filters .hint{margin-left:auto;font-size:11px;color:var(--muted)}.overview{background:var(--surface);border-bottom:1px solid var(--line);padding:7px 12px}.overview summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;list-style:none}.overview summary::-webkit-details-marker{display:none}.overview summary:before{content:"▸";color:var(--accent)}.overview[open] summary:before{content:"▾"}.repo-list{display:flex;gap:6px;overflow-x:auto;padding-top:7px}.repo-chip{min-width:150px;text-align:left;padding:7px 9px;font-size:11px}.repo-chip strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.repo-chip span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.canvas{position:relative;min-height:0;overflow:hidden;background-color:#fbfcfd;background-image:radial-gradient(#dce5ec .7px,transparent .7px);background-size:18px 18px}.canvas svg{display:block;width:100%;height:100%}.node{cursor:pointer}.node rect{fill:#fff;stroke:#cbd7df;stroke-width:1.2}.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:2}.node .kind{font-size:9px;font-weight:750;letter-spacing:.35px}.node text{pointer-events:none}.node .name{font-size:12px;fill:var(--ink)}.node .hint{font-size:10px;fill:var(--muted)}.node .expand{font-size:14px;font-weight:700;fill:var(--accent)}.edge{cursor:pointer}.edge .wire{fill:none;stroke-width:1.7;opacity:.72}.edge:hover .wire,.edge.selected .wire{stroke-width:3;opacity:1}.edge text{pointer-events:none;font-size:10px;fill:var(--muted);paint-order:st l:var(--muted);font-size:13px}
@media(max-width:880px){.main{grid-template-columns:minmax(0,1fr) 270px}.summary{display:none}.brand h1{font-size:14px}.filters .hint{display:none}}@media(max-width:650px){body{overflow:auto}.app{height:auto;min-height:100%}.main{display:block}.graph-pane{height:calc(100vh - 54px);border-right:0}.inspector{border-top:1px solid var(--line);min-height:220px}.top-actions button{font-size:0}.top-actions button:before{font-size:13px}.top-actions .primary:before{content:"＋"}.top-actions button:last-child:before{content:"⌗"}}
.advanced{position:relative;font-size:11px}.advanced summary{cursor:pointer}.advanced-options{max-height:70vh;overflow:auto;position:absolute;z-index:3;top:24px;right:0;min-width:250px;padding:12px;background:white;border:1px solid var(--line);border-radius:6px;box-shadow:0 5px 15px #152a4020}.advanced-options label{display:block;margin:7px 0}.advanced-options select{display:block;width:100%;margin-top:3px}.index-item{display:block;text-align:left;width:100%;font-size:11px;margin-top:5px;overflow-wrap:anywhere}.index-item small{display:block;color:var(--muted);font-size:10px}.index-navigation{display:flex;justify-content:space-between;align-items:center;font-size:10px;margin-top:8px}.index-navigation button{font-size:10px}#index-kind{margin-top:8px;width:100%;font-size:11px}#trace-summary{font-size:11px;margin-top:10px}.topbar h1{white-space:nowrap}

<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Service dependency graph</h1></div>
    <div id="summary" class="summary" aria-live="polite"></div>
    <div class="top-actions"><button id="fit" class="primary">Fit graph</button><button id="collapse">Collapse all</button></div>
  </header>
  <div id="error" class="error" role="alert" hidden></div>
  <main id="main" class="main">
    <section class="graph-pane" aria-label="Dependency graph">
      <div class="filters"><input id="search" type="search" placeholder="Search services or relationships" aria-label="Search services or relationships"><select id="scope" aria-label="Repository"><option value="all">All repositories</option></select><select id="status" aria-label="Provider status"><option value="all">All statuses</option><option value="resolved">Resolved</option><option value="declared">Declared</option><option value="unresolved">Unresolved</option><option value="ambiguous">Ambiguous</option><option value="candidate">Candidate</option></select><select id="family" aria-label="Relationship family"><option value="all">All relationship types</option><option value="api">API calls</option><option value="data">Data flow</option><option value="shared">Shared code</option><option value="configuration">Configuration</option><option value="package">Packages</option><option value="structure">Ownership</option><option value="other">Other</option></select><button id="reset" title="Reset filters">Reset</button><details class="advanced"><summary>Filters</summary><div class="advanced-options"><label>Scope <select id="dependency-scope"><option value="all">Production and testing</option><option value="PRODUCTION">Production</option><option value="TESTING">Testing</option></select></label><label>Dimension <select id="dimension"><option value="all">Runtime and business</option><option value="RUNTIME">Runtime</option><option value="BUSINESS">Business</option></select></label><label>Repository details <select id="repository-view"><option value="all">All details</option><option value="provided">Provided APIs</option><option value="outbound">Outbound calls</option><option value="messages">Messages</option><option value="storage">Storage</option><option value="configuration">Configuration</option><option value="components">Components</option></select></label><label>Boundary <select id="boundary"><option value="all">All boundaries</option><option value="cross">Between repositories</option><option value="internal">Within repository</option><option value="external">External / unknown</option></select></label><label>Relationship <select id="relationship"><option value="all">All relationships</option></select></label><label>Origin <select id="origin"><option value="all">Extraction and investigation</option><option value="EXTRACTED">Extraction</option><option value="INVESTIGATED">Investigation</option></select></label><label>Assessment <select id="assessment"><option value="all">All evidence</option><option value="SUPPORTED">Supported</option><option value="INFERRED">Inferred</option><option value="CONFLICTED">Conflicted</option><option value="UNVERIFIED">Unverified</option><option value="OUT_OF_SCOPE">Out of scope</option><option value="EXTRACTED">Extracted</option></select></label></div></details><span id="hint" class="hint">Click to expand · wheel to zoom · drag to pan</span></div>
      <details id="overview" class="overview"><summary>Architecture overview <span id="overview-count" class="muted"></span></summary><div id="repo-list" class="repo-list"></div></details>
      <div id="canvas" class="canvas"><svg id="graph" role="img" aria-label="Directed service dependency graph"></svg><div id="canvas-status" class="footer" aria-live="polite"></div></div>
    </section>
    <aside class="inspector" aria-label="Selection inspector"><div class="inspector-head"><h2>Inspector</h2><span id="loading" class="loading" hidden>Loading…</span></div><div id="selection" class="selection"><p class="muted">Select a repository, service, or relationship.</p></div><div id="trace-summary"></div><details id="index-panel"><summary>Browse all declarations</summary><select id="index-kind" aria-label="Declaration index"><option value="nodes">Nodes</option><option value="edges">Relationships</option></select><div id="index-rows"></div><div class="index-navigation"><button id="index-previous">Previous</button><span id="index-page"></span><button id="index-next">Next</button></div></details><details id="legend"><summary>Legend</summary><div class="legend-row"><span class="swatch"></span>API calls</div><div class="legend-row"><span class="swatch data"></span>Data flow</div><div class="legend-row"><span class="swatch shared"></span>Shared code</div><div class="legend-row"><span class="swatch unresolved"></span>Unresolved or ambiguous</div></details><details id="context-panel" hidden><summary>Architecture evidence</summary><div id="context-content"></div></details></aside>
  </main>
</div>
<script id="bootstrap-data" type="application/json">__BOOTSTRAP__</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let bootstrap;
try { bootstrap = JSON.parse($('bootstrap-data').textContent); }
catch (error) {
  $('error').hidden = false;
  $('error').textContent = 'Open the generated relationship-viewer.html. If its data is invalid, regenerate the graph.';
  $('main').hidden = true;
  throw new Error('Invalid graph data: bootstrap');
}
const repositories = new Map(bootstrap.repositories.map(row => [row.id,row]));
const nodes = new Map(bootstrap.nodes.map(row => [row.id,row]));
const edges = new Map(), branches = new Map(), expanded = new Set(), parents = new Map();
const rootIds = new Set(Object.values(bootstrap.roots));
const overviewEdges = new Map(bootstrap.links.map(row => [row.id,{...row,overview:true}]));
const cache = new Map(), pending = new Map(), busyNodes = new Set();
const colors = {api:'#1764c0',data:'#007c70',shared:'#8051b5',configuration:'#a64c68',package:'#697383',structure:'#9b6940',other:'#667d8d'};
const statusNames = {resolved:'Resolved',declared:'Declared only',unresolved:'Unresolved',ambiguous:'Ambiguous',candidate:'Candidate'};
const assessmentNames = {SUPPORTED:'Source supported',INFERRED:'Inferred',CONFLICTED:'Conflicted',UNVERIFIED:'Unverified',OUT_OF_SCOPE:'Out of scope',EXTRACTED:'Extracted'};
const statusHelp = {resolved:'Consumer and provider evidence matched. Deployment and execution remain unverified.',declared:'A source declaration exists without a separate provider match.',unresolved:'The provider could not be matched. This does not mean the dependency is broken.',ambiguous:'Several providers match. None has been selected.',candidate:'This relationship is inferred. Inspect its source before relying on it.'};
let selected = null, selectionVersion = 0, fitNext = true, graphBounds = [0,0,900,500], viewport = null;
let indexPage = 0, indexKind = 'nodes', indexGeneration = 0, trace = null;
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function name(id) { return nodes.get(id)?.label || nodes.get(id)?.name || id; }
function repoName(id) { return repositories.get(id)?.name || 'External / unknown'; }
function tag(status) { return `<span class="tag ${esc(status)}">${esc(statusNames[status]||assessmentNames[status]||status)}</span>`; }
function sourceLink(path) {
  const result = bootstrap.source_prefix + String(path).split('/').map(encodeURIComponent).join('/');
  return /^(?:javascript|data|vbscript):/i.test(result.trim()) ? '#' : result;
}
function showError(error) { $('error').hidden=false; $('error').textContent=error.message+' · Keep the HTML beside its .data folder, then retry.'; }
function run(action) { Promise.resolve().then(action).catch(showError); }
function busy() { $('loading').hidden=pending.size===0; }
window.serviceGraphChunk = async (key, encoded) => {
  const request = pending.get(key);
  if (!request) return;
  try {
    if (!globalThis.DecompressionStream) throw new Error('This viewer requires a browser with gzip DecompressionStream support');
    const bytes = Uint8Array.from(atob(encoded), letter=>letter.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const value = JSON.parse(await new Response(stream).text());
    cache.set(key,value);
    while(cache.size>8) cache.delete(cache.keys().next().value);
    request.resolve(value);
  } catch(error) { request.reject(error); }
  finally { clearTimeout(request.timer); request.script.remove(); pending.delete(key); busy(); }
};
function loadChunk(key) {
  if(typeof key!=='string')return Promise.reject(new Error('Invalid graph chunk identity'));
  let hash=2166136261;
  for(let index=0;index<key.length;index++)hash=Math.imul(hash^key.charCodeAt(index),16777619)>>>0;
  const bucket='bucket-'+(hash%512).toString(16).padStart(3,'0');
  return loadBucket(bucket).then(rows=>{
    if(!Object.hasOwn(rows,key))throw new Error('Graph data is missing '+key);
    return rows[key];
  });
}
function loadBucket(key) {
  if (!key || !/^[a-zA-Z0-9-]+$/.test(key)) return Promise.reject(new Error('Invalid graph chunk identity'));
  if (cache.has(key)) { const value=cache.get(key); cache.delete(key); cache.set(key,value); return Promise.resolve(value); }
  if (pending.has(key)) return pending.get(key).promise;
  const script=document.createElement('script'); script.src=bootstrap.data_dir+key+'.js'; script.async=true;
  let resolve,reject;
  const promise = new Promise((yes,no)=>{resolve=yes;reject=no;});
  const fail=error=>{clearTimeout(pending.get(key)?.timer);pending.delete(key);script.remove();busy();reject(error);};
  const timer=setTimeout(()=>fail(new Error('Timed out loading graph data')),15000);
  script.onerror=()=>fail(new Error('Could not load '+key));
  pending.set(key,{promise,resolve,reject,script,timer}); busy(); document.head.appendChild(script); return promise;
}
function merge(data) {
  for(const item of data.nodes||[]) nodes.set(item.id,item);
  for(const item of data.edges||[]) edges.set(item.id,item);
}
async function loadPage(id) {
  const item=nodes.get(id)||overviewEdges.get(id);
  if(!item || busyNodes.has(id)) return;
  const branch=branches.get(id)||{pages:0,nodes:new Set(),edges:new Set()};
  if(branch.pages>=item.pages) return;
  busyNodes.add(id);
  try {
    const data=await loadChunk(item.key+'-'+branch.pages); merge(data);
    const nodeRefs=data.node_refs||[],edgeRefs=data.edge_refs||[];
    const missingNodes=new Set(nodeRefs.filter(row=>!nodes.has(row.id)).map(row=>row.id));
    const missingEdges=new Set(edgeRefs.filter(row=>!edges.has(row.id)).map(row=>row.id));
    const keys=new Set([...nodeRefs.filter(row=>missingNodes.has(row.id)),...edgeRefs.filter(row=>missingEdges.has(row.id))].map(row=>row.chunk));
    const batches=await Promise.all([...keys].map(loadChunk));
    for(const rows of batches)for(const row of rows){if(missingNodes.has(row.id))nodes.set(row.id,row);if(missingEdges.has(row.id))edges.set(row.id,row);}
    if([...missingNodes].some(key=>!nodes.has(key))||[...missingEdges].some(key=>!edges.has(key)))throw new Error('Incomplete graph neighborhood');
    for(const node of data.nodes||[]) branch.nodes.add(node.id);
    for(const ref of nodeRefs)branch.nodes.add(ref.id);
    for(const edge of data.edges||[]) branch.edges.add(edge.id);
    for(const ref of edgeRefs)branch.edges.add(ref.id);
    branch.pages++; branches.set(id,branch);
  } finally { busyNodes.delete(id); }
}
async function expand(id, parent=null) {
  if(busyNodes.has(id)) return;
  expanded.add(id);
  if(!rootIds.has(id) && !parents.has(id)) { const owner=nodes.get(id)?.parent||parent; if(owner&&owner!==id)parents.set(id,owner); }
  try { if(!branches.has(id)) await loadPage(id); }
  catch(error) { expanded.delete(id); throw error; }
  if(expanded.has(id)) { selected={kind:'node',id}; await renderInspector(); }
  fitNext=rootIds.has(id); draw();
  if(!rootIds.has(id)){const p=positions.get(id);if(p)setViewport([Math.max(0,p.x-80),Math.max(0,p.y-60),1200,700]);}
}
function collapse(id) {
  const remove=new Set([id]);
  for(let changed=true;changed;) { changed=false; for(const [child,parent] of parents) if(remove.has(parent)&&!remove.has(child)) {remove.add(child);changed=true;} }
  for(const child of remove) {expanded.delete(child);parents.delete(child);}
  if(selected && remove.has(selected.id)) selected=null;
  draw();run(renderInspector);
}
function filterNode(node) {
  const query=$('search').value.trim().toLowerCase(), rid=$('scope').value;
  if(rid!=='all'&&node.repository!==rid) return false;
  if($('dependency-scope').value!=='all'&&node.dependency_scope!==$('dependency-scope').value) return false;
  return !query||[node.name,node.label,node.id,node.type,node.search,repoName(node.repository)].join(' ').toLowerCase().includes(query);
}
function boundaryOf(edge) {
  const a=nodes.get(edge.source)?.repository,b=nodes.get(edge.target)?.repository;
  return a&&b?(a===b?'internal':'cross'):'external';
}
function sliceEdge(edge) {
  const slice=$('repository-view').value;
  if(slice==='all'||edge.overview||edge.navigation)return true;
  if(slice==='provided')return ['EXPOSES','INVOKES'].includes(edge.relationship);
  if(slice==='outbound')return edge.family==='api'&&!['EXPOSES','INVOKES'].includes(edge.relationship);
  if(slice==='messages')return ['PUBLISHES','CONSUMES','CONFIGURES_TOPIC'].includes(edge.relationship);
  if(slice==='storage')return edge.family==='data'&&!['PUBLISHES','CONSUMES'].includes(edge.relationship);
  if(slice==='configuration')return edge.family==='configuration';
  return ['shared','structure'].includes(edge.family)||['INVOKES','MAPS_TO_TABLE','USES_ENTITY'].includes(edge.relationship);
}
function filterEdge(edge) {
  const a=nodes.get(edge.source), b=nodes.get(edge.target), rid=$('scope').value;
  if(rid!=='all'&&a?.repository!==rid&&b?.repository!==rid) return false;
  if($('dependency-scope').value!=='all'&&(edge.dependency_scope||'PRODUCTION')!==$('dependency-scope').value) return false;
  if(!sliceEdge(edge))return false;
  if($('boundary').value!=='all'&&boundaryOf(edge)!==$('boundary').value)return false;
  if($('relationship').value!=='all'&&!(edge.relationships||[edge.relationship]).includes($('relationship').value))return false;
  if($('origin').value!=='all'&&!edge.navigation&&(edge.origin||'EXTRACTED')!==$('origin').value)return false;
  if($('status').value!=='all'&&edge.status!==$('status').value) return false;
  if($('family').value!=='all'&&edge.family!==$('family').value) return false;
  if($('dimension').value!=='all' && !edge.overview && !edge.navigation && edge.dimension!==$('dimension').value) return false;
  if($('assessment').value!=='all'&&!(edge.assessments?.length?edge.assessments:['EXTRACTED']).includes($('assessment').value)) return false;
  const query=$('search').value.trim().toLowerCase();
  return !query||[edge.label,edge.relationship,name(edge.source),name(edge.target),a?.search,b?.search].join(' ').toLowerCase().includes(query);
}
function projection() {
  const visibleNodes=new Set(rootIds), visibleEdges=new Map(overviewEdges);
  for(const id of expanded) {
    visibleNodes.add(id);
    const branch=branches.get(id); if(!branch) continue;
    for(const nodeId of branch.nodes) visibleNodes.add(nodeId);
    for(const edgeId of branch.edges) if(edges.has(edgeId)) visibleEdges.set(edgeId,edges.get(edgeId));
  }
  const resultEdges=[...visibleEdges.values()].filter(filterEdge);
  const endpointIds=new Set(resultEdges.flatMap(edge=>[edge.source,edge.target]));
  return {nodes:[...visibleNodes].map(id=>nodes.get(id)).filter(Boolean).filter(node=>filterNode(node)||endpointIds.has(node.id)),edges:resultEdges};
}
function wrap(text,width=25) {
  const parts=[];let value=String(text);
  while(value.length>width){let cut=value.lastIndexOf(' ',width);if(cut<8)cut=width;parts.push(value.slice(0,cut));value=value.slice(cut).trim();}
  if(value)parts.push(value);return parts;
}
const positions=new Map();
function layout(visibleNodes) {
  // Keep existing cards fixed while neighborhoods are appended to their repository group.
  const rootOrder=bootstrap.nodes.map(node=>node.id),cardW=202,cardH=76,colW=268,rowH=100;
  const roots=visibleNodes.filter(node=>rootIds.has(node.id));
  const columns=Math.max(1,Math.min(3,Math.ceil(Math.sqrt(roots.length))));

  const detailLeft=32+columns*colW;
  for(const node of detailNodes) if(!positions.has(node.id)) {
    const used=[...positions.keys()].filter(id=>!rootIds.has(id)).length;
    positions.set(node.id,{x:detailLeft+Math.floor(used/5)*colW,y:40+(used%5)*rowH,w:cardW,h:cardH});

let paintPending=false;
function setViewport(box) {
  viewport=box;$('graph').setAttribute('viewBox',box.join(' '));

    paintPending=true;requestAnimationFrame(()=>{paintPending=false;draw();});
  }
}
function draw() {

  const ids=new Set(data.nodes.map(node=>node.id));
  const visibleEdges=data.edges.filter(edge=>ids.has(edge.source)&&ids.has(edge.target));
  let html='<title>Service dependency graph</title><desc>Expand repositories and services in one graph. Use the wheel to zoom and drag the background to pan.</desc><defs>';
  for(const [family,color]of Object.entries(colors))html+=`<marker id="arrow-${family}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="${color}"/></marker>`;
  html+='</defs>';
  const tracks=new Map();
  const [vx,vy,vw,vh]=viewport;
  const inView=box=>box.x+box.w>=vx-100&&box.x<=vx+vw+100&&box.y+box.h>=vy-100&&box.y<=vy+vh+100;
  for(const edge of visibleEdges){
    const a=positions.get(edge.source),b=positions.get(edge.target);if(!a||!b)continue;
    if(!inView({x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x)+Math.max(a.w,b.w)+100,h:Math.abs(a.y-b.y)+Math.max(a.h,b.h)}))continue;
    const same=a.x===b.x, right=b.x>a.x, pair=[edge.source,edge.target].sort().join('|'), track=tracks.get(pair)||0;tracks.set(pair,track+1);
    const ay=a.y+a.h/2,by=b.y+b.h/2,ax=a.x+(same||right?a.w:0),bx=b.x+(same?b.w:right?0:b.w),offset=26+track*10;
    const middle=same?Math.max(ax,bx)+offset:(ax+bx)/2+track*9;
    const path=a===b?`M${ax} ${ay-12} H${middle} V${ay+12} H${bx}`:`M${ax} ${ay} C${middle} ${ay} ${middle} ${by} ${bx} ${by}`;
    const dash=['unresolved','ambiguous'].includes(edge.status)?'6 5':edge.status==='candidate'?'2 5':'';
    const label=(edge.label||edge.relationship)+(edge.count>1?' ×'+edge.count:'');
    html+=`<g class="edge${selected?.id===edge.id?' selected':''}" data-edge="${esc(edge.id)}" role="button" tabindex="0" aria-label="${esc(name(edge.source)+' to '+name(edge.target)+': '+label)}"><title>${esc(label+' · '+(statusNames[edge.status]||edge.status))}</title><path d="${path}" fill="none" stroke="transparent" stroke-width="14"/><path class="wire" d="${path}" stroke="${colors[edge.family]||colors.other}" stroke-dasharray="${dash}" marker-end="url(#arrow-${edge.family||'other'})"/>${selected?.id===edge.id?`<text x="${middle}" y="${(ay+by)/2-6}" text-anchor="middle">${esc(label)}</text>`:''}</g>`;
  }
  for(const node of data.nodes){
    if(!inView(positions.get(node.id)))continue;
    const p=positions.get(node.id),isRoot=rootIds.has(node.id),color=isRoot?'#1764c0':colors[node.family]||colors.other;
    const lines=wrap(name(node.id)),isExpanded=expanded.has(node.id),loaded=branches.get(node.id)?.pages||0;
    const hint=isExpanded?((loaded<node.pages?'More available · ':'')+'Click to collapse'):node.pages?'Click to expand':repoName(node.repository);
    html+=`<g class="node${selected?.id===node.id?' selected':''}" data-node="${esc(node.id)}" role="button" tabindex="0" aria-expanded="${isExpanded}" aria-label="${esc(name(node.id)+(isExpanded?', collapse':', expand dependencies'))}" transform="translate(${p.x},${p.y})"><title>${esc(name(node.id)+' · '+(node.type||''))}</title><rect width="${p.w}" height="${p.h}" rx="8"/><circle cx="13" cy="15" r="4" fill="${color}"/><text class="kind" x="24" y="18" style="fill:${color}">${esc(isRoot?'REPOSITORY':(node.type||'NODE').replaceAll('_',' '))}</text>${lines.slice(0,2).map((line,index)=>`<text class="name" x="12" y="37" dy="${index*14}">${esc(line+(index===1&&lines.length>2?'…':''))}</text>`).join('')}<text class="hint" x="12" y="66">${esc(hint)}</text>${node.pages?`<text class="expand" x="${p.w-18}" y="19">${isExpanded?'−':'+'}</text>`:''}</g>`;

}
function redacted(value) {
  const sensitive=/(?:^|[_-])(password|passwd|secret|token|credentials?|private.?key|authorization|cookie)(?:$|[_-])|^(value|values|default_value|resolved_value)$/i;

}
async function canonicalRecord(item) {
  if(!item?.detail)return null;
  return (await loadChunk(item.detail)).find(row=>row.id===item.id)||null;
}
async function showRecord(item,target,version) {
  const record=await canonicalRecord(item);

  const batches=await Promise.all((record.evidence_chunks||[]).map(loadChunk));
  if(version!==selectionVersion)return;
  const evidenceById=new Map(batches.flat().map(row=>[row.id,row]));
  const sources=(record.evidence||[]).map(id=>evidenceById.get(id)).filter(Boolean);
  const claims=record.properties?.architecture_claims||[];
  target.innerHTML=`${record.functional_role?`<p>${esc(record.functional_role)}</p>`:''}${record.business_meaning?`<details><summary>Meaning</summary><p>${esc(record.business_meaning)}</p></details>`:''}<div class="evidence"><h4>Source evidence · ${sources.length}</h4>${sources.slice(0,30).map(row=>`<div><a href="${esc(sourceLink(row.path))}">${esc(row.path)}${row.line?':'+row.line:''}</a><p>${esc(row.declaration||'')}</p><small class="muted">${esc(repositories.get(row.repository)?.commit||'Independent revision unavailable')}</small></div>`).join('')||'<p>No attached source evidence.</p>'}${sources.length>30?`<details><summary>${sources.length-30} more source citations</summary>${sources.slice(30).map(row=>`<a href="${esc(sourceLink(row.path))}">${esc(row.path)}:${row.line||''}</a>`).join('')}</details>`:''}</div>${claims.length?'<details><summary>Instruction investigation</summary>'+claims.map(row=>`<p>${tag(row.investigation_status)} ${esc(row.kind)} · ${esc(row.rationale)}</p>`).join('')+'</details>':''}<details><summary>Recorded fields</summary><pre class="property">${esc(JSON.stringify(redacted(record),null,2))}</pre></details>`;
}
async function renderInspector() {
  const target=$('selection'),version=++selectionVersion;
  if(!selected){target.innerHTML='<p class="muted">Select a repository, service, or relationship.</p>';return;}
  const item=selected.kind==='node'?nodes.get(selected.id):(edges.get(selected.id)||overviewEdges.get(selected.id));
  if(!item)return;
  if(item.navigation){
    target.innerHTML=`<div class="eyebrow">Navigation group</div><h3>${esc(name(item.target))}</h3><p>This grouping adds no canonical relationship or runtime call.</p><button data-select="${esc(item.target)}">Inspect group</button>`;
    return;
  }
  if(selected.kind==='node'){
    const loaded=branches.get(item.id)?.pages||0;
    target.innerHTML=`<div class="eyebrow">${esc((item.type==='DEPENDENCY_GROUP'?'DEPENDENCIES':item.type||'NODE').replaceAll('_',' '))} · ${esc(item.dependency_scope||'PRODUCTION')}</div><h3>${esc(name(item.id))}</h3><p>${esc(repoName(item.repository))}</p><div class="actions">${item.pages?`<button data-expand="${esc(item.id)}">${expanded.has(item.id)?'Collapse':'Expand'}</button>`:''}${loaded<item.pages?`<button data-more="${esc(item.id)}">Load more · ${loaded}/${item.pages}</button>`:''}${item.type!=='DEPENDENCY_GROUP'?`<button data-trace="${esc(item.id)}">Trace</button>`:''}</div><details id="source-details"><summary>Source details</summary><div id="record-content"></div></details>`;
  }else{
    target.innerHTML=`<div class="eyebrow">${esc(item.family||'Relationship')} · ${esc(item.dependency_scope||'PRODUCTION')}</div><h3>${esc(item.label||item.relationship)}</h3><p><button data-select="${esc(item.source)}">${esc(name(item.source))}</button> → <button data-select="${esc(item.target)}">${esc(name(item.target))}</button></p><p>${tag(item.status)} ${(item.assessments||[]).map(tag).join(' ')}</p>${trace?.steps?.find(step=>step.edge_id===item.id)?`<details><summary>Trace scope</summary><pre class="property">${esc(JSON.stringify(redacted(trace.steps.find(step=>step.edge_id===item.id)),null,2))}</pre><p>Declaration context and implementation alternatives do not establish executed calls.</p></details>`:''}<details><summary>Provider matching</summary><p>${esc(statusHelp[item.status]||'')}</p></details>${item.overview?`<p>${item.count} canonical source edges</p><button data-more="${esc(item.id)}">Expand source edges</button>`:''}<details id="source-details"><summary>Source details</summary><div id="record-content"></div></details>`;

async function selectItem(kind,id) {selected={kind,id};await renderInspector();draw();}
async function ensureIndex(kind,needed) {
  const pages=bootstrap[kind==='nodes'?'node_index':'edge_index'];
  const store=kind==='nodes'?nodes:edges;
  for(const key of pages){if([...needed].every(id=>store.has(id)))break;const rows=await loadChunk(key);for(const row of rows)store.set(row.id,row);}

async function activateTrace(id) {

async function renderIndex(reset=false) {

  const generation=++indexGeneration, kind=$('index-kind').value, pages=bootstrap[kind==='nodes'?'node_index':'edge_index'];indexKind=kind;
  if(!pages.length){$('index-rows').innerHTML='<p>No indexed declarations.</p>';return;}
  const rows=await loadChunk(pages[indexPage]);if(generation!==indexGeneration)return;
  const store=kind==='nodes'?nodes:edges;for(const row of rows)store.set(row.id,row);

async function renderContext() {

function renderOverview() {
  $('repo-list').innerHTML=bootstrap.repositories.map(repo=>`<button class="repo-chip" data-node="${esc(bootstrap.roots[repo.id])}"><strong>${esc(repo.name)}</strong><span>${esc(repo.kind||'repository')}</span></button>`).join('');

  $('summary').innerHTML=`<span class="pill"><strong>${bootstrap.repositories.length}</strong> repositories</span><span class="pill"><strong>${bootstrap.counts.nodes}</strong> nodes</span><span class="pill"><strong>${bootstrap.counts.edges}</strong> relationships</span>`;

function filtersChanged() {fitNext=true;draw();if($('index-panel').open)run(()=>renderIndex(true));}
function click(event) {

document.addEventListener('click',click);
document.addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)&&event.target.matches('g[role="button"]')){event.preventDefault();click(event);}});
$('relationship').innerHTML+=(bootstrap.relationships||[]).map(value=>`<option value="${esc(value)}">${esc(value.replaceAll('_',' '))}</option>`).join('');

let searchTimer; $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(filtersChanged,120);});

$('graph').addEventListener('wheel',event=>{

let drag=null;
