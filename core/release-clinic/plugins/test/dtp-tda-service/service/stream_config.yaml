# dtp-tda-service stream configuration
# ---------------------------------------------------------------------------
# This file is managed by the hosting team.  It replaces the associated_builds.yaml
# and the stream-specific sections of .env that each team previously maintained locally.
#
# One entry per stream.  Only the fields relevant to a given stream need to be
# populated — missing optional fields fall back to server defaults.
#
# Fields:
#   pit_url_template      — Confluence PIT page URL.  Use {{version}} (double
#                           braces) as the placeholder for the release version
#                           string — this must match tda/integrations/confluence.py's
#                           _build_url(), which only substitutes {{version}}. A
#                           single-brace {version} template is silently left
#                           unresolved in the final URL.
#   sonar_key_overrides   — Map of pipeline-name → Sonar project key, for
#                           pipelines whose Sonar key does not follow the default
#                           naming convention.
#   ado_field_overrides   — Map of ADO custom field names that differ from the
#                           division-wide defaults in ado_field_config.yaml.
#                           Leave empty for most streams.
#   genie_enabled         — Whether Genie regression collection is supported for
#                           this stream.  Defaults to true when omitted.
#                           Set to false for applications that do not use Genie.
# ---------------------------------------------------------------------------

streams:

  RATES:
    pit_url_template: "https://confluence.global.standardchartered.com/display/DTP/Blade+Rates+Release+{{version}}+-+Post+Implementation+Testing"
    sonar_key_overrides: {}
    ado_field_overrides: {}

  FXO:
