<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SC Node MCP — Banner 848×244</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 848px;
      height: 244px;
      overflow: hidden;
      background: #03060F;
    }

    /* ═══════════════════════════════════════════════════════
       BANNER ROOT
       ═══════════════════════════════════════════════════════ */
    .banner {
      width: 848px;
      height: 244px;
      position: relative;
      overflow: hidden;
      background: #03060F;
      display: flex;
    }

    /* ── Global dot-grid texture ── */
    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 200, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Atmospheric glow from top-left ── */
    .glow-main {
      position: absolute;
      top: -80px; left: -60px;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 180, 255, 0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Ambient right-side glow ── */
    .glow-right {
      position: absolute;
      top: 50%; right: -40px;
      transform: translateY(-50%);
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 180, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Top accent edge ── */
    .edge-top {
      position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 6;
      background: linear-gradient(90deg,
        rgba(0, 210, 255, 1) 0%,
        rgba(0, 210, 255, 0.6) 25%,
        rgba(0, 120, 255, 0.2) 60%,
        transparent 100%
      );
    }

    /* ── Bottom accent edge ── */
    .edge-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px; z-index: 6;
      background: linear-gradient(90deg,
        rgba(0, 210, 255, 0.35) 0%,
        transparent 55%
      );
    }

    /* ── Corner bracket TL ── */
    .corner-tl {
      position: absolute; top: 9px; left: 9px; z-index: 7;
      width: 13px; height: 13px;
      border-top: 1.5px solid rgba(0, 210, 255, 0.55);
      border-left: 1.5px solid rgba(0, 210, 255, 0.55);
    }

    /* ── Corner bracket BR ── */
    .corner-br {
      position: absolute; bottom: 9px; right: 9px; z-index: 7;
      width: 13px; height: 13px;
      border-bottom: 1.5px solid rgba(0, 210, 255, 0.22);
      border-right: 1.5px solid rgba(0, 210, 255, 0.22);
    }

    /* ═══════════════════════════════════════════════════════
       LEFT BRAND PANEL
       ═══════════════════════════════════════════════════════ */
    .left {
      width: 246px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 22px 24px 22px 28px;
      /* Inner grid texture on left */
      background-image:
        linear-gradient(rgba(0, 180, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 255, 0.045) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    /* Vertical right-edge fade on left panel */
    .left::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 40px;
      background: linear-gradient(90deg, transparent, rgba(3, 6, 15, 0.55));
      pointer-events: none;
    }

    .brand-tag {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.28em;
      color: rgba(0, 210, 255, 0.5);
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .brand-sc {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 70px;
      line-height: 0.87;
      letter-spacing: -0.035em;
      color: #FFFFFF;
      display: block;
    }

    .brand-node {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.06em;
      color: rgba(0, 210, 255, 0.82);
      display: block;
      margin-top: 3px;
    }

    .brand-mcp-label {
      font-family: 'DM Mono', monospace;
      font-size: 7.5px;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.12);
      text-transform: uppercase;
      display: block;
      margin-top: 5px;
    }

    .brand-credit {
      margin-top: 14px;
      font-family: 'DM Mono', monospace;
      font-size: 6.5px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.22);
      letter-spacing: 0.04em;
      line-height: 1.65;
    }

    .brand-credit .heart {
      color: rgba(255, 75, 95, 0.65);
      font-size: 7.5px;
    }

    /* ═══════════════════════════════════════════════════════
       VERTICAL DIVIDER
       ═══════════════════════════════════════════════════════ */
    .divider {
      width: 1px;
      flex-shrink: 0;
      z-index: 3;
      position: relative;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(0, 210, 255, 0.55) 18%,
        rgba(0, 210, 255, 0.9) 50%,
        rgba(0, 210, 255, 0.55) 82%,
        transparent 100%
      );
      animation: vPulse 2.8s ease-in-out infinite;
    }

    /* Divider glow dot at midpoint */
    .divider::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(0, 220, 255, 0.9);
      box-shadow: 0 0 8px 2px rgba(0, 220, 255, 0.5);
      animation: dotPulse 2.8s ease-in-out infinite;
    }

    @keyframes vPulse {
      0%, 100% { opacity: 0.55; }
      50%       { opacity: 1; }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.8); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.2); }
    }

    /* ═══════════════════════════════════════════════════════
       RIGHT TOOLS PANEL
       ═══════════════════════════════════════════════════════ */
    .right {
      flex: 1;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px 18px 18px 16px;
      gap: 9px;
    }

    .tools-row {
      display: flex;
      gap: 8px;
    }

    /* ── Tool Chip base ── */
    .chip {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.065);
      background: rgba(255, 255, 255, 0.028);
      position: relative;
      overflow: hidden;
      transition: border-color 0.35s, background 0.35s;
      cursor: default;
    }

    /* Top edge "illuminator" strip — color varies per chip */
    .chip::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
    }

    /* Inner top sheen */
    .chip::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
      pointer-events: none;
    }

    /* ── Row 1 — Azure DevOps (cyan) ── */
    .chip-ado              { border-color: rgba(0, 185, 255, 0.14); }
    .chip-ado::before      { background: rgba(0, 205, 255, 0.7); box-shadow: 0 0 6px 1px rgba(0, 210, 255, 0.4); }
    .chip-ado:hover        { border-color: rgba(0, 185, 255, 0.38); background: rgba(0, 185, 255, 0.05); }

    /* ── Row 2 — Confluence (blue) ── */
    .chip-c                { border-color: rgba(60, 130, 255, 0.14); }
    .chip-c::before        { background: rgba(75, 145, 255, 0.7); box-shadow: 0 0 6px 1px rgba(75, 145, 255, 0.35); }
    .chip-c:hover          { border-color: rgba(60, 130, 255, 0.35); background: rgba(60, 130, 255, 0.05); }

    /* ── Row 2 — Teams (purple) ── */
    .chip-t                { border-color: rgba(110, 100, 210, 0.14); }
    .chip-t::before        { background: rgba(125, 115, 225, 0.7); box-shadow: 0 0 6px 1px rgba(125, 115, 225, 0.35); }
    .chip-t:hover          { border-color: rgba(110, 100, 210, 0.35); background: rgba(110, 100, 210, 0.05); }

    /* ── Row 2 — Outlook (sky blue) ── */
    .chip-e                { border-color: rgba(40, 150, 255, 0.14); }
    .chip-e::before        { background: rgba(55, 165, 255, 0.7); box-shadow: 0 0 6px 1px rgba(55, 165, 255, 0.35); }
    .chip-e:hover          { border-color: rgba(40, 150, 255, 0.35); background: rgba(40, 150, 255, 0.05); }

    /* ── Row 2 — Nexus IQ (green) ── */
    .chip-n                { border-color: rgba(55, 215, 130, 0.14); }
    .chip-n::before        { background: rgba(65, 225, 140, 0.7); box-shadow: 0 0 6px 1px rgba(65, 225, 140, 0.35); }
    .chip-n:hover          { border-color: rgba(55, 215, 130, 0.35); background: rgba(55, 215, 130, 0.05); }

    /* ── Row 2 — SonarQube (amber) ── */
    .chip-s                { border-color: rgba(255, 145, 60, 0.14); }
    .chip-s::before        { background: rgba(255, 155, 70, 0.7); box-shadow: 0 0 6px 1px rgba(255, 155, 70, 0.35); }
    .chip-s:hover          { border-color: rgba(255, 145, 60, 0.35); background: rgba(255, 145, 60, 0.05); }

    .chip-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .chip-label {
      font-family: 'DM Mono', monospace;
      font-size: 7.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.42);
      text-align: center;
      letter-spacing: 0.05em;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Atmospherics -->
    <div class="glow-main"></div>
    <div class="glow-right"></div>

    <!-- Frame -->
    <div class="edge-top"></div>
    <div class="edge-bottom"></div>
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <!-- ══ LEFT: Brand Identity ══ -->
    <div class="left">
      <div class="brand-tag">MCP Server</div>
      <span class="brand-sc">SC</span>
      <span class="brand-node">NODE MCP</span>
      <span class="brand-mcp-label">Model Context Protocol</span>
      <div class="brand-credit">
        Built with <span class="heart">♥</span> by<br>
        CIB S2B Trade &amp; FM Engineering
      </div>
    </div>

    <!-- ══ Divider ══ -->
    <div class="divider"></div>

    <!-- ══ RIGHT: Tool Chips ══ -->
    <div class="right">

      <!-- Row 1 — Azure DevOps -->
      <div class="tools-row">

        <!-- Work Items -->
        <div class="chip chip-ado">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="rgba(0,185,255,0.8)" stroke-width="1.3" stroke-linecap="round"/>
              <rect x="9" y="3" width="6" height="4" rx="1" stroke="rgba(0,185,255,0.8)" stroke-width="1.3" fill="none"/>
              <path d="M9 12l2 2 4-4" stroke="rgba(0,225,255,0.95)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="chip-label">Work<br>Items</div>
        </div>

        <!-- Repos & PRs -->
        <div class="chip chip-ado">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="6"  cy="4"  r="2" stroke="rgba(0,185,255,0.85)" stroke-width="1.3" fill="none"/>
              <circle cx="6"  cy="20" r="2" stroke="rgba(0,185,255,0.65)" stroke-width="1.3" fill="none"/>
              <circle cx="18" cy="11" r="2" stroke="rgba(0,185,255,0.8)"  stroke-width="1.3" fill="none"/>
              <path d="M6 6v12" stroke="rgba(0,185,255,0.4)" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M6 7.5c0 0 0 2.5 3.5 4L16 12" stroke="rgba(0,185,255,0.55)" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="chip-label">Repos<br>&amp; PRs</div>
        </div>

        <!-- Pipelines -->
        <div class="chip chip-ado">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <rect x="1"    y="9.5" width="5.5" height="5" rx="1.5" stroke="rgba(0,185,255,0.85)" stroke-width="1.3" fill="none"/>
              <rect x="9.25" y="9.5" width="5.5" height="5" rx="1.5" stroke="rgba(0,185,255,0.75)" stroke-width="1.3" fill="none"/>
              <rect x="17.5" y="9.5" width="5.5" height="5" rx="1.5" stroke="rgba(0,185,255,0.65)" stroke-width="1.3" fill="none"/>
              <path d="M6.5 12h2.75M14.75 12h2.75" stroke="rgba(0,185,255,0.5)" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="chip-label">Pipelines</div>
        </div>

        <!-- Search -->
        <div class="chip chip-ado">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="10.5" cy="10.5" r="6" stroke="rgba(0,185,255,0.82)" stroke-width="1.3" fill="none"/>
              <path d="M15 15.5l4.5 4.5" stroke="rgba(0,225,255,0.9)" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M8 10h5M10.5 7.5v5" stroke="rgba(0,185,255,0.55)" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="chip-label">Code<br>Search</div>
        </div>

        <!-- Test Plans -->
        <div class="chip chip-ado">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="2" width="16" height="20" rx="2" stroke="rgba(0,185,255,0.75)" stroke-width="1.3" fill="none"/>
              <path d="M8 9l2.5 2.5L16 6"    stroke="rgba(0,225,255,0.95)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 15l2.5 2.5L16 12"  stroke="rgba(0,185,255,0.55)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="chip-label">Test<br>Plans</div>
        </div>

      </div><!-- /tools-row 1 -->

      <!-- Row 2 — External Services -->
      <div class="tools-row">

        <!-- Confluence -->
        <div class="chip chip-c">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M3 18.5c2.2-3 4.8-5.5 9-5.5s6.8 2.5 9 5.5"
                    stroke="rgba(75,145,255,0.88)" stroke-width="1.45" stroke-linecap="round" fill="none"/>
              <path d="M3 5.5c2.2 3 4.8 5.5 9 5.5s6.8-2.5 9-5.5"
                    stroke="rgba(75,145,255,0.52)" stroke-width="1.45" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <div class="chip-label">Confluence</div>
        </div>

        <!-- MS Teams -->
        <div class="chip chip-t">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="9"  cy="6.5" r="2.5" stroke="rgba(125,115,225,0.85)" stroke-width="1.3" fill="none"/>
              <circle cx="17" cy="5.5" r="2"   stroke="rgba(125,115,225,0.6)"  stroke-width="1.3" fill="none"/>
              <path d="M3.5 19.5c0-4 2.5-5.5 5.5-5.5s5.5 1.5 5.5 5.5"
                    stroke="rgba(125,115,225,0.78)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
              <path d="M14.5 16.5c.5-1.5 1.5-2 2.5-2 1.5 0 2.5 1 2.5 3.5"
                    stroke="rgba(125,115,225,0.48)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <div class="chip-label">MS<br>Teams</div>
        </div>

        <!-- Outlook Email -->
        <div class="chip chip-e">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="5" width="20" height="14" rx="2" stroke="rgba(55,165,255,0.82)" stroke-width="1.3" fill="none"/>
              <path d="M2 7.5l10 6.5 10-6.5" stroke="rgba(85,195,255,0.8)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <div class="chip-label">Outlook</div>
        </div>

        <!-- Nexus IQ -->
        <div class="chip chip-n">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 5.5v6.5c0 4.5 3.5 7.5 8 9 4.5-1.5 8-4.5 8-9V5.5L12 2z"
                    stroke="rgba(65,225,140,0.82)" stroke-width="1.3" fill="none"/>
              <path d="M9 12l2 2 4-4" stroke="rgba(100,255,170,0.95)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="chip-label">Nexus<br>IQ</div>
        </div>

        <!-- SonarQube -->
        <div class="chip chip-s">
          <div class="chip-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M3 19.5c1-5 3-9 6-11 2-1.5 4-2 6.5-1C19 9 20.5 13.5 20.5 19.5"
                    stroke="rgba(255,155,70,0.82)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
              <circle cx="12" cy="10" r="2.5" stroke="rgba(255,175,90,0.85)" stroke-width="1.3" fill="none"/>
              <circle cx="12" cy="10" r="0.8" fill="rgba(255,175,90,0.85)"/>
            </svg>
          </div>
          <div class="chip-label">Sonar<br>Qube</div>
        </div>

      </div><!-- /tools-row 2 -->

    </div><!-- /right -->

  </div><!-- /banner -->
</body>
</html>
